      {ce:1909, title:"Blériot crosses the Channel", desc:"Louis Blériot flies a monoplane across the English Channel, proving aircraft could vault natural barriers between nations."},
      {ce:1910, title:"Mexican Revolution begins", desc:"Revolt against the long dictatorship of Porfirio Díaz plunges Mexico into a decade of revolution and civil war."},
      {ce:1910, title:"Japan annexes Korea", desc:"Japan formally annexes Korea, imposing thirty-five years of harsh colonial rule over the peninsula."},
      {ce:1910, title:"Union of South Africa", desc:"Britain merges its South African colonies into a self-governing union built on entrenched white-minority rule."},
      {ce:1911, title:"China's Xinhai Revolution", desc:"Uprisings topple the Qing dynasty, ending over two millennia of imperial rule and centuries of Manchu power."},
      {ce:1911, title:"Amundsen reaches South Pole", desc:"Roald Amundsen's Norwegian team becomes the first to reach the South Pole, narrowly beating Scott's doomed expedition."},
      {ce:1911, title:"The atomic nucleus", desc:"Ernest Rutherford's experiments reveal the atom's tiny, dense nucleus, overturning the notion of a uniform atom."},
      {ce:1912, title:"The Qing dynasty falls", desc:"China's boy emperor abdicates and a republic is declared, ending more than two thousand years of dynastic rule."},
      {ce:1912, title:"The Titanic sinks", desc:"The supposedly unsinkable liner strikes an iceberg on its maiden voyage and sinks, killing over fifteen hundred people."},
      {ce:1912, title:"The First Balkan War", desc:"Allied Balkan states drive the Ottomans from nearly all their European lands, stoking the tensions before world war."},
      {ce:1913, title:"The moving assembly line", desc:"Ford's moving assembly line cuts car assembly from hours to minutes, transforming manufacturing and mass production."},
      {ce:1913, title:"Bohr's atomic model", desc:"Niels Bohr pictures electrons circling the nucleus in fixed quantum orbits, explaining the colors that atoms emit."},
      {ce:1913, title:"The Rite of Spring riots", desc:"Stravinsky's pounding, dissonant ballet score sparks a near-riot at its Paris premiere, heralding musical modernism."},
      {ce:1914, title:"World War I", desc:"The assassination of Archduke Franz Ferdinand drags Europe's tangled alliances into a catastrophic industrial war."},
      {ce:1914, title:"The Panama Canal opens", desc:"A canal cut across Panama joins the Atlantic and Pacific, sparing ships the long, perilous voyage around South America."},
      {ce:1915, title:"Einstein's general relativity", desc:"Einstein reveals that mass warps space and time itself, overturning Newtonian physics and reshaping our view of the cosmos."},
      {ce:1915, title:"The Armenian Genocide", desc:"The Ottoman Empire deports and murders over a million Armenians, an atrocity that still shapes regional memory."},
      {ce:1916, title:"The Easter Rising", desc:"Irish republicans seize Dublin against British rule, an uprising that ignites the long road to Irish independence."},
      {ce:1917, title:"The Russian Revolution", desc:"Lenin's Bolsheviks topple Russia's government, founding the world's first communist state and reshaping the entire century."},
      {ce:1917, title:"The Balfour Declaration", desc:"Britain endorses a Jewish national home in Palestine, a pledge that echoes through decades of Middle Eastern conflict."},
      {ce:1918, title:"The Spanish flu pandemic", desc:"A savage influenza circles the globe, killing tens of millions and outstripping the death toll of the war."},
      {ce:1919, title:"The Treaty of Versailles", desc:"Victorious Allies impose punishing terms on Germany, breeding resentment that helps ignite a second world war."},
      {ce:1919, title:"China's May Fourth Movement", desc:"Chinese students protest foreign concessions and old traditions, sparking a modern nationalist and intellectual awakening."},
      {ce:1920, title:"The League of Nations", desc:"The first global body for collective security convenes, aiming to prevent war through diplomacy and cooperation."},
      {ce:1922, title:"Insulin treats diabetes", desc:"A teenage patient becomes the first saved by insulin, turning a fatal diagnosis into a manageable condition."},
      {ce:1922, title:"Tutankhamun's tomb discovered", desc:"Howard Carter opens a pharaoh's near-intact tomb, dazzling the world and igniting a craze for ancient Egypt."},
      {ce:1922, title:"The Soviet Union forms", desc:"Bolshevik republics unite into the USSR, forging a communist superpower that dominates much of the coming century."},
      {ce:1925, title:"Galaxies beyond our own", desc:"Edwin Hubble proves spiral nebulae are distant galaxies, revealing a universe vastly larger than anyone had imagined."},
      {ce:1926, title:"The first liquid-fueled rocket", desc:"Robert Goddard launches a small liquid-fueled rocket, pioneering the propulsion that will one day reach space."},
      {ce:1927, title:"Lindbergh crosses the Atlantic", desc:"Charles Lindbergh flies solo and nonstop from New York to Paris, thrilling the world and heralding aviation's age."},
      {ce:1927, title:"The first talking picture", desc:"The Jazz Singer brings synchronized sound to cinema, ending the silent era and transforming mass entertainment."},
      {ce:1927, title:"The expanding universe", desc:"Georges Lemaitre proposes the cosmos is expanding from a primeval atom, planting the seed of Big Bang theory."},
      {ce:1928, title:"Antibiotics", desc:"Fleming discovers penicillin; infectious disease loses its grip."},
      {ce:1929, title:"The Wall Street Crash", desc:"Panic selling wipes out fortunes on the New York exchange, plunging the world into the Great Depression."},
      {ce:1930, title:"Gandhi's Salt March", desc:"Gandhi leads Indians to the sea to make salt, defying British taxes through disciplined mass nonviolent resistance."},
      {ce:1930, title:"Pluto is discovered", desc:"Clyde Tombaugh spots a faint point beyond Neptune, adding a distant ninth world to the solar system."},
      {ce:1931, title:"The Empire State Building", desc:"New York raises the world's tallest skyscraper in barely a year, an emblem of soaring modern ambition."},
      {ce:1932, title:"Discovery of the neutron", desc:"James Chadwick identifies the neutral particle in the atom's core, unlocking the secrets of modern nuclear physics."},
      {ce:1933, title:"Hitler seizes power", desc:"Adolf Hitler becomes German chancellor and swiftly builds a dictatorship, setting Europe on the road to catastrophe."},
      {ce:1933, title:"Roosevelt's New Deal", desc:"President Roosevelt launches sweeping programs to fight the Depression, redefining the role of American government."},
      {ce:1934, title:"The Long March", desc:"Mao's beleaguered communists trek thousands of miles to survival, forging the leadership that will one day rule China."},
      {ce:1935, title:"The Nuremberg Laws", desc:"Nazi Germany strips Jews of citizenship and rights, codifying the persecution that leads step by step toward genocide."},
      {ce:1936, title:"The Spanish Civil War", desc:"Fascists and republicans wage a brutal war in Spain, a bloody rehearsal for the wider conflict soon to come."},
      {ce:1936, title:"Jesse Owens in Berlin", desc:"Black American sprinter Jesse Owens wins four golds at Hitler's Olympics, puncturing Nazi myths of racial supremacy."},
      {ce:1936, title:"Turing's universal machine", desc:"Alan Turing conceives a theoretical machine that defines computation, laying the foundation for every computer to come."},
      {ce:1937, title:"The Nanjing Massacre", desc:"Japanese troops slaughter hundreds of thousands in China's captured capital, one of the war's most savage atrocities."},
      {ce:1937, title:"The Golden Gate Bridge", desc:"San Francisco spans its windswept strait with a soaring orange bridge, an enduring icon of engineering daring."},
      {ce:1938, title:"The Night of Broken Glass", desc:"Nazi mobs torch synagogues and smash Jewish shops across Germany, a violent prelude to the Holocaust."},
      {ce:1939, title:"World War II", desc:"The deadliest conflict in human history."},
      {ce:1940, title:"The Battle of Britain", desc:"Britain's outnumbered pilots repel Germany's air onslaught, denying Hitler the skies and handing him his first defeat."},
      {ce:1941, title:"Attack on Pearl Harbor", desc:"Japan's surprise raid on the US Pacific fleet draws America into the war, reshaping the global balance of power."},
      {ce:1942, title:"The Holocaust", desc:"Nazi Germany systematizes the industrial murder of six million Jews, the darkest genocide in human history."},
      {ce:1944, title:"The D-Day landings", desc:"Allied forces storm Normandy's beaches in history's largest seaborne invasion, opening the road to liberate Europe."},
      {ce:1945, title:"The nuclear age", desc:"The first atomic bombs are built and used; humanity can now end itself."},
      {ce:1945, title:"The United Nations founded", desc:"Fifty nations forge a body to keep the peace, replacing the failed League after a devastating world war."},
      {ce:1945, title:"Indonesia declares independence", desc:"Sukarno proclaims Indonesian independence from Dutch rule, an early spark in Asia's sweeping wave of decolonization."},
      {ce:1946, title:"The ENIAC computer", desc:"Engineers unveil a room-sized electronic computer that calculates thousands of times faster than any human could."},
      {ce:1947, title:"India's independence and partition", desc:"British India wins freedom but splits into India and Pakistan, uprooting millions amid horrific communal violence."},
      {ce:1947, title:"The transistor is invented", desc:"Bell Labs builds the tiny switch that will replace bulky vacuum tubes, birthing all of modern electronics."},
      {ce:1947, title:"Breaking the sound barrier", desc:"Chuck Yeager pilots a rocket plane past the speed of sound, opening the exhilarating era of supersonic flight."},
      {ce:1948, title:"The State of Israel", desc:"Jewish leaders declare Israel's independence, fulfilling Zionist hopes and igniting enduring conflict with Arab neighbors."},
      {ce:1948, title:"Apartheid in South Africa", desc:"South Africa's government enforces rigid racial segregation, subjugating the Black majority under a brutal legal system."},
      {ce:1948, title:"Gandhi is assassinated", desc:"A Hindu extremist shoots Mahatma Gandhi, silencing the apostle of nonviolence months after India's hard-won freedom."},
      {ce:1948, title:"The Berlin Airlift", desc:"Western planes supply blockaded West Berlin for months, an early Cold War standoff won without firing a shot."},
      {ce:1949, title:"The People's Republic of China", desc:"Mao proclaims a communist republic after victory in civil war, transforming the world's most populous nation."},
      {ce:1949, title:"The founding of NATO", desc:"Western democracies form a military alliance against Soviet expansion, anchoring the Cold War balance of power."},
      {ce:1950, title:"The Korean War begins", desc:"North Korea invades the South, drawing in China and America and freezing the peninsula's division for generations."},
      {ce:1953, title:"The structure of DNA", desc:"The double helix reveals the code of life."},
      {ce:1953, title:"The conquest of Everest", desc:"Edmund Hillary and Tenzing Norgay reach Earth's highest summit, achieving a feat long thought impossible."},
      {ce:1953, title:"The death of Stalin", desc:"The Soviet dictator's death ends decades of terror and opens a cautious thaw across the communist bloc."},
      {ce:1954, title:"Brown versus Board of Education", desc:"The US Supreme Court outlaws segregated schools, a landmark ruling that energizes the American civil-rights movement."},
      {ce:1955, title:"The polio vaccine", desc:"Jonas Salk's vaccine is declared safe and effective, beginning the retreat of a disease that crippled children."},
      {ce:1955, title:"The Montgomery Bus Boycott", desc:"Rosa Parks' arrest sparks a yearlong Black boycott of buses, launching the modern American civil-rights struggle."},
      {ce:1956, title:"The Suez Crisis", desc:"Egypt seizes the canal and repels an Anglo-French-Israeli attack, signaling the twilight of European empire."},
      {ce:1957, title:"The space age", desc:"Sputnik becomes the first artificial satellite."},
      {ce:1957, title:"Sputnik orbits Earth", desc:"The Soviets launch the first artificial satellite, stunning the world and igniting the superpower space race."},
      {ce:1957, title:"The Treaty of Rome", desc:"Six nations create a common market in Europe, planting the seed that grows into the European Union."},
      {ce:1958, title:"The integrated circuit", desc:"Jack Kilby packs a whole circuit onto one chip, launching the miniaturization that powers the digital age."},
      {ce:1958, title:"The Great Leap Forward", desc:"Mao's forced industrialization drive collapses agriculture, triggering a famine that kills tens of millions."},
      {ce:1959, title:"The Cuban Revolution", desc:"Fidel Castro's rebels topple Cuba's dictator, installing a defiant communist state on America's very doorstep."},
      {ce:1960, title:"The Year of Africa", desc:"Seventeen African colonies win independence in a single year, dismantling European empire across the continent."},
      {ce:1961, title:"The first human in space", desc:"Yuri Gagarin orbits the Earth, becoming the first person in space and handing the Soviets a triumph."},
      {ce:1961, title:"The Berlin Wall rises", desc:"East Germany walls off West Berlin overnight, sealing the divide between the communist East and capitalist West."},
      {ce:1962, title:"Silent Spring published", desc:"Rachel Carson exposes the ravages of pesticides, awakening the world to ecology and birthing the environmental movement."},
      {ce:1962, title:"The Cuban Missile Crisis", desc:"Soviet missiles in Cuba bring the superpowers within hours of nuclear war before a tense last-minute deal."},
      {ce:1963, title:"The March on Washington", desc:"Martin Luther King proclaims his dream before a vast crowd, crystallizing the moral call for racial equality."},
      {ce:1963, title:"The assassination of Kennedy", desc:"A sniper kills President John Kennedy in Dallas, a shattering trauma seared into a whole generation's memory."},
      {ce:1964, title:"The Civil Rights Act", desc:"Landmark US law bans discrimination by race, dismantling legal segregation after years of protest and struggle."},
      {ce:1965, title:"The Big Bang confirmed", desc:"Astronomers detect the cosmic microwave background, the faint afterglow proving the universe began in a hot burst."},
      {ce:1966, title:"China's Cultural Revolution", desc:"Mao unleashes youthful Red Guards against perceived enemies, convulsing China in a decade of chaos and purges."},
      {ce:1967, title:"The Six-Day War", desc:"Israel routs its Arab neighbors in six days, seizing territory that defines the conflict for decades afterward."},
      {ce:1967, title:"The first heart transplant", desc:"Christiaan Barnard transplants a human heart in South Africa, a bold and startling leap for modern surgery."},
      {ce:1968, title:"The theory of plate tectonics", desc:"Geologists confirm Earth's crust rides drifting plates, explaining earthquakes, volcanoes, and the wandering of continents."},
      {ce:1968, title:"Martin Luther King killed", desc:"An assassin's bullet fells the civil-rights leader in Memphis, igniting grief and riots across America."},
      {ce:1968, title:"The Prague Spring", desc:"Czechoslovak reforms bloom until Soviet tanks crush them, exposing the harsh limits of freedom behind the Iron Curtain."},
      {ce:1969, title:"The Moon landing", desc:"Apollo 11 lands humans on another world — and ARPANET, the internet's ancestor, goes live."},
      {ce:1969, title:"The first ARPANET message", desc:"Two distant computers exchange their first message, the tentative birth of the network that becomes the internet."},
      {ce:1969, title:"The Woodstock festival", desc:"Half a million gather for music and peace on a New York farm, defining the spirit of the counterculture."},
      {ce:1971, title:"Bangladesh wins independence", desc:"After a brutal war and Indian intervention, East Pakistan breaks away to become the new nation of Bangladesh."},

    const kwHas = (s, arr) => arr.some(w => s.includes(w));
    function classify(ev){
      if (OVERRIDES[ev.title]) return OVERRIDES[ev.title];

      const ya = AGE - ev.t;
      if (ya > 4.6e9) return 'cosmos';               // before the Sun: cosmology

        if (kwHas(s, KW.tech)) return 'tech';
        return 'civ';
      }
      if (ya <= 7.2e6){                              // human prehistory
        if (kwHas(s, KW.human)) return 'human';
        if (kwHas(s, KW.life)) return 'life';
        if (kwHas(s, KW.planet)) return 'planet';
        return 'human';

      // deep time: geology vs biology (the &&!life guard keeps biology out of planet)
      if (kwHas(s, KW.planet) && !kwHas(s, KW.life)) return 'planet';
      if (kwHas(s, KW.life)) return 'life';
      if (kwHas(s, KW.cosmos)) return 'cosmos';
      if (kwHas(s, KW.planet)) return 'planet';
      return ya > 3.9e9 ? 'planet' : 'life';   // before life existed, default to planet

      tip.style.display = 'block';
      const w = tip.offsetWidth, h = tip.offsetHeight;
      let x = cx + 14, y = cy + 14;
      if (x + w > innerWidth - 8) x = cx - 14 - w;
      if (y + h > innerHeight - 8) y = cy - 14 - h;
      tip.style.left = Math.max(4, x) + 'px';
      tip.style.top = Math.max(4, y) + 'px';
    }
    if (canHover){
      let tipRaf = false, lastXY = null;
      const onHover = (e) => {
        lastXY = [e.clientX, e.clientY];
        if (tipRaf) return; tipRaf = true;
        requestAnimationFrame(() => {
          tipRaf = false;
          if (overlayOpen || scrubbing || !lastXY){ hideTip(); return; }
          const [cx, cy] = lastXY;
          let gi = null;
          if (mosaicOn){ gi = mosaicBlockAt(cx, cy); }
          else {
            const el = document.elementFromPoint(cx, cy);
            const cell = el && el.closest ? el.closest('.cell') : null;
            if (cell && cell.dataset.gi !== undefined) gi = +cell.dataset.gi;
          }
          if (gi == null || gi >= blocks){ hideTip(); return; }
          showTip(gi, cx, cy);
        });
      };
      scroller.addEventListener('pointermove', onHover, { passive: true });
      scroller.addEventListener('pointerleave', hideTip, { passive: true });
      scroller.addEventListener('pointerdown', hideTip, { passive: true });
    }

    // ── paint the visible pool ─────────────────────────────────
    // each block is tinted with its dominant category's accent colour;
    // brightness scales with event density (log) so it never blows out.
    function paintPool(){
      if (mosaicOn){ drawMosaic(); return; }
      const base = firstRow * cols;
      const flashing = performance.now() < flashUntil;
      const filtered = active.size < CAT_ORDER.length;   // a real subset is selected
      for (let k = 0; k < pool.length; k++){
        const gi = base + k, el = pool[k];
        el.dataset.gi = gi;
        if (gi >= blocks){ el.className = 'cell future'; el.style.background = ''; continue; }
        const n = blockCounts.get(gi) || 0;
        if (n === 0){
          // no matching events: fainter when a filter is narrowing the view
          el.style.background = `rgba(240,240,240,${filtered ? 0.02 : 0.04})`;
        } else {
          const a = 0.30 + 0.55 * (Math.log1p(n) / Math.log1p(maxBlockCount));
          el.style.background = blockBg(gi, a);
        }
        let cls = 'cell';
        if (gi === 0) cls += ' origin';
        if (gi === nowBlock) cls += ' now';
        if (gi === cursorGi) cls += ' cursor';
        if (flashing){
          const t = gi * unit();
          if (t >= flashT0 && t < flashT1) cls += ' flash';
        }
        el.className = cls;
      }
    }

    // ── viewport-space annotations (era lines + the two end tags) ──
    // Nothing here lives in the scrollable content: each element is placed at
    // its live viewport Y every frame. That keeps them pixel-accurate at any
    // zoom AND stops them from extending scrollHeight — which, when geared,
    // used to create a receding wall you couldn't scroll past. The overlay is
    // shifted up NOTE_OFF px (into the top margin) so the big-bang pill has
    // room to sit above its first-row square.
    const NOTE_OFF = 36;
    const gridnotes = $('gridnotes');
    const cellTop = gi => gridPad + Math.floor(gi / cols) * rowH - realTop();
    let tagBB = null, tagNow = null;
    function buildTags(){
      const mk = (cls, html) => {
        const el = document.createElement('div');
        el.className = 'gtag ' + cls;
        el.innerHTML = '<span class="pill">' + html + '</span><i></i>';
        el.hidden = true;
        gridnotes.appendChild(el);
        return el;
      };
      tagBB = mk('up', '<b>the big bang</b> — time starts here');
      tagNow = mk('down', '<b>today</b> — you are here');
    }
    function placeTag(el, gi, preferUp){
      const W = scroller.clientWidth, H = scroller.clientHeight, pitch = cellPx + gap;
      const left0 = Math.max(0, (W - (cols * pitch - gap)) / 2);
      const sqTop = cellTop(gi), sqBot = sqTop + cellPx;
      if (sqBot < -40 || sqTop > H + 40){ el.hidden = true; return; }
      el.hidden = false;
      const pill = el.querySelector('.pill'), line = el.querySelector('i');
      const pillW = pill.offsetWidth || 170, pillH = pill.offsetHeight || 22;
      const conn = Math.max(6, Math.min(12, Math.round(rowH * 0.45)));   // compact, always fits
      // the big-bang pill sits above its square (it has the top margin to do so,
      // and only flips below if somehow starved). The today pill ALWAYS sits
      // below its square — never flips up — and is clamped to stay on screen.
      let up = preferUp;
      if (up && sqTop - conn - pillH < -NOTE_OFF + 2) up = false;
      el.classList.toggle('up', up);
      el.classList.toggle('down', !up);
      line.style.height = conn + 'px';
      let top = NOTE_OFF + (up ? sqTop - conn - pillH : sqBot);
      if (!up) top = Math.min(top, NOTE_OFF + H - pillH - conn - 3);      // keep the pill fully visible
      el.style.top = top + 'px';
      const cx = left0 + (gi % cols) * pitch + cellPx / 2;
      const x = Math.max(4, Math.min(W - pillW - 4, cx - pillW / 2));
      el.style.left = x + 'px';
      line.style.marginLeft = Math.max(2, Math.min(pillW - 3, cx - x)) + 'px';
    }
    function positionNotes(){
      const H = scroller.clientHeight;
      let last = -1e9;
      for (const el of eraEls){
        const y = gridPad + el._ry - realTop();
        if (y < 6 || y > H - 6 || y - last < 15){ el.hidden = true; continue; }
        el.hidden = false; last = y;
        el.style.top = (NOTE_OFF + y) + 'px';
      }
      if (tagBB) placeTag(tagBB, 0, true);
      if (tagNow) placeTag(tagNow, nowBlock, false);
    }
    function render(){
      const rt = vtop, H = scroller.clientHeight;
      if (mosaicOn){
        // re-slice the canvas when the viewport nears the drawn window's edge
        const vr0 = Math.floor(rt / rowH);
        const vr1 = Math.ceil((rt + H) / rowH);
        if ((vr0 < mosR0 + 4 && mosR0 > 0) || (vr1 > mosR0 + mosRows - 4 && mosR0 + mosRows < totalRows))
          drawMosaic();
        else mosaic.style.top = (gridPad + mosR0 * rowH - vtop) + "px";
        positionNotes(); syncBar(); syncPos(); return;
      }
      const maxFirst = Math.max(0, totalRows - pool.length / cols);
      const r0 = Math.min(maxFirst, Math.max(0, Math.floor(rt / rowH) - OVERSCAN));
      if (r0 !== firstRow){
        firstRow = r0;
        paintPool();
      }
      win.style.transform = `translateY(${gridPad + r0 * rowH - vtop}px)`;
      positionNotes(); syncBar(); syncPos();
    }

    // ── bottom bar = a scrollbar through time ──────────────────
    function syncBar(){
      const w = Math.min(100, scroller.clientHeight / spacerH * 100);
      seg.style.left = Math.max(0, Math.min(100 - w, realTop() / spacerH * 100)) + "%";
      seg.style.width = w + "%";
    }
    function timeAtY(viewY){
      return Math.max(0, ((realTop() + viewY - gridPad) / rowH) * cols * unit());
    }
    // compact "years ago" for the always-visible readout
    function agoShort(ya){
      if (ya <= 0) return "today";
      if (ya >= 1e9) return trim(ya/1e9) + "B yrs ago";
      if (ya >= 1e6) return trim(ya/1e6) + "M yrs ago";
      if (ya >= 10000) return commas(ya) + " yrs ago";
      return calendar(Math.round(PRESENT_YEAR - ya));
    }
    // odometer readout: the year counter sweeps toward its target every frame,
    // so scrolling visibly spins through the years in between instead of
    // jumping millions at a time. Runs only while the value is still moving.
    let yaShown = null, yaTarget = 0, yaRaf = 0;
    function tickYa(){
      yaRaf = 0;
      const d = yaTarget - yaShown;
      if (Math.abs(d) < 1) yaShown = yaTarget;
      else { yaShown += d * 0.16; yaRaf = requestAnimationFrame(tickYa); }
      posTime.textContent = " · ≈ " + commas(yaShown) + " years ago";
    }
    function stopYa(){ if (yaRaf){ cancelAnimationFrame(yaRaf); yaRaf = 0; } }
    // at the very bottom the readout becomes a live clock: 13.787 billion
    // years of scrolling lands you on the actual current second
    let clockTimer = 0;
    function paintClock(){
      const d = new Date();
      posTime.textContent = " · " +
        d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }).toLowerCase() +
        " · " +
        d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', second:'2-digit' }).toLowerCase();
    }
    function startClock(){ if (!clockTimer){ paintClock(); clockTimer = setInterval(paintClock, 1000); } }
    function stopClock(){ if (clockTimer){ clearInterval(clockTimer); clockTimer = 0; } }
    function syncPos(){
      const H = scroller.clientHeight;
      if (vmax <= 4){                            // the whole grid is on screen
        stopYa(); stopClock(); yaShown = null;
        posEra.textContent = "all of time";
        posTime.textContent = " · big bang → today";
        return;
      }
      // the anchor point slides down the viewport as you scroll, so the readout
      // is exactly "the big bang" at the very top and exactly "today" at the end
      const f = Math.min(1, Math.max(0, vtop / vmax));
      const t = Math.min(AGE, Math.max(0, timeAtY(f * H)));
      const ya = AGE - t;
      if (ya < 1){
        stopYa(); yaShown = 0;                   // resume counting up from 0
        posEra.textContent = "today";
        startClock();
        return;
      }
      stopClock();
      posEra.textContent = eraOf(ya);
      yaTarget = Math.round(ya);
      if (yaShown == null) yaShown = yaTarget;   // first paint: no sweep
      if (!yaRaf) yaRaf = requestAnimationFrame(tickYa);
    }

    function buildTicks(){
      // only the two endpoints are labelled; every milestone in between is a
      // hoverable event mark instead
      const marks = [
        { p: 0, label: "big bang", cls: "l" },
        { p: 1, label: "now", cls: "r" },
      ];
      ticksEl.innerHTML = marks.map(m =>
        `<button type="button" class="tick ${m.cls}" data-p="${m.p}" aria-label="Jump to ${m.label}"><i></i>${m.label}</button>`
      ).join("");
    }
    // colour-coded event markers along the timeline, placed by when they
    // happened (linear in time, so recent history clusters near "now").
    // Only shown categories are drawn; near-coincident same-colour marks merge.
    const evstrip = $('evstrip');
    function buildMarks(){
      const seen = new Set(), html = [];
      for (let i = 0; i < EVENTS.length; i++){
        const ev = EVENTS[i];
        if (!active.has(ev.c)) continue;
        const pct = (ev.t / AGE) * 100;
        const key = Math.round(pct * 5) + ":" + ev.c;   // ~0.2% resolution per colour
        if (seen.has(key)) continue;
        seen.add(key);
        html.push(`<span class="evmark" data-i="${i}" data-t="${ev.t}" style="left:${pct.toFixed(3)}%;background:${rgba(ev.c,0.9)}"></span>`);
      }
      evstrip.innerHTML = html.join("");
    }
    // jump the grid to a moment and flash its square
    function jumpToTime(t){
      const gi = Math.max(0, Math.min(blocks - 1, Math.floor(t / unit())));
      scrollToRealY(Math.floor(gi / cols) * rowH - scroller.clientHeight / 2);
      flashT0 = gi * unit(); flashT1 = flashT0 + unit();
      flashUntil = performance.now() + 1400;
      repaintCursor();
      setTimeout(repaintCursor, 1500);
    }
    evstrip.addEventListener('click', (e) => {
      const mkEl = e.target.closest('.evmark');
      if (mkEl) jumpToTime(parseFloat(mkEl.dataset.t));
    });

    // hover a mark → a rich preview of the event(s) at that moment, before
    // you decide to click to jump. Events sharing the mark's spot are grouped.
    const evtip = $('evtip');
    function marksEventsAt(mkEl){
      const t = parseFloat(mkEl.dataset.t), i = +mkEl.dataset.i, c = EVENTS[i].c;
      // gather nearby same-category events the mark de-duplicates (±0.1% of AGE)
      const win = AGE * 0.001, out = [];
      for (let j = Math.max(0, i - 40); j < Math.min(EVENTS.length, i + 40); j++){
        if (EVENTS[j].c === c && Math.abs(EVENTS[j].t - t) <= win && active.has(EVENTS[j].c)) out.push(EVENTS[j]);
      }
      return out.length ? out : [EVENTS[i]];
    }
    function showEvTip(mkEl){
      const evs = marksEventsAt(mkEl);
      const lead = evs[0];
      let html = `<div class="evtip-when">${esc(eventWhen(lead.t))}</div>`;
      for (const ev of evs.slice(0, 4))
        html += `<div class="evtip-row"><i style="background:${rgba(ev.c,1)}"></i><span>${esc(ev.title)}</span></div>`;
      if (evs.length > 4) html += `<div class="evtip-more">+ ${evs.length - 4} more · click to jump</div>`;
      else html += `<div class="evtip-more">click to jump</div>`;
      evtip.innerHTML = html;
      evtip.style.display = 'block';
      const mr = mkEl.getBoundingClientRect();
      const w = evtip.offsetWidth, h = evtip.offsetHeight;
      let x = mr.left + mr.width / 2 - w / 2;
      x = Math.max(6, Math.min(innerWidth - w - 6, x));
      evtip.style.left = x + 'px';
      evtip.style.top = Math.max(6, mr.top - h - 8) + 'px';
    }
    function hideEvTip(){ evtip.style.display = 'none'; }
    if (canHover){
      evstrip.addEventListener('pointermove', (e) => {
        const mkEl = e.target.closest ? e.target.closest('.evmark') : null;
        if (mkEl) showEvTip(mkEl); else hideEvTip();
      }, { passive: true });
      evstrip.addEventListener('pointerleave', hideEvTip, { passive: true });
    }

    // tap an era marker → jump the scroll to that moment in time
    ticksEl.addEventListener('click', (e) => {
      const t = e.target.closest('.tick');
      if (!t) return;
      scrollToRealY(parseFloat(t.dataset.p) * Math.max(0, spacerH - scroller.clientHeight));
    });

    // ── zoom (block size), keeping an anchor moment fixed on screen ──
    function zoomTo(newIdx, anchorT, anchorY){
      newIdx = Math.max(0, Math.min(LAST, newIdx));
      if (newIdx === unitIdx) return;
      setup(newIdx);
      scrollToRealY((anchorT / (unit() * cols)) * rowH - anchorY);
      render();
    }
    // stepper zooms anchor the BOTTOM edge — the most recent moment on screen
    // stays exactly where it is, so you never have to scroll back to it
    const stepZoom = dir => {
      const bot = scroller.clientHeight;
      zoomTo(unitIdx + dir, timeAtY(bot), bot);
    };

    // "zoom into this period": finer blocks, period parked near the top
    function focusSpan(t0, t1){
      const target = Math.max(0, unitIdx - 2);
      if (target !== unitIdx) setup(target);
      scrollToRealY((t0 / (unit() * cols)) * rowH - rowH);
      flashT0 = t0; flashT1 = t1; flashUntil = performance.now() + 1400;
      firstRow = -1; render();
      setTimeout(() => { firstRow = -1; render(); }, 1500);
    }

    // ── overlay ────────────────────────────────────────────────
    let overlayOpenedAt = 0, lastFocus = null;
    function openOverlay(){
      lastFocus = document.activeElement;
      $('tip').style.display = 'none';
      overlay.hidden = false; overlayOpen = true; overlayOpenedAt = performance.now();
      $('close').focus();
    }
    function closeOverlay(){
      overlay.hidden = true; overlayOpen = false;
      (lastFocus && lastFocus.focus ? lastFocus : scroller).focus();
      // keep your place: briefly flash the square you were reading
      if (!mosaicOn && lastGi != null){
        flashT0 = lastGi * unit(); flashT1 = flashT0 + unit();
        flashUntil = performance.now() + 1400;
        firstRow = -1; render();
        setTimeout(() => { firstRow = -1; render(); }, 1500);
      }
    }

    // event list rendering — escape all data, and break a dense period into
    // labelled sub-periods (recursively) so hundreds of events stay scannable
    const evHtml = ev => `
          <div class="ev">
            <div class="ev-when">${esc(eventWhen(ev.t))}<span class="ev-cat" style="color:${rgba(ev.c,1)};background:${rgba(ev.c,0.14)}">${esc(CATS[ev.c].label)}</span></div>
            <p class="ev-title">${esc(ev.title)}</p>
            <p class="ev-desc">${esc(ev.desc)}</p>
          </div>`;
    function groupLabel(a, b){
      const s = ago(AGE - a), e = (AGE - b) <= 0 ? "today" : ago(AGE - b);
      return s === e ? s : s + " → " + e;
    }
    // split a dense span into labelled sub-periods; once bins get down to
    // calendar scale (≤12k yrs) switch to millennium/century groups so the
    // ~700-event civilization square reads as an outline, not a flat wall.
    // A depth cap + a "step must subdivide" guard guarantee termination.
    function eventsHtml(list, tLo, tHi, depth){
      const span = tHi - tLo;
      if (list.length <= 18 || span <= 100 || depth >= 6) return list.map(evHtml).join("");
      // pick a bin size that strictly subdivides this span
      const step = span <= 12000 ? (span > 3000 ? 1000 : 100) : span / 10;
      if (step >= span) return list.map(evHtml).join("");
      const edges = [];
      if (span <= 12000){                          // calendar-aligned bins
        for (let y = Math.ceil(tLo / step) * step; y < tHi; y += step)
          if (y > tLo) edges.push(y);
      } else {
        for (let i = 1; i < 10; i++) edges.push(tLo + i * step);
      }
      edges.unshift(tLo); edges.push(tHi);
      let html = "";
      for (let i = 0; i < edges.length - 1; i++){
        const a = edges[i], b = edges[i+1];
        if (b <= a) continue;
        const sub = list.filter(ev => ev.t >= a && ev.t < b);
        if (!sub.length) continue;
        html += `<div class="grp"><div class="grp-h">${esc(groupLabel(a, b))}  ·  ${sub.length}</div>${eventsHtml(sub, a, b, depth + 1)}</div>`;
      }
      return html;
    }

    // find the block index of the nearest event strictly before / after [t0,t1),
    // skipping categories the filter has hidden. Returns null if none.
    function neighborBlock(t0, t1, dir){
      const u = unit();
      let i = dir < 0 ? lowerBound(t0) - 1 : lowerBound(t1);
      for (; i >= 0 && i < EVENTS.length; i += dir){
        if (active.has(EVENTS[i].c)) return Math.floor(EVENTS[i].t / u);
      }
      return null;
    }

    function select(gi){
      const u = unit();
      const t0 = gi * u, t1 = t0 + u;
      const startYA = AGE - t0, endYA = AGE - t1;
      lastGi = gi;
      const mMini = $('mMini');

      if (t0 >= AGE){
        $('mKicker').textContent = "each square = " + fmtUnit(u);
        $('mTitle').textContent = "The future";
        $('mSub').textContent = "";
        mMini.hidden = true;
        $('mActions').innerHTML = "";
        $('mBody').innerHTML = '<p class="empty">Time hasn\'t reached here yet. The present is the outlined square at the end of the grid.</p>';
        openOverlay(); return;
      }

      $('mKicker').textContent = "each square = " + fmtUnit(u) + " · " + eraOf(startYA);
      // calendar years only make sense in recorded history; deep-time squares
      // are titled with a plain, fully-written year count instead
      $('mTitle').textContent = (u <= 100 && startYA < 10000)
        ? calendar(Math.round(PRESENT_YEAR - startYA))
        : (u <= 100 ? commas(startYA) + " years ago" : ago(startYA));
      const a = ago(startYA), b = endYA <= 0 ? "today" : ago(endYA);
      $('mSub').textContent = a === b ? "this square covers about " + a : "this square spans " + a + " → " + b;

      // mini position bar: where this square sits between big bang and now
      mMini.hidden = false;
      $('mDot').style.left = Math.min(100, (t0 + u/2) / AGE * 100) + "%";

      // prev / next event navigation, with the time gap printed on each button
      const prevB = neighborBlock(t0, t1, -1), nextB = neighborBlock(t0, t1, +1);
      let actions = "";
      if (prevB != null) actions += `<button class="ui" id="mPrev">‹ ${esc(fmtGap((gi - prevB) * u))} earlier</button>`;
      if (unitIdx > 0) actions += '<button class="ui" id="mZoom">zoom in</button>';
      if (nextB != null) actions += `<button class="ui" id="mNext">${esc(fmtGap((nextB - gi) * u))} later ›</button>`;
      $('mActions').innerHTML = actions;
      if (prevB != null) $('mPrev').addEventListener('click', () => hopTo(prevB));
      if (nextB != null) $('mNext').addEventListener('click', () => hopTo(nextB));
      if (unitIdx > 0) $('mZoom').addEventListener('click', () => { closeOverlay(); focusSpan(t0, t1); });

      const list = EVENTS.filter(ev => ev.t >= t0 && ev.t < t1);
      if (list.length) $('mSub').textContent += "  ·  " + list.length + (list.length === 1 ? " event" : " events");
      // the emotional core, stated once, where it lands hardest
      const lead = (gi === nowBlock)
        ? '<p class="lead">everything humans have ever built — farming, writing, cities, science, you — happened inside this one square.</p>'
        : '';
      $('mBody').innerHTML = list.length
        ? lead + eventsHtml(list, t0, t1, 0)
        : lead + '<p class="empty">No recorded events in this period. Most of the universe\'s history is quiet.</p>';
      $('mBody').scrollTop = 0;
      openOverlay();
    }
    // jump to a neighbouring block: re-center the grid behind the modal, re-open
    function hopTo(targetB){
      if (!mosaicOn){ scrollToRealY(Math.floor(targetB / cols) * rowH - scroller.clientHeight / 2); }
      select(targetB);
    }

    // tap a block: plain click delegation — the browser only fires a click
    // when the finger didn't scroll, so no gesture juggling is needed
    win.addEventListener('click', (e) => {
      const cell = e.target.closest('.cell');
      if (cell && cell.dataset.gi !== undefined) select(+cell.dataset.gi);
    });

    // capture phase: swallow the ghost click a touch can synthesize right
    // after the tap that opened the modal
    overlay.addEventListener('click', (e) => {
      if (performance.now() - overlayOpenedAt < 350){ e.stopPropagation(); e.preventDefault(); return; }
      if (e.target === overlay) closeOverlay();
    }, true);
    $('close').addEventListener('click', closeOverlay);

    // ── touch: one finger pans (with inertia), two fingers pinch-zoom ──
    let pinch = null, pan = null;
    let momRaf = 0, momVel = 0, momLast = 0;
    function stopMomentum(){ if (momRaf){ cancelAnimationFrame(momRaf); momRaf = 0; } momVel = 0; }
    function momentumStep(){
      momRaf = 0;
      const now = performance.now();
      const dt = Math.min(40, now - momLast); momLast = now;
      setVTop(vtop + momVel * dt);
      momVel *= Math.pow(0.9, dt / 16);                 // decay
      // keep going until the fling slows down or hits an end
      if (Math.abs(momVel) > 0.02 && vtop > 0 && vtop < vmax)
        momRaf = requestAnimationFrame(momentumStep);
    }
    scroller.addEventListener('touchstart', (e) => {
      stopMomentum();
      if (e.touches.length === 2){
        pan = null;
        const [a, b] = e.touches;
        const rect = scroller.getBoundingClientRect();
        const midY = (a.clientY + b.clientY) / 2 - rect.top;
        pinch = { d0: Math.max(30, Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)),
                  idx: unitIdx, anchorT: timeAtY(midY), midY };
      } else if (e.touches.length === 1){
        pinch = null;
        pan = { y: e.touches[0].clientY, t: performance.now(), vel: 0 };
      }
    }, { passive: true });
    scroller.addEventListener('touchmove', (e) => {
      if (e.touches.length >= 2){
        e.preventDefault();               // stop Safari's page zoom / scroll
        pan = null;
        if (!pinch) return;
        const [a, b] = e.touches;
        const d = Math.max(30, Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY));
        const steps = Math.round(Math.log2(d / pinch.d0));   // ×2 spread = 1 level
        const target = Math.max(0, Math.min(LAST, pinch.idx - steps));
        if (target !== unitIdx) zoomTo(target, pinch.anchorT, pinch.midY);
      } else if (e.touches.length === 1 && pan){
        e.preventDefault();
        hideTip();
        const y = e.touches[0].clientY, now = performance.now();
        const dy = y - pan.y, dt = now - pan.t;
        if (dt > 0) pan.vel = -dy / dt;   // px/ms, content moves opposite the finger
        setVTop(vtop - dy);
        pan.y = y; pan.t = now;
      }
    }, { passive: false });
    const endTouch = (e) => {
      if (e.touches.length < 2) pinch = null;
      if (e.touches.length === 0 && pan){
        const v = pan.vel; pan = null;
        if (Math.abs(v) > 0.04){ momVel = v; momLast = performance.now(); momentumStep(); }
      }
    };
    scroller.addEventListener('touchend', endTouch);
    scroller.addEventListener('touchcancel', endTouch);
    // Safari-proprietary gesture events would still page-zoom; disarm them
    for (const t of ['gesturestart', 'gesturechange', 'gestureend'])
      document.addEventListener(t, e => e.preventDefault(), { passive: false });

    // ctrl/cmd+wheel (trackpad pinch) = zoom at cursor; plain wheel = virtual
    // scroll at a FIXED real-pixel rate (constant speed at every zoom/size).
    // On trackpads the OS momentum arrives as a tail of wheel events, so this
    // stays smooth without any extra inertia code.
    let wheelAcc = 0;
    scroller.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey){
        e.preventDefault();
        wheelAcc += -e.deltaY;
        if (Math.abs(wheelAcc) >= 50){
          const dir = Math.sign(wheelAcc);
          wheelAcc = 0;
          const y = e.clientY - scroller.getBoundingClientRect().top;
          zoomTo(unitIdx - dir, timeAtY(y), y);
        }
        return;
      }
      if (vmax <= 0) return;
      e.preventDefault();
      hideTip();
      const mult = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? scroller.clientHeight : 1;
      setVTop(vtop + e.deltaY * mult);
    }, { passive: false });

    // ── scrub the bottom bar = drag the scroll position ────────
    let scrubbing = false, grabFrac = 0;
    const barFrac = x => {
      const r = bar.getBoundingClientRect();
      return (x - r.left) / Math.max(1, r.width);
    };
    // a time bubble that tracks the finger/cursor while scrubbing
    const scrubtip = $('scrubtip');
    function showScrubTip(clientX){
      const f = Math.max(0, Math.min(1, barFrac(clientX)));
      const ya = AGE - f * AGE;               // bar fraction = time fraction (linear)
      scrubtip.innerHTML = ya <= 0 ? '<b>today</b>'
        : `<b>${esc(eraOf(ya))}</b><span> · ≈ ${esc(agoShort(ya))}</span>`;
      scrubtip.style.left = Math.max(8, Math.min(92, f * 100)) + "%";
      scrubtip.hidden = false;
    }
    barrow.addEventListener('pointerdown', (e) => {
      if (overlayOpen) return;
      if (e.target.closest('.tick')) return;   // let era-marker taps jump instead of scrub
      if (e.target.closest('.evmark')) return; // same for event marks
      const f = barFrac(e.clientX);
      const thumb0 = realTop() / spacerH;
      const thumbW = Math.max(scroller.clientHeight / spacerH,
                              10 / Math.max(1, bar.getBoundingClientRect().width));
      if (f >= thumb0 && f <= thumb0 + thumbW){
        grabFrac = f - thumb0;            // grabbed the thumb: no jump
      } else {
        grabFrac = thumbW / 2;            // tapped the track: center there
        scrollToRealY((f - grabFrac) * spacerH);
      }
      scrubbing = true;
      barrow.classList.add('grabbing');
      showScrubTip(e.clientX);
      try { barrow.setPointerCapture(e.pointerId); } catch {}
      e.preventDefault();
    });
    barrow.addEventListener('pointermove', (e) => {
      if (!scrubbing) return;
      scrollToRealY((barFrac(e.clientX) - grabFrac) * spacerH);
      showScrubTip(e.clientX);
      e.preventDefault();
    });
    const endScrub = () => { scrubbing = false; barrow.classList.remove('grabbing'); scrubtip.hidden = true; };
    barrow.addEventListener('pointerup', endScrub);
    barrow.addEventListener('pointercancel', endScrub);

    // ── controls & keyboard ────────────────────────────────────
    // square-size stepper: "−" shrinks the squares (down to whatever fits the
    // whole timeline at this zoom on one screen), "+" grows them back, the
    // label resets to the default (max) size. Keeps the viewed era anchored.
    function setCellSize(newLevel){
      const bot = scroller.clientHeight;                 // keep the most recent
      const anchorT = timeAtY(bot);                      // visible moment pinned
      sizeLevel = Math.max(0, newLevel);
      setup(unitIdx);                                    // clamps to the fit level
      scrollToRealY((anchorT / (unit() * cols)) * rowH - bot);
      render();
    }
    cellminus.addEventListener('click', () => setCellSize(sizeLevel + 1));   // smaller squares
    cellplus.addEventListener('click', () => setCellSize(sizeLevel - 1));    // bigger squares
    // one tap: fit the current granularity's whole grid on one screen
    fitBtn.addEventListener('click', () => {
      setCellSize(fitLevelFor(scroller.clientWidth, scroller.clientHeight, blocks));
      setVTop(0);
    });

    // "+" = more years per square (coarser); "−" = fewer years per square (finer)
    zoombigger.addEventListener('click', () => stepZoom(1));
    zoomsmaller.addEventListener('click', () => stepZoom(-1));

    // the square= label opens the scrollable "how long is one square" panel
    const unitLab = $('unitLab');
    unitLab.addEventListener('click', () => { if (unittip.hidden) openUnitViz(); else closeUnitViz(); });
    unitLab.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openUnitViz(); }
    });
    $('uttClose').addEventListener('click', closeUnitViz);
    uttScroll.addEventListener('scroll', syncUnitCount, { passive: true });

    // ── category legend that doubles as the filter ─────────────
    const LEG = { cosmos:'cosmos', planet:'earth', life:'life', human:'humans', civ:'civilization', tech:'tech' };
    function buildLegend(){
      legend.innerHTML = [
        ...CAT_ORDER.map(k =>
          `<button type="button" class="lchip" aria-pressed="true" data-cat="${k}"><i style="background:${rgba(k,1)}"></i>${LEG[k] || CATS[k].label}</button>`),
        `<button type="button" class="lchip allchip" aria-pressed="true" data-cat="__all"><i style="background:var(--text)"></i>all</button>`
      ].join("");
      legend.querySelectorAll('.lchip').forEach(chip =>
        chip.addEventListener('click', () => toggleCat(chip.dataset.cat)));
    }
    function toggleCat(cat){
      if (cat === '__all'){
        if (active.size === CAT_ORDER.length) active.clear();   // all on → all off
        else CAT_ORDER.forEach(k => active.add(k));             // anything else → all on
      } else if (active.has(cat)){
        active.delete(cat);
      } else { active.add(cat); }
      syncLegend();
      const doTween = !mosaicOn;
      if (doTween) win.classList.add('tween');
      recount(); paintPool(); buildMarks();
      if (doTween) setTimeout(() => win.classList.remove('tween'), 260);
    }
    function syncLegend(){
      const all = active.size === CAT_ORDER.length;
      legend.querySelectorAll('.lchip').forEach(chip => {
        const cat = chip.dataset.cat;
        const on = cat === '__all' ? all : active.has(cat);
        chip.classList.toggle('off', !on);
        chip.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    // ── keyboard cursor over the grid ──────────────────────────
    const srLive = $('srLive');
    function ensureVisible(gi){
      const top = Math.floor(gi / cols) * rowH, bottom = top + rowH;
      if (top < realTop()) scrollToRealY(top);
      else if (bottom > realTop() + scroller.clientHeight) scrollToRealY(bottom - scroller.clientHeight);
    }
    function repaintCursor(){ if (mosaicOn) drawMosaic(); else { firstRow = -1; render(); } }
    function moveCursor(d){
      if (cursorGi == null) cursorGi = Math.max(0, Math.min(blocks - 1, Math.round(timeAtY(scroller.clientHeight / 2) / unit())));
      else cursorGi = Math.max(0, Math.min(blocks - 1, cursorGi + d));
      ensureVisible(cursorGi);
      repaintCursor();
      const n = blockCounts.get(cursorGi) || 0;
      srLive.textContent = agoShort(AGE - cursorGi * unit()) + " · " + n + (n === 1 ? " event" : " events");
    }

    window.addEventListener('keydown', (e) => {
      if (!unittip.hidden){
        if (e.key === 'Escape') closeUnitViz();
        return;
      }
      if (overlayOpen){
        if (e.key === 'Escape'){ closeOverlay(); return; }
        if (e.key === 'ArrowLeft'){ const b = $('mPrev'); if (b){ e.preventDefault(); b.click(); } return; }
        if (e.key === 'ArrowRight'){ const b = $('mNext'); if (b){ e.preventDefault(); b.click(); } return; }
        if (e.key === 'Tab'){
          const f = [...overlay.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])')]
            .filter(el => el.offsetParent !== null);
          if (f.length){
            const first = f[0], last = f[f.length - 1];
            if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
          }
        }
        return;
      }
      const vh = scroller.clientHeight;
      switch (e.key){
        case 'ArrowLeft':  e.preventDefault(); moveCursor(-1); break;
        case 'ArrowRight': e.preventDefault(); moveCursor(1); break;
        case 'ArrowUp':    e.preventDefault(); moveCursor(-cols); break;
        case 'ArrowDown':  e.preventDefault(); moveCursor(cols); break;
        case 'Enter': case ' ':
          if (cursorGi != null){ e.preventDefault(); select(cursorGi); } break;
        case 'Escape': if (cursorGi != null){ cursorGi = null; repaintCursor(); } break;
        case 'PageUp':   e.preventDefault(); setVTop(vtop - vh * 0.9); break;
        case 'PageDown': e.preventDefault(); setVTop(vtop + vh * 0.9); break;
        case 'Home': e.preventDefault(); setVTop(0); break;
        case 'End':  e.preventDefault(); setVTop(vmax); break;
        case '+': case '=': stepZoom(1); break;    // more years per square (coarser)
        case '-': case '_': stepZoom(-1); break;   // fewer years per square (finer)
      }
    });

    // resize / rotate: keep the era at the viewport center. A height-only
    // change (mobile URL bar showing/hiding while you scroll) must NOT rebuild
    // the grid — that would flicker — so only re-lay-out when the width changes.
    let rz, lastW = 0;
    window.addEventListener('resize', () => {
      clearTimeout(rz);
      rz = setTimeout(() => {
        const w = scroller.clientWidth;
        if (w === lastW){ render(); return; }
        lastW = w;
        const mid = scroller.clientHeight / 2;
        const anchorT = timeAtY(mid);
        setup(unitIdx);
        scrollToRealY((anchorT / (unit() * cols)) * rowH - mid);
        render();
      }, 120);
    });

    // dismiss the one-time cue on first interaction or after its animation
    const cue = $('cue');
    if (cue){
      const dropCue = () => cue.remove();
      setTimeout(dropCue, 5200);
      scroller.addEventListener('scroll', dropCue, { once: true, passive: true });
      scroller.addEventListener('pointerdown', dropCue, { once: true });
    }

    // ── go ─────────────────────────────────────────────────────
    buildLegend();
    syncLegend();
    buildTags();
    buildTicks();
    buildMarks();
    // landing view = the whole timeline at 1M yrs/square, squares grown from a
    // perfect fit up to a comfortably legible minimum (~11px). The grid then
    // scrolls a little from the Big Bang (and "fit" zooms out to see it all).
    const LAND_UNIT = UNITS.indexOf(1e6);   // 1M yrs per square
    {
      const W0 = scroller.clientWidth, H0 = scroller.clientHeight;
      const nb = Math.ceil(AGE / UNITS[LAND_UNIT]);
      let k = fitLevelFor(W0, H0, nb);
      while (k > 0 && sizeAt(k, W0).px < 12) k--;   // ensure a legible square size
      sizeLevel = k;
    }
    setup(LAND_UNIT);
    lastW = scroller.clientWidth;
  })();
  </script>
</body>
</html>
