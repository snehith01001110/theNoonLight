<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="An interactive timeline of the universe — 13.8 billion years as a grid of blocks, from the Big Bang to today.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Since the Big Bang</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="canonical" href="https://thenoonlight.com/universe/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Since the Big Bang">
  <meta property="og:description" content="An interactive timeline of the universe — 13.8 billion years as a grid of blocks, from the Big Bang to today.">
  <meta property="og:url" content="https://thenoonlight.com/universe/">
  <meta name="twitter:card" content="summary">
  <style>
    :root{
      color-scheme: dark;
      --bg:        #0a0a0a;
      --surface:   #141414;
      --surface2:  #1e1e1e;
      --border:    #2a2a2a;
      --text:      #f0f0f0;
      --text2:     #c6c6c6;
      --muted:     #8a8a8a;
      --faint:     #6f6f6f;
      --scrim:     rgba(6,6,6,0.72);
      --pill:      rgba(20,20,20,0.92);
      --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
      --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, monospace;
    }
    *{ box-sizing: border-box; }
    html,body{ height:100%; margin:0; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      /* custom cursors (set as vars at runtime): a small ring everywhere,
         a focus reticle over anything clickable */
      cursor: var(--cur, default);
    }

    .app{
      height:100vh; height:100dvh;
      display:flex; flex-direction:column;
    }

    /* ── colour legend/filter: a blurred pill floating over the grid ── */
    .legend{
      position:absolute; top:2px; right:0; z-index:5;
      display:flex; flex-wrap:wrap; gap:5px 14px; justify-content:flex-end; align-items:center;
      max-width:calc(100% - 16px);
      background:rgba(12,12,12,0.55);
      -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
      border:1px solid var(--border); border-radius:999px;
      padding:7px 14px;
    }
    .lchip{
      display:inline-flex; align-items:center; gap:6px;
      background:none; border:none; padding:2px 0; cursor:var(--curact, pointer);
      font-family:var(--mono); font-size:0.66rem; color:var(--muted); line-height:1;
    }
    .lchip i{ width:8px; height:8px; border-radius:2px; flex:0 0 auto; }
    .lchip.off{ opacity:0.34; }
    .lchip.off i{ box-shadow: inset 0 0 0 1px var(--border); background:transparent !important; }
    @media (hover:hover){ .lchip:hover{ color:var(--text); } }
    .lchip:focus-visible{ outline:2px solid var(--muted); outline-offset:2px; border-radius:4px; }
    @media (max-width:480px){ .lchip{ font-size:0.62rem; } }

    /* ── the squares: a natively scrollable grid of all of time ── */
    .stage{
      flex:1 1 auto;
      position:relative;
      min-height:0; min-width:0;
      /* top gap so row 0 clears the edge AND the big-bang pill has room above it */
      margin:calc(36px + env(safe-area-inset-top)) 16px 0;
    }
    .scroller{
      position:absolute; inset:0;
      overflow:hidden;                       /* scrolling is ours (virtual), not native */
      touch-action:none;
      scrollbar-width:none;
      outline:none;
    }
    .scroller::-webkit-scrollbar{ display:none; }
    .spacer{ position:relative; height:100%; }
    .win{
      position:absolute; top:0; left:0; right:0;
      display:grid; justify-content:center;
      will-change:transform;
    }
    .cell{
      background: rgba(240,240,240,0.04);
      border-radius: var(--r, 3px);
    }
    .cell.future{ background: rgba(240,240,240,0.01); }
    /* the present-day square gently breathes so "you are here" is findable */
    @keyframes breathe{
      0%,100%{ box-shadow: inset 0 0 0 1.5px rgba(240,240,240,0.95); }
      50%    { box-shadow: inset 0 0 0 1.5px rgba(240,240,240,0.40); }
    }
    .cell.now{ animation: breathe 2.8s ease-in-out infinite; }
    /* the very first square — where time starts */
    .cell.origin{ box-shadow: inset 0 0 0 1.5px rgba(240,240,240,0.9); }
    .cell.cursor{ box-shadow: inset 0 0 0 1.5px var(--muted); }
    .cell.flash{ outline:1px solid rgba(240,240,240,0.55); outline-offset:-1px; }
    @media (hover:hover){
      .cell:not(.future):hover{ outline:1px solid rgba(240,240,240,0.4); outline-offset:-1px; cursor:var(--curgrid, pointer); }
    }
    /* annotations (era lines + the big-bang/today tags) live in a viewport-
       space overlay, positioned every frame — never inside the scrollable
       content, so they can't extend scrollHeight or fight the scroll gearing */
    /* extends 36px up into the top margin so the big-bang pill can sit above row 0 */
    .gridnotes{ position:absolute; top:-36px; left:0; right:0; bottom:0; z-index:3; pointer-events:none; overflow:hidden; }
    /* the big-bang pill (above its square) and the today pill (below its square) */
    .gtag{
      position:absolute; display:flex; align-items:flex-start;
      font-family:var(--mono); font-size:0.64rem; color:var(--text2); white-space:nowrap;
    }
    .gtag[hidden]{ display:none; }
    .gtag .pill{ background:var(--pill); border:1px solid var(--border); border-radius:999px; padding:3px 9px; }
    .gtag b{ color:var(--text); font-weight:600; }
    .gtag i{ width:1px; background:var(--muted); }              /* vertical connector */
    .gtag.up{ flex-direction:column; }                         /* pill on top, line below → points down to square */
    .gtag.down{ flex-direction:column-reverse; }               /* line on top, pill below → points up to square */
    /* gated crossfade only when toggling categories, never during scroll */
    .win.tween .cell{ transition: background .22s ease; }

    /* ── bottom: position readout, block-size stepper, scrub bar ── */
    footer{
      flex:0 0 auto;
      padding:8px 16px calc(12px + env(safe-area-inset-bottom));
      display:flex; flex-direction:column; gap:9px;
    }
    .meta{
      display:flex; align-items:center; justify-content:space-between; gap:10px 16px;
      flex-wrap:wrap; font-family:var(--mono);
    }
    .pos{
      font-size:0.8rem; color:var(--text);
      font-variant-numeric:tabular-nums;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;
    }
    .pos b{ font-weight:600; color:var(--text); }
    .pos span{ color:var(--muted); }
    .zoomcluster{ display:flex; gap:14px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
    .zoom{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
    .lab{ font-family:var(--mono); font-size:0.72rem; color:var(--muted); white-space:nowrap; }
    .lab b{ color:var(--text); font-weight:600; }
    /* the square= label opens the "how long is one square" panel */
    #unitLab{ cursor:var(--curact, pointer); }
    #unitLab:hover, #unitLab:focus-visible{ color:var(--text); }
    #unitLab:focus-visible{ outline:2px solid var(--muted); outline-offset:2px; border-radius:4px; }
    /* full-screen "how long is one square" panel: click the square= label,
       then scroll through every single year the square holds */
    .unittip{
      position:fixed; inset:0; z-index:120;
      display:flex; flex-direction:column;
      background:rgba(6,6,6,0.97); white-space:normal;
    }
    .unittip[hidden]{ display:none; }
    .utt-head{
      flex:0 0 auto;
      display:flex; align-items:center; gap:8px 18px; flex-wrap:wrap;
      padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
      border-bottom:1px solid var(--border);
      font-family:var(--mono); line-height:1.4;
    }
    .utt-titles{ display:flex; flex-direction:column; gap:2px; min-width:0; }
    .utt-cap{ color:var(--text); font-size:0.95rem; }
    .utt-cap b{ font-weight:600; font-size:1.15rem; }
    .utt-sub{ color:var(--muted); font-size:0.72rem; }
    .utt-count{
      margin-left:auto; color:var(--muted); font-size:0.74rem;
      font-variant-numeric:tabular-nums; white-space:nowrap;
    }
    .utt-close{ flex:0 0 auto; }
    .utt-scroll{
      flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
      padding:16px 18px calc(20px + env(safe-area-inset-bottom));
    }
    #uttFull, #uttRem{ image-rendering:pixelated; }
    button.ui{
      font-family:var(--mono); font-size:0.72rem;
      background:var(--surface); color:var(--text);
      border:1px solid var(--border); border-radius:6px;
      padding:5px 10px; cursor:var(--curact, pointer); line-height:1;
    }
    button.ui:hover{ background:var(--surface2); }
    button.ui:focus-visible{ outline:2px solid var(--muted); outline-offset:2px; }
    button.ui:disabled{ opacity:.32; cursor:var(--cur, default); background:var(--surface); }
    @media (pointer:coarse){
      button.ui{ padding:8px 12px; }
    }

    /* tiny-square mode: the grid drawn on a canvas — only a slice around the
       viewport, positioned absolutely in the spacer, so canvas size limits
       never bite no matter how many rows a fine zoom produces */
    #mosaic{ display:none; position:absolute; top:0; left:0; right:0; margin:0 auto; cursor:var(--curgrid, pointer); }

    .barrow{
      position:relative;
      padding:8px 0 2px;                    /* generous touch target */
      touch-action:none;
      user-select:none; -webkit-user-select:none;
      cursor:var(--curact, grab);
    }
    .barrow.grabbing{ cursor:var(--curact, grabbing); }
    .bar{
      position:relative; height:6px; border-radius:3px;
      background: rgba(240,240,240,0.08);
      overflow:visible;
    }
    .seg{
      position:absolute; top:-3px; bottom:-3px;
      background: var(--text); border-radius:3px;
      min-width:10px;
      transition: box-shadow .15s ease;
    }
    @media (hover:hover){ .barrow:hover .seg{ box-shadow: 0 0 6px rgba(240,240,240,0.35); } }
    .barrow.grabbing .seg{ box-shadow: 0 0 11px rgba(240,240,240,0.65); }
    /* time bubble that follows the finger/cursor while scrubbing */
    .scrubtip{
      position:absolute; bottom:calc(100% + 8px); transform:translateX(-50%);
      font-family:var(--mono); font-size:0.66rem; color:var(--text);
      background:var(--pill); border:1px solid var(--border); border-radius:6px;
      padding:3px 8px; white-space:nowrap; pointer-events:none; z-index:6;
    }
    .scrubtip[hidden]{ display:none; }
    .scrubtip b{ font-weight:600; }
    .scrubtip span{ color:var(--muted); }
    /* event annotation lane (VS Code overview-ruler style), coloured by
       category — each mark is tappable and jumps the grid to that moment.
       A precise crosshair (open centre) is used so the pointer never hides
       the slim mark it's aimed at. */
    .evstrip{ position:relative; height:9px; margin-top:4px; }
    .evmark{
      position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; border-radius:1px;
      cursor:var(--curcross, crosshair); transition:transform .1s ease, filter .1s ease;
    }
    .evmark::after{ content:""; position:absolute; inset:-6px -4px; }  /* enlarge tap target */
    @media (hover:hover){
      .evmark:hover{ transform:scaleY(1.9); filter:brightness(1.5) saturate(1.2); z-index:2; }
    }
    .ticks{ position:relative; height:14px; margin-top:4px; }
    .tick{
      position:absolute; top:0; transform:translateX(-50%);
      background:none; border:none; padding:0; margin:0; cursor:var(--curact, pointer);
      font-family:var(--mono); font-size:0.6rem; color:var(--faint); white-space:nowrap;
      text-decoration:underline; text-decoration-color:rgba(240,240,240,0.20); text-underline-offset:3px;
    }
    .tick::before{ content:""; position:absolute; inset:-9px -8px; }  /* enlarge tap target */
    .tick:hover{ color:var(--text); text-decoration-color:rgba(240,240,240,0.5); }
    .tick:hover i{ background:var(--text); }
    .tick:focus-visible{ outline:2px solid var(--muted); outline-offset:2px; border-radius:3px; }
    .tick.l{ transform:none; left:0; }
    .tick.r{ transform:none; right:0; left:auto; }
    .tick i{ display:block; width:1px; height:4px; background:var(--faint); margin:0 auto 2px; text-decoration:none; }
    .tick.l i, .tick.r i{ margin:0 0 2px; }
    @media (max-width:899px){ .tick.opt{ display:none; } }

    /* era boundary lines — full-width hairline + label, in the .gridnotes overlay */
    .era{
      position:absolute; left:0; right:0; pointer-events:none;
      border-top:1px solid rgba(240,240,240,0.10);
    }
    .era[hidden]{ display:none; }
    .era span{
      position:relative; top:2px;
      font-family:var(--mono); font-size:0.62rem; color:var(--faint);
      background:var(--bg); padding:0 6px 1px 2px;
    }

    /* desktop hover tooltip: peek inside a square without opening it */
    #tip{
      position:fixed; z-index:90; pointer-events:none; display:none;
      font-family:var(--mono); font-size:0.68rem; color:var(--text);
      background:var(--pill); border:1px solid var(--border); border-radius:8px;
      padding:7px 9px; max-width:260px;
    }
    #tip .tip-when{ color:var(--muted); margin-bottom:5px; }
    #tip .tip-when.solo{ margin-bottom:0; opacity:0.7; }
    #tip .tip-ev{ display:flex; align-items:baseline; gap:6px; padding:1px 0; }
    #tip .tip-ev i{ width:6px; height:6px; border-radius:2px; flex:0 0 auto; position:relative; top:1px; }
    #tip .tip-more{ color:var(--muted); padding-top:2px; }

    /* event-mark preview (hovering a mark on the bottom timeline) */
    #evtip{
      position:fixed; z-index:95; pointer-events:none; display:none;
      font-family:var(--mono); font-size:0.7rem; color:var(--text);
      background:var(--pill); border:1px solid var(--border); border-radius:9px;
      padding:8px 10px; max-width:300px;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }
    #evtip .evtip-when{ color:var(--muted); font-size:0.64rem; margin-bottom:5px; }
    #evtip .evtip-row{ display:flex; align-items:baseline; gap:7px; padding:1.5px 0; }
    #evtip .evtip-row i{ width:7px; height:7px; border-radius:2px; flex:0 0 auto; position:relative; top:1px; }
    #evtip .evtip-more{ color:var(--faint); padding-top:5px; font-size:0.63rem; }

    /* keyboard focus for the scrollable timeline */
    .scroller:focus-visible{ outline:2px solid var(--muted); outline-offset:-2px; }
    .sr-live{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

    /* one-time discoverability cue over the grid */
    .cue{
      position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
      z-index:3; pointer-events:none;
      font-family:var(--mono); font-size:0.68rem; color:var(--muted);
      background:rgba(20,20,20,0.82); border:1px solid var(--border);
      border-radius:999px; padding:6px 13px; white-space:nowrap;
      -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
      animation: cue 5s ease forwards;
    }
    @keyframes cue{ 0%,58%{ opacity:1; } 100%{ opacity:0; } }

    /* ── overlay modal ── */
    .overlay{
      position:fixed; inset:0; z-index:100;
      background: var(--scrim);
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      display:flex; align-items:center; justify-content:center;
      padding:24px;
    }
    .overlay[hidden]{ display:none; }
    .modal{
      position:relative;
      background: var(--surface);
      border:1px solid var(--border);
      border-radius:14px;
      width:min(560px, 100%);
      max-height:82vh; max-height:82dvh;
      display:flex; flex-direction:column;
      padding:26px 26px 8px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
      animation: modal-in .18s ease;
    }
    @keyframes modal-in{ from{ opacity:0; transform: scale(0.97) translateY(6px); } }
    .modal .close{
      position:absolute; top:14px; right:14px;
      background:transparent; border:none; color:var(--muted);
      font-size:1rem; cursor:var(--curact, pointer); line-height:1; padding:6px;
    }
    .modal .close:hover{ color:var(--text); }
    .modal-kicker{ font-family:var(--mono); font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.09em; }
    .modal-title{ font-size:1.3rem; font-weight:600; margin:8px 0 3px; letter-spacing:-0.01em; line-height:1.2; }
    .modal-sub{ font-family:var(--mono); font-size:0.72rem; color:var(--muted); margin-bottom:2px; }
    /* mini position bar: big bang ▸ • ▸ now */
    .mini{ margin:12px 0 4px; }
    .mini[hidden]{ display:none; }
    .mini-bar{ position:relative; height:3px; border-radius:2px; background:rgba(240,240,240,0.10); }
    .mini-dot{ position:absolute; top:-2.5px; width:8px; height:8px; border-radius:50%; background:var(--text); transform:translateX(-50%); }
    .mini-cap{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:0.6rem; color:var(--faint); margin-top:4px; }
    .modal-actions{ display:flex; gap:8px; flex-wrap:wrap; padding:12px 0 14px; }
    .modal-actions:empty{ display:none; }
    .modal-actions .ui{ padding:7px 12px; }
    .modal-body{ overflow-y:auto; overscroll-behavior:contain; padding:6px 0 18px; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
    .modal-body::-webkit-scrollbar{ width:8px; }
    .modal-body::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
    .lead{ font-size:0.9rem; color:var(--text2); line-height:1.55; padding:2px 0 14px; margin:0 0 4px; border-bottom:1px solid var(--border); }
    .ev{ padding:14px 0; border-bottom:1px solid var(--border); }
    .ev:first-child{ padding-top:6px; }
    .ev:last-child{ border-bottom:none; }
    .ev-when{ font-family:var(--mono); font-size:0.68rem; color:var(--muted); margin-bottom:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .ev-cat{ font-size:0.6rem; letter-spacing:0.04em; text-transform:uppercase; padding:2px 6px; border-radius:4px; font-weight:600; }
    .ev-title{ font-size:0.98rem; font-weight:600; margin:0 0 3px; }
    .ev-desc{ font-size:0.86rem; color:var(--text2); margin:0; line-height:1.5; }
    .empty{ color:var(--faint); font-size:0.9rem; padding:10px 0 20px; font-style:italic; line-height:1.5; }

    /* grouped event list inside dense periods */
    .grp-h{
      font-family:var(--mono); font-size:0.66rem; color:var(--muted);
      letter-spacing:0.02em; padding:13px 0 3px;
    }
    .grp .grp{ margin-left:9px; border-left:1px solid var(--border); padding-left:11px; }

    @media (prefers-reduced-motion: reduce){
      .modal{ animation:none; }
      .seg{ transition:none; }
      .cue{ animation:none; }
      .cell.now{ animation:none; box-shadow: inset 0 0 0 1.5px var(--text); }
      .win.tween .cell{ transition:none; }
    }
    @media (max-width:640px){
      .overlay{ padding:16px; }
      .modal{ padding:22px 20px 6px; }
      .modal-title{ font-size:1.15rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="stage">
      <div class="legend" id="legend" role="group" aria-label="Categories — tap to filter"></div>
      <div class="scroller" id="scroller" tabindex="0" role="region"
           aria-label="Timeline of the universe, from the Big Bang to today. Scroll to move through time.">
        <div class="spacer" id="spacer">
          <div class="win" id="win"></div>
          <canvas id="mosaic"></canvas>
        </div>
      </div>
      <div class="gridnotes" id="gridnotes" aria-hidden="true"></div>
      <div class="cue" id="cue">the whole history of the universe — tap a square to explore</div>
      <span class="sr-live" id="srLive" aria-live="polite"></span>
    </div>

    <footer>
      <div class="meta">
        <span class="pos" id="pos"><b id="posEra"></b><span id="posTime"></span></span>
        <div class="zoomcluster">
          <div class="zoom">
            <button class="ui" id="zoomsmaller" title="fewer years per square">−</button>
            <span class="lab" id="unitLab" tabindex="0" role="button" aria-haspopup="dialog"
                  title="how much time is one square? click to see">square = <b id="unitlabel">10M yrs</b></span>
            <button class="ui" id="zoombigger" title="more years per square">+</button>
          </div>
          <div class="zoom">
            <button class="ui" id="cellminus" title="smaller squares">−</button>
            <span class="lab">size</span>
            <button class="ui" id="cellplus" title="bigger squares">+</button>
            <button class="ui" id="fit" title="fit all of time on one screen">fit</button>
          </div>
        </div>
      </div>
      <div class="barrow" id="barrow">
        <div class="scrubtip" id="scrubtip" hidden></div>
        <div class="bar"><div class="seg" id="seg"></div></div>
        <div class="evstrip" id="evstrip" aria-hidden="true"></div>
        <div class="ticks" id="ticks"></div>
      </div>
    </footer>
  </div>

  <div id="tip" aria-hidden="true"></div>
  <div id="evtip" aria-hidden="true"></div>

  <div class="unittip" id="unittip" role="dialog" aria-modal="true"
       aria-label="How much time one square holds" hidden>
    <div class="utt-head">
      <div class="utt-titles">
        <span class="utt-cap">one square = <b id="uttNum"></b> years</span>
        <span class="utt-sub">every tiny square below is a single year — keep scrolling</span>
      </div>
      <span class="utt-count" id="uttCount"></span>
      <button class="ui utt-close" id="uttClose" aria-label="Close">✕</button>
    </div>
    <div class="utt-scroll" id="uttScroll">
      <div id="uttFull"></div>
      <div id="uttRem"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" hidden>

      {ya:53e6, title:"First bats take flight", desc:"The earliest known bats flutter through Eocene forests, chasing insects on delicate leathery wings."},
      {ya:52e6, title:"Rainforests reach the poles", desc:"In the warm early Eocene, steamy rainforests and basking crocodiles thrive near the Arctic Circle."},
      {ya:50e6, title:"India collides with Asia", desc:"The drifting Indian plate crashes into Asia, crumpling the crust and beginning the rise of the Himalayas."},
      {ya:49e6, title:"Arctic fern bloom", desc:"Thick mats of freshwater ferns cover a warm Arctic Ocean, drawing down carbon and cooling Earth."},
      {ya:48e6, title:"Walking whales wade in", desc:"Amphibious mammals like Ambulocetus hunt in coastal shallows as the whale lineage begins abandoning land."},
      {ya:47e6, title:"The Messel Pit world", desc:"A German crater lake buries an entire Eocene ecosystem, from early horses to iridescent beetles."},
      {ya:45e6, title:"Giant penguins patrol", desc:"Human-sized penguins with long spear-like beaks patrol the cool seas of the Southern Hemisphere."},
      {ya:40e6, title:"Whales rule the seas", desc:"The serpentine Basilosaurus, up to eighteen metres long, patrols warm oceans as whales become fully marine."},
      {ya:38e6, title:"Andrewsarchus prowls Asia", desc:"Andrewsarchus, a huge hoofed mammal with massive bone-crushing jaws, prowls the coasts of central Asia."},
      {ya:36e6, title:"Moeritherium in the swamps", desc:"The pig-sized, tapir-like Moeritherium wallows in African wetlands, a distant forerunner of the elephants."},
      {ya:34e6, title:"Grasslands spread", desc:"Cooling climates open vast grasslands, reshaping mammal evolution."},
      {ya:34e6, title:"Antarctica freezes over", desc:"Plunging carbon dioxide caps Antarctica in ice, chilling the planet and triggering waves of extinction."},
      {ya:33e6, title:"Baleen whales start filtering", desc:"Some whales evolve baleen, straining vast swarms of tiny prey from cold, newly productive seas."},
      {ya:32e6, title:"Cats and dogs emerge", desc:"Modern carnivore families take shape as early cats, dogs, and their relatives spread across the continents."},
      {ya:30e6, title:"Paraceratherium towers", desc:"The hornless rhino Paraceratherium, taller than a giraffe, becomes the largest land mammal ever to exist."},
      {ya:26e6, title:"Seals take to water", desc:"Early seals and sea lions slip into the sea as mammals return again to the oceans."},
      {ya:25e6, title:"First apes", desc:"Apes split from monkeys in the forests of Africa."},
      {ya:25e6, title:"Terror birds dominate", desc:"Flightless terror birds, three metres tall with hooked axe-like beaks, reign as top predators in South America."},
      {ya:20e6, title:"Megalodon appears", desc:"The colossal shark Megalodon, up to eighteen metres long, rises to become the ocean's supreme predator."},
      {ya:19e6, title:"Elephant kin spread out", desc:"Trunked, tusked proboscideans stride out of Africa, spreading across Eurasia and eventually into the Americas."},
      {ya:17e6, title:"Ruminants spread widely", desc:"Deer, antelope, and other cud-chewing grazers diversify and spread across the northern continents."},
      {ya:15e6, title:"Miocene warmth peaks", desc:"A warm climatic optimum spreads forests and browsing herds across a lush, mild greenhouse world."},
      {ya:13.5e6, title:"Antarctic ice thickens", desc:"Antarctica's ice sheet expands sharply, cooling and drying the planet and favoring more open country."},
      {ya:12e6, title:"Sivapithecus in Asia", desc:"The Asian ape Sivapithecus, its face foreshadowing the orangutan, thrives in warm Miocene woodlands."},
      {ya:10e6, title:"Three-toed horses spread", desc:"Swift three-toed Hipparion horses graze and browse across the widening plains of Eurasia and Africa."},
      {ya:7e6, title:"Human line splits off", desc:"Our lineage diverges from the ancestors of chimpanzees."},
      {ya:7e6, title:"Sahelanthropus in Chad", desc:"A seven-million-year-old skull from Chad may belong to one of the earliest members of the human branch."},
      {ya:6e6, title:"Orrorin walks upright", desc:"Orrorin, known from Kenyan fossils, shows signs of walking upright some six million years ago."},
      {ya:5.9e6, title:"Mediterranean nearly dries up", desc:"As its link to the Atlantic closes, the Mediterranean shrinks to vast salt flats and brine."},
      {ya:5.3e6, title:"The Mediterranean refills", desc:"The Atlantic bursts through Gibraltar, flooding the parched basin in one of Earth's greatest known floods."},
      {ya:4.4e6, title:"Ardipithecus", desc:"Early hominins that could walk upright yet still climb trees."},
      {ya:4.2e6, title:"Australopithecus anamensis", desc:"This upright ape of East Africa, with an ape-like face and human-like legs, nears our roots."},
      {ya:3.7e6, title:"Laetoli footprints", desc:"Early human relatives leave a trail of upright footprints across fresh volcanic ash in Tanzania."},
      {ya:3.3e6, title:"First stone tools", desc:"Hominins begin knapping stone into cutting edges."},
      {ya:3.2e6, title:"Lucy (Australopithecus)", desc:"A famous fossil showing our ancestors walked fully upright."},
      {ya:3.2e6, title:"Warm Pliocene seas", desc:"In a mid-Pliocene warm spell, seas stand metres higher and forests creep toward the poles."},
      {ya:3e6, title:"Panama bridge rises", desc:"A new land bridge joins the Americas, unleashing a great two-way migration of animals between continents."},
      {ya:2.8e6, title:"The genus Homo", desc:"Homo habilis — 'handy man' — with a larger brain and reliance on tools."},
      {ya:2.8e6, title:"The Taung Child", desc:"A fossil child's skull from South Africa reveals Australopithecus africanus and roots humankind firmly in Africa."},
      {ya:2.6e6, title:"Ice ages begin", desc:"Great ice sheets start advancing across the northern lands, opening a long era of glacial cycles."},
      {ya:2.5e6, title:"Robust australopithecines", desc:"Paranthropus, with huge molars and crested skulls, grinds tough plants beside the earliest true humans."},
      {ya:2e6, title:"Sabre-toothed cats", desc:"Sabre-toothed predators such as Smilodon stalk large prey, striking with long dagger-like canine teeth."},
      {ya:1.98e6, title:"Australopithecus sediba", desc:"A South African species mixing ape-like and human-like traits complicates the branching story of our origins."},
      {ya:1.9e6, title:"Homo erectus", desc:"Tall, long-legged humans who spread out of Africa across Asia."},
      {ya:1.8e6, title:"Hominins at Dmanisi", desc:"Early humans reach Dmanisi in Georgia, the oldest firmly dated hominins found beyond Africa."},
      {ya:1.75e6, title:"Acheulean hand axes", desc:"Symmetrical teardrop stone axes appear, a versatile tool made almost unchanged for over a million years."},
      {ya:1.6e6, title:"Giant ground sloths", desc:"Elephant-sized ground sloths like Megatherium browse leaves across the woodlands of South America."},
      {ya:1.5e6, title:"Armored glyptodonts", desc:"Car-sized glyptodonts, armored relatives of armadillos, lumber slowly across the South American plains."},
      {ya:1e6, title:"Fire", desc:"Hominins learn to control fire — for warmth, safety, and cooking."},
      {ya:1e6, title:"Gigantopithecus, giant ape", desc:"The largest ape ever known, up to three metres tall, roams the bamboo forests of southern Asia."},
      {ya:900e3, title:"Homo antecessor in Europe", desc:"Known from Atapuerca in Spain, Homo antecessor ranks among the earliest humans in western Europe."},
      {ya:800e3, title:"Ice cycles lengthen", desc:"Glacial rhythms shift to roughly hundred-thousand-year swings, deepening the long contrast between ice and warmth."},
      {ya:770e3, title:"Magnetic poles reverse", desc:"Earth's magnetic field undergoes its last full reversal, as magnetic north and south trade places."},
      {ya:760e3, title:"Giant short-faced bear", desc:"The towering short-faced bear, among the largest land carnivores ever, ranges across Ice Age North America."},
      {ya:700e3, title:"Homo heidelbergensis", desc:"A tall, large-brained human spreads across Africa and Europe, hunting big game with wooden spears."},
      {ya:500e3, title:"Boxgrove hunters", desc:"At Boxgrove in Britain, early humans butcher horses and rhinos with finely knapped flint tools."},
      {ya:430e3, title:"Pit of Bones", desc:"Dozens of human bodies accumulate in a deep Spanish cave shaft, hinting at early care for the dead."},
      {ya:400e3, title:"Neanderthals", desc:"A robust human species adapted to Ice Age Europe and the Near East."},
      {ya:400e3, title:"Woolly mammoth evolves", desc:"The shaggy, cold-adapted woolly mammoth emerges, sweeping snow from frozen grass with its curved tusks."},
      {ya:300e3, title:"Homo sapiens", desc:"Our own species appears in Africa (Jebel Irhoud, Morocco)."},
      {ya:300e3, title:"Homo naledi in the dark", desc:"Small-brained Homo naledi is found deep within a South African cave, perhaps deliberately placed there."},
      {ya:290e3, title:"Schoningen spears", desc:"Finely balanced wooden throwing spears in Germany reveal early humans as skilled, cooperative big-game hunters."},
      {ya:250e3, title:"The Levallois method", desc:"Toolmakers learn to prepare stone cores in advance, striking off flakes of predictable size and edge."},
      {ya:170e3, title:"The first clothing", desc:"Genetic clues from body lice suggest humans began wearing fitted clothing, opening the door to colder lands."},
      {ya:160e3, title:"Feasting on the shore", desc:"At South Africa's Pinnacle Point, people gather shellfish and grind red ochre beside the sea."},
      {ya:140e3, title:"Cave bears in Europe", desc:"Massive cave bears shelter and hibernate in European caverns through the long, dark glacial winters."},
      {ya:130e3, title:"The Eemian warmth", desc:"A warm interglacial melts back the ice, letting hippos and elephants roam the rivers of Europe."},
      {ya:120e3, title:"Straight-tusked elephants", desc:"Straight-tusked elephants larger than any today browse the warm forests of interglacial Europe."},
      {ya:115e3, title:"The Irish elk", desc:"The giant deer Megaloceros carries branching antlers nearly four metres wide across Ice Age Eurasia."},
      {ya:110e3, title:"The Denisovans", desc:"A little-known human cousin, first identified from a Siberian cave, ranges across the breadth of Asia."},
      {ya:100e3, title:"Symbolic thought", desc:"The earliest jewelry and ochre pigments hint at art and abstract minds."},
      {ya:100e3, title:"Camps at Skhul and Qafzeh", desc:"Early modern humans shelter in Levantine caves, an early venture from Africa that left few descendants."},
      {ya:90e3, title:"A hybrid girl", desc:"A bone from a Siberian cave reveals a girl with a Neanderthal mother and Denisovan father."},
      {ya:72e3, title:"Advanced African toolkits", desc:"Southern African cultures craft delicate stone points and refined bone tools far ahead of their time."},
      {ya:70e3, title:"Out of Africa", desc:"Modern humans expand across the globe, meeting and mixing with other human species."},
      {ya:70e3, title:"Neanderthals bury their dead", desc:"At Shanidar and other sites, Neanderthals inter their dead and tend the injured and elderly."},
      {ya:65e3, title:"People reach Australia", desc:"Seafaring humans cross open water to the far side of the world."},
      {ya:64e3, title:"The bow and arrow", desc:"The earliest evidence for bows and stone-tipped arrows appears in the rock shelters of South Africa."},
      {ya:60e3, title:"Humans meet Neanderthals", desc:"As modern humans spread into Eurasia, they interbreed with Neanderthals, leaving DNA in people today."},
      {ya:55e3, title:"The Flores hobbit", desc:"The metre-tall Homo floresiensis, a dwarfed human species, lingers on the Indonesian island of Flores."},
      {ya:50e3, title:"The blade toolkit blooms", desc:"A creative surge yields slender stone blades, bone points, and ornaments as modern human culture flourishes."},
      {ya:47e3, title:"Eyed sewing needles", desc:"Slim eyed needles of bone let people stitch tailored, layered garments against the bitter Ice Age cold."},
      {ya:46e3, title:"Australia's giants vanish", desc:"Giant marsupials, huge flightless birds, and other Australian megafauna die out soon after people arrive."},
      {ya:5.12e4, title:"Oldest animal painting", desc:"A wild pig painted with three human-like figures in a Sulawesi cave is the oldest known figurative art, a scene that seems to tell a story."},
      {ya:45e3, title:"Humans enter Europe", desc:"Modern humans push into Europe, meeting and gradually replacing the long-resident Neanderthals."},
      {ya:43e3, title:"The Aurignacian culture", desc:"The Aurignacian spreads across Europe, rich with fine blades, carved ivory figurines, and personal ornaments."},
      {ya:42e3, title:"Cremation at Lake Mungo", desc:"In Australia a woman's body is cremated and buried, among the oldest known ritual burials anywhere."},
      {ya:41e3, title:"Laschamp magnetic flip", desc:"Earth's magnetic field weakens and briefly reverses, letting cosmic rays surge and auroras blaze worldwide."},
      {ya:40.5e3, title:"Bone flutes played", desc:"Flutes carved from bird bone and mammoth ivory in German caves are the oldest known musical instruments."},
      {ya:40e3, title:"Neanderthals vanish", desc:"The last Neanderthals disappear; Homo sapiens is left the only human."},
      {ya:40e3, title:"The Lion-man carved", desc:"A human figure with a lion's head, carved from mammoth ivory, is the oldest known figurative sculpture."},
      {ya:39e3, title:"A man near Beijing", desc:"Tianyuan Man, buried near modern Beijing, shows humans had spread deep into East Asia."},
      {ya:36e3, title:"Cave paintings", desc:"Chauvet and later Lascaux — vivid animal art on cave walls."},
      {ya:36e3, title:"Venus of Hohle Fels", desc:"A palm-sized ivory figurine of a woman is among the oldest known depictions of the human body."},
      {ya:34e3, title:"Rich graves at Sungir", desc:"People in Russia bury their dead draped in thousands of painstakingly carved mammoth-ivory beads."},
      {ya:32e3, title:"Wolves become dogs", desc:"Some wolves begin the long path toward domestication, hunting and traveling alongside roving human bands."},
      {ya:30e3, title:"The Gravettian culture", desc:"Gravettian hunters across Europe make small pointed blades and carve the celebrated Venus figurines."},
      {ya:29e3, title:"Venus of Willendorf", desc:"A plump limestone figurine from Austria becomes an enduring icon of Ice Age art."},
      {ya:28e3, title:"Fired-clay figurines", desc:"Hunters in Moravia bake clay figurines in kilns, the oldest ceramics, long before pottery vessels."},
      {ya:26e3, title:"The mammoth steppe", desc:"Mammoths, woolly rhinos, and cave lions roam a vast cold grassland spanning Ice Age Eurasia."},
      {ya:24e3, title:"Houses of mammoth bone", desc:"On the treeless steppe, hunters raise sturdy dwellings framed from stacked mammoth bones and tusks."},
      {ya:23e3, title:"Grain gatherers at Ohalo", desc:"Foragers beside the Sea of Galilee harvest and grind wild wheat and barley, long before farming."},
      {ya:20e3, title:"Peak of the Ice Age", desc:"The Last Glacial Maximum; humans reach the Americas across Beringia."},
      {ya:20e3, title:"The oldest pottery", desc:"Foragers in a Chinese cave shape and fire clay pots for cooking, millennia before agriculture."},
      {ya:19e3, title:"Solutrean leaf blades", desc:"Solutrean knappers in Europe pressure-flake exquisitely thin, leaf-shaped stone blades of remarkable delicacy."},
      {ya:18e3, title:"The Bering land bridge", desc:"Lowered seas expose Beringia, a broad tundra plain linking Siberia to Alaska for wandering hunters."},
      {ya:17e3, title:"The spear-thrower", desc:"The atlatl extends a hunter's reach and power, driving herds of bison, reindeer, and horse."},
      {ya:16.5e3, title:"Barbed harpoons", desc:"Barbed points of bone and antler turn rivers and coasts into far richer hunting grounds."},
      {ya:16e3, title:"Across the Americas", desc:"Humans reach the far south of South America, having journeyed the length of two vast continents."},
      {ya:15.5e3, title:"Magdalenian reindeer hunters", desc:"Magdalenian people follow reindeer herds across Europe, crafting fine antler tools and carved ornaments."},
      {ya:15e3, title:"Jomon potters in Japan", desc:"Settled foragers in Japan craft elaborate pottery while still hunting, fishing, and gathering wild foods."},
      {ya:14.7e3, title:"A sudden northern thaw", desc:"An abrupt warming melts the glaciers and greens the tundra, drawing people and herds northward."},
      {ya:14.5e3, title:"The great meltwater surge", desc:"Collapsing ice sheets raise global seas more than a metre each century, drowning coasts and bridges."},
      {ya:14.2e3, title:"The Oberkassel dog", desc:"A dog buried beside a man and woman in Germany is the oldest confirmed domestic dog."},
      {ya:13.5e3, title:"Natufian villages", desc:"Natufian foragers in the Levant settle in stone hamlets and reap wild cereals before farming."},
      {ya:13e3, title:"Clovis hunters", desc:"Clovis bands spread across North America, leaving finely fluted spear points at mammoth kill sites."},
      {ya:12.9e3, title:"The Younger Dryas", desc:"A sudden plunge back into near-glacial cold grips the northern world for over a thousand years."},
      {ya:12.5e3, title:"America's megafauna die off", desc:"Mammoths, mastodons, giant sloths, and sabre-tooths vanish from the Americas within a few thousand years."},
      {ya:12e3, title:"Agriculture", desc:"Humans begin farming in the Fertile Crescent — the Neolithic Revolution."},
      {ya:11.7e3, title:"The Ice Age ends", desc:"A warming, stable climate (the Holocene) begins — the world we know."},
      {ya:11.7e3, title:"The great thaw", desc:"The Younger Dryas ends abruptly, temperatures leaping within decades as the warm, stable Holocene begins."},
      {ya:11.6e3, title:"Göbekli Tepe", desc:"Hunter-gatherers raise monumental stone temples before farming even begins."},
      {ya:10e3, title:"Animal domestication", desc:"Sheep, goats, and cattle are tamed; permanent settlements grow."},
      {ya:10e3, title:"Tower of Jericho", desc:"Beside a desert spring, the walled town of Jericho builds a massive stone tower and thick defenses."},
      {ya:9.2e3, title:"Ain Ghazal statues", desc:"Villagers in Jordan mold ghostly wide-eyed plaster figures, among the earliest large sculptures of people."},
      {ya:9e3, title:"First towns", desc:"Jericho and Çatalhöyük — some of the earliest dense human settlements."},
      {ya:9e3, title:"Çatalhöyük honeycomb town", desc:"Thousands pack into a maze of mud-brick houses in Anatolia, entered by ladders through the roof."},
      {ya:9e3, title:"Farming in New Guinea", desc:"Highlanders drain swamps to grow taro and banana, inventing agriculture independently in the Pacific world."},
      {ya:8.8e3, title:"Jiahu bone flutes", desc:"Chinese villagers carve playable flutes from crane bones and scratch early signs onto tortoise shells."},
      {ya:8.7e3, title:"Maize is bred", desc:"Farmers in southern Mexico transform wild teosinte grass into corn, the grain that will feed the Americas."},
      {ya:8.5e3, title:"Green Sahara herders", desc:"Herders drive cattle across a green, lake-filled Sahara, painting vivid scenes on rocks now lost to desert."},
      {ya:8e3, title:"Rice farming spreads", desc:"Communities along China's Yangtze River tame wild rice, seeding the staple of half of humanity."},
      {ya:8e3, title:"First wine made", desc:"Villagers in the South Caucasus ferment grapes in buried clay jars, brewing the earliest known wine."},
      {ya:7e3, title:"Copper smelting begins", desc:"Metalworkers in the Balkans and Anatolia melt ore from rock, opening humanity's long age of metals."},
      {ya:6.8e3, title:"Yangshao painted pottery", desc:"Millet farmers along the Yellow River paint bold red-and-black pots and raise the first silkworms."},
      {ya:6.5e3, title:"Oldest worked gold", desc:"A Black Sea cemetery at Varna holds the world's earliest gold treasure, marking sharp new social ranks."},
      {ya:6.4e3, title:"Carnac stone rows", desc:"In Brittany, farmers raise thousands of standing stones in mile-long rows, a staggering Neolithic monument."},
      {ya:5.5e3, title:"The wheel", desc:"Wheels for pottery and then transport transform craft and trade."},
      {ya:5.5e3, title:"The potter's wheel", desc:"Mesopotamian craftsmen spin clay on a turning disc, mass-producing pots for fast-growing cities."},
      {ya:5.5e3, title:"Horses are tamed", desc:"Herders on the Eurasian steppe first ride and milk horses, transforming travel, trade, and warfare."},
      {ya:5.4e3, title:"Valdivia pottery", desc:"On Ecuador's coast, villagers shape some of the Americas' earliest ceramics, including expressive clay figurines."},
      {ce:-3300, title:"Bronze Age begins", desc:"Alloying copper with tin yields harder tools and weapons."},
      {ce:-3300, title:"Ötzi the Iceman", desc:"A copper-axe-bearing traveler is killed high in the Alps and frozen, preserving an entire Neolithic life."},
      {ce:-3200, title:"Writing invented", desc:"Sumerian cuneiform and Egyptian hieroglyphs record language for the first time."},
      {ce:-3200, title:"Uruk, the first city", desc:"In Sumer, tens of thousands crowd behind Uruk's walls, forming the world's earliest true city."},
      {ce:-3200, title:"Newgrange passage tomb", desc:"Irish farmers build a huge stone tomb whose chamber floods with sunlight each winter solstice dawn."},
      {ce:-3100, title:"Egypt is unified", desc:"King Narmer joins Upper and Lower Egypt into one realm, founding three thousand years of pharaohs."},
      {ce:-3100, title:"Skara Brae village", desc:"Orkney islanders build snug stone houses with built-in beds and shelves, buried and preserved by sand."},
      {ce:-3000, title:"The Sahara dries", desc:"A once-green Sahara of lakes and cattle turns to desert, driving its peoples toward the Nile."},
      {ce:-3000, title:"Austronesians set sail", desc:"Seafarers from Taiwan begin island-hopping through Southeast Asia, launching history's greatest maritime migration."},
      {ce:-3000, title:"Silk first woven", desc:"Chinese weavers unwind silkworm cocoons into shimmering thread, beginning a craft guarded in secret for ages."},
      {ce:-2700, title:"Egypt's solar calendar", desc:"Egyptian priests time the Nile flood by the star Sirius, fixing a 365-day year still used today."},
      {ce:-2700, title:"Elamite Susa rises", desc:"East of Sumer, the Elamites rule from Susa, longtime rivals and heirs of Mesopotamian civilization."},
      {ce:-2670, title:"Step Pyramid of Djoser", desc:"The architect Imhotep stacks stone into Egypt's first pyramid, launching a thousand-year age of royal tombs."},
      {ce:-2600, title:"Royal Tombs of Ur", desc:"Sumer's kings and Queen Puabi are buried at Ur with golden lyres, jewels, and sacrificed servants."},
      {ce:-2600, title:"Caral, oldest American city", desc:"In coastal Peru, the city of Caral raises stone pyramids and sunken plazas while Egypt builds its own."},
      {ce:-2600, title:"Indus Valley cities", desc:"Harappa and Mohenjo-daro house tens of thousands with grid streets, brick sewers, and great public baths."},
      {ce:-2560, title:"The Great Pyramid", desc:"Egyptians build the Pyramid of Giza — a wonder still standing today."},
      {ce:-2500, title:"The Great Sphinx", desc:"Egyptian workers carve a colossal lion bearing a king's face to guard the pyramids at Giza."},
      {ce:-2500, title:"Kingdom of Kerma", desc:"In Nubia, Kerma grows into Egypt's powerful southern rival, burying its kings beneath giant earthen mounds."},
      {ce:-2450, title:"Sumer's war stele", desc:"The city of Lagash defeats Umma over farmland, carving the Stele of the Vultures, history's first war monument."},
      {ce:-2400, title:"Lothal's brick dock", desc:"The Indus port of Lothal builds a brick tidal dock, evidence of busy sea trade with Mesopotamia."},
      {ce:-2350, title:"The Pyramid Texts", desc:"Spells carved inside royal pyramids become the oldest religious writings, guiding dead pharaohs into the afterlife."},
      {ce:-2334, title:"World's first empire", desc:"Sargon of Akkad conquers Sumer's quarreling cities, forging the earliest known multi-ethnic empire."},
      {ce:-2300, title:"First named author", desc:"Akkadian priestess Enheduanna signs her hymns to the goddess Inanna, the earliest writer known by name."},
      {ce:-2100, title:"Oldest law code", desc:"King Ur-Nammu of Ur issues surviving laws with set fines, three centuries before Hammurabi's famous code."},
      {ce:-2100, title:"Great Ziggurat of Ur", desc:"Ur-Nammu raises a towering mud-brick platform to the moon god, its ruins still looming over Iraq."},
      {ce:-2100, title:"Epic of Gilgamesh", desc:"Sumerian scribes record humanity's oldest epic, a king's grieving quest for immortality after his friend dies."},
      {ce:-2050, title:"Egypt's Middle Kingdom", desc:"Pharaoh Mentuhotep II reunites Egypt after collapse, opening a golden age of literature and craft."},
      {ce:-2000, title:"Stonehenge completed", desc:"Britain's great stone circle reaches its final form."},
      {ce:-2000, title:"The war chariot", desc:"Steppe smiths of the Sintashta culture build light spoke-wheeled chariots that will transform ancient warfare."},
      {ce:-1950, title:"Minoan palaces of Crete", desc:"The Minoans build sprawling palaces like Knossos and trade painted pottery across the Aegean Sea."},
      {ce:-1900, title:"Indus cities decline", desc:"After centuries of prosperity, the great Indus cities empty as rivers shift and long-range trade unravels."},
      {ce:-1900, title:"Assyrian merchant colonies", desc:"Assyrian traders at Kanesh in Anatolia leave thousands of clay tablets recording deals in tin and cloth."},
      {ce:-1900, title:"China's Erlitou culture", desc:"A Bronze-Age palace city on the Yellow River may be the Xia, China's first traditional dynasty."},
      {ce:-1800, title:"First alphabet appears", desc:"Semitic workers in Egypt's turquoise mines simplify hieroglyphs into the first alphabet, ancestor of ours."},
      {ce:-1754, title:"Code of Hammurabi", desc:"Babylon inscribes one of the earliest written legal codes."},
      {ce:-1750, title:"Babylonian mathematics", desc:"Babylonian scribes reckon in base sixty and solve equations, a system still ticking in our clocks."},
      {ce:-1650, title:"The Hittite kingdom", desc:"From rocky Hattusa in Anatolia, the Hittites forge an empire that will rival Egypt and master iron."},
      {ce:-1650, title:"Hyksos rule Egypt", desc:"Asiatic Hyksos seize the Nile delta, bringing the horse-drawn chariot and composite bow to Egypt."},
      {ce:-1600, title:"Thera volcano erupts", desc:"A colossal eruption on Santorini buries a Minoan town and shakes Bronze-Age trade across the Mediterranean."},
      {ce:-1600, title:"Mycenaean warlords rise", desc:"Gold-masked warrior kings fortify Mycenae and other citadels, dominating mainland Greece in the Bronze Age."},
      {ce:-1600, title:"Nebra sky disc", desc:"In central Europe, metalworkers craft a bronze disc inlaid with gold stars, the oldest known map of the sky."},
      {ce:-1595, title:"Fall of Old Babylon", desc:"A Hittite raid down the Euphrates topples Hammurabi's dynasty and ends the Old Babylonian age."},
      {ce:-1550, title:"Egypt's New Kingdom", desc:"Pharaoh Ahmose drives out the Hyksos and launches Egypt's empire, its richest and most powerful era."},
      {ce:-1550, title:"Egyptian Book of the Dead", desc:"Egyptians write spell-filled papyri to guide the dead safely past demons and judgment into the afterlife."},
      {ce:-1500, title:"The Rigveda hymns", desc:"Indo-Aryan priests compose the Rigveda, Hinduism's oldest scripture, memorized aloud for a thousand years."},
      {ce:-1500, title:"Kingdom of Mitanni", desc:"Hurrian-led Mitanni rises in Syria, breeding chariot horses and wedding princesses to Egypt's pharaohs."},
      {ce:-1470, title:"Hatshepsut rules Egypt", desc:"Crowning herself pharaoh, Hatshepsut sends trading fleets to Punt and blankets Egypt in monuments."},
      {ce:-1457, title:"Battle of Megiddo", desc:"Pharaoh Thutmose III crushes a Canaanite coalition at Megiddo, the earliest battle recorded in detail."},
      {ce:-1350, title:"Akhenaten's sun worship", desc:"Pharaoh Akhenaten scraps Egypt's gods for the sun-disc Aten and builds a radical new capital."},
      {ce:-1323, title:"Tutankhamun's golden tomb", desc:"The boy king dies young and is buried with dazzling treasures, left undisturbed until 1922."},
      {ce:-1274, title:"Battle of Kadesh", desc:"Egypt's Ramesses II and the Hittites fight to a bloody draw, then sign the first known peace treaty."},
      {ce:-1250, title:"Oracle bone writing", desc:"Shang diviners scorch ox bones and turtle shells, scratching China's earliest writing to read the future."},
      {ce:-1208, title:"First mention of Israel", desc:"Pharaoh Merneptah's victory stele carries the earliest known written reference to a people called Israel."},
      {ce:-1200, title:"Bronze Age collapse", desc:"Mediterranean civilizations fall in a wave of upheaval; the Iron Age follows."},
      {ce:-1200, title:"Tomb of Fu Hao", desc:"A Shang queen and general is buried with bronzes, jades, and weapons, revealing a woman of real power."},
      {ce:-1200, title:"Ironworking spreads", desc:"As bronze trade networks fail, smiths across Anatolia and the Levant turn to harder, cheaper iron."},
      {ce:-1200, title:"Olmec civilization begins", desc:"At San Lorenzo, Mesoamerica's first civilization carves colossal basalt heads of its helmeted rulers."},
      {ce:-1200, title:"Sanxingdui bronze masks", desc:"In Sichuan, a lost culture buries towering bronze masks with jutting eyes, unlike anything in Shang China."},
      {ce:-1180, title:"Fall of Troy", desc:"A rich fortified city at Troy burns to the ground, an event later immortalized in Homer's epics."},
      {ce:-1177, title:"Sea Peoples invade", desc:"Mysterious seaborne raiders ravage the eastern Mediterranean as Bronze-Age kingdoms topple one after another."},
      {ce:-1100, title:"Poverty Point mounds", desc:"Hunter-gatherers in Louisiana raise enormous concentric earthworks, a marvel of monument building in North America."},
      {ce:-1100, title:"Babylonian creation epic", desc:"Babylon's Enuma Elish tells how the god Marduk slays chaos and forms the world from a sea dragon's body."},
      {ce:-1050, title:"Phoenician alphabet", desc:"Phoenician traders spread a compact twenty-two-letter alphabet that will seed Greek, Latin, and countless scripts."},
      {ce:-1046, title:"Zhou overthrow Shang", desc:"King Wu defeats the Shang at Muye and claims the Mandate of Heaven to rule all China."},
      {ce:-1000, title:"David's kingdom", desc:"In the Hebrew Bible, David unites the Israelite tribes and makes Jerusalem his capital city."},
      {ce:-1000, title:"Lapita reach the Pacific", desc:"Seafaring Lapita potters settle Fiji, Tonga, and Samoa, becoming ancestors of the Polynesians."},
      {ce:-1000, title:"Zoroaster's new faith", desc:"In ancient Iran, the prophet Zoroaster preaches one supreme god and a cosmic struggle of good and evil."},
      {ce:-1000, title:"Bantu migrations begin", desc:"Iron-using Bantu farmers begin spreading from West Africa, reshaping the languages of half a continent."},
      {ce:-1000, title:"Phoenician sea traders", desc:"From Tyre and Sidon, Phoenician merchants ply the Mediterranean, trading cedar, glass, and prized purple dye."},
      {ce:-960, title:"Solomon's First Temple", desc:"King Solomon builds Jerusalem's great temple, the heart of Israelite worship for nearly four centuries."},
      {ce:-900, title:"La Venta pyramid", desc:"The Olmec center of La Venta raises a great clay pyramid and refines Mesoamerican ritual and art."},
      {ce:-883, title:"Assyria's war machine", desc:"Assyria builds the ancient world's most feared army, ruling from the Nile to the Persian Gulf."},
      {ce:-840, title:"Kingdom of Urartu", desc:"Around Lake Van, Urartu builds fortress cities and fine metalwork, a stubborn rival to Assyria."},
      {ce:-814, title:"Carthage is founded", desc:"Phoenician settlers from Tyre found Carthage, which will grow into Rome's mightiest rival."},
      {ce:-800, title:"Kingdom of D'mt", desc:"In the Ethiopian highlands, D'mt builds stone temples and trades incense across the Red Sea."},
      {ce:-800, title:"Greeks adopt the alphabet", desc:"Greeks borrow Phoenician letters and add vowels, creating the alphabet behind all Western writing."},
      {ce:-800, title:"Hallstatt Celts", desc:"Iron-Age Celts of Hallstatt grow wealthy mining salt and trading their wares across Central Europe."},
      {ce:-800, title:"Aramaic spreads wide", desc:"The simple Aramaic alphabet and tongue spread across the Near East, becoming its language of trade and rule."},
      {ce:-776, title:"First Olympic Games", desc:"Athletes gather at Olympia to honor Zeus, starting contests the Greeks will count for a thousand years."},
      {ce:-771, title:"Eastern Zhou begins", desc:"Zhou royal power shatters as rival states contend, opening China's brilliant, bloody Spring and Autumn age."},
      {ce:-753, title:"Rome founded", desc:"Traditional date for the founding of the city of Rome."},
      {ce:-750, title:"Homer's epics", desc:"The Iliad and Odyssey, long sung by bards, are set down and become the bedrock of Greek culture."},
      {ce:-728, title:"Kush conquers Egypt", desc:"Nubian king Piye marches north and rules Egypt as pharaoh, founding the Kushite twenty-fifth dynasty."},
      {ce:-722, title:"Israel falls to Assyria", desc:"Assyria destroys the northern kingdom of Israel and deports its people, the fabled lost tribes."},
      {ce:-710, title:"King Midas of Phrygia", desc:"Phrygia's real King Midas, later mythologized for his golden touch, rules from Anatolian Gordium."},
      {ce:-701, title:"Assyria besieges Jerusalem", desc:"Sennacherib's army surrounds Jerusalem, then withdraws, an escape long remembered in the Hebrew Bible."},
      {ce:-700, title:"Scythian horse nomads", desc:"Fierce mounted Scythians rule the Eurasian steppe, burying their chieftains with gold and slain horses."},
      {ce:-700, title:"The Upanishads", desc:"Indian sages compose the Upanishads, probing the self and ultimate reality at the root of Hindu thought."},
      {ce:-700, title:"The Median Empire", desc:"The Medes unite the Iranian tribes into a kingdom that will help topple mighty Assyria."},
      {ce:-700, title:"Kingdom of Saba", desc:"In Yemen, the Sabaeans grow rich on the incense trade and build the mighty dam at Marib."},
      {ce:-700, title:"Etruscan cities rise", desc:"In central Italy, the Etruscans build wealthy city-states whose art and rites will shape early Rome."},
      {ce:-650, title:"Ashurbanipal's library", desc:"The Assyrian king gathers thousands of tablets at Nineveh, preserving Gilgamesh and Babylonian learning."},
      {ce:-621, title:"Draconian laws", desc:"Athens gets its first written laws from Draco, so harsh that his name still means merciless."},
      {ce:-612, title:"Nineveh is destroyed", desc:"Babylonians and Medes storm Nineveh, ending the Assyrian empire that had terrorized the Near East."},
      {ce:-604, title:"Babylon's golden age", desc:"Nebuchadnezzar II rebuilds Babylon with the blue Ishtar Gate and, by legend, the Hanging Gardens."},
      {ce:-600, title:"First coins minted", desc:"In Lydia, kings stamp lumps of electrum into the world's first coins, transforming everyday trade."},
      {ce:-600, title:"India's sixteen states", desc:"Sixteen kingdoms and republics rise across northern India, setting the stage for Buddhism and empire."},
      {ce:-594, title:"Solon reforms Athens", desc:"Statesman Solon cancels crushing debts and rewrites the laws, laying groundwork for later democracy."},
      {ce:-586, title:"Babylon exiles Judah", desc:"Nebuchadnezzar razes Jerusalem's temple and deports its people, beginning the Judeans' Babylonian exile."},
      {ce:-585, title:"Thales predicts eclipse", desc:"Greek thinker Thales reportedly foretells a solar eclipse, a landmark in reasoning about nature."},
      {ce:-550, title:"Persian Empire founded", desc:"Cyrus the Great overthrows the Medes and builds the largest empire the world has yet seen."},
      {ce:-540, title:"Mahavira founds Jainism", desc:"In India, Mahavira teaches radical nonviolence and self-denial, shaping the Jain faith for millennia."},
      {ce:-539, title:"Cyrus frees Babylon", desc:"Cyrus takes Babylon without a battle and lets exiled peoples, including the Judeans, return home."},
      {ce:-530, title:"Pythagoras of Samos", desc:"The Greek sage Pythagoras founds a brotherhood exploring numbers, music, and geometry as keys to the cosmos."},
      {ce:-525, title:"Persia conquers Egypt", desc:"Cyrus's son Cambyses defeats the pharaoh at Pelusium, folding ancient Egypt into the Persian Empire."},
      {ce:-520, title:"Darius organizes Persia", desc:"Darius the Great divides his vast empire into provinces linked by royal roads and a common coinage."},
      {ce:-509, title:"Roman Republic founded", desc:"Romans expel their last king and establish a republic led by elected consuls and a powerful senate."},
      {ce:-508, title:"Athenian democracy", desc:"Athens establishes the first known democracy."},
      {ce:-500, title:"Buddha & Confucius", desc:"An axial age of thought: the Buddha in India, Confucius in China."},
      {ce:-500, title:"Monte Alban founded", desc:"The Zapotec build a mountaintop capital in Oaxaca, using early Mesoamerican writing and a calendar."},
      {ce:-499, title:"Ionian Revolt", desc:"Greek cities of Asia Minor rebel against Persian rule, igniting decades of war between Greece and the empire."},
      {ce:-490, title:"Battle of Marathon", desc:"Outnumbered Athenians rout a Persian invasion force on the coast, proving the mighty empire could be beaten."},
      {ce:-480, title:"Stand at Thermopylae", desc:"Leonidas and his Spartans die defending a narrow pass, buying Greece time against Xerxes' enormous army."},
      {ce:-480, title:"Battle of Salamis", desc:"Greek triremes crush the Persian fleet in a narrow strait, turning the tide of Xerxes' invasion."},
      {ce:-480, title:"Battle of Himera", desc:"Sicilian Greeks defeat a huge Carthaginian army, securing Greek power across the western Mediterranean for decades."},
      {ce:-479, title:"Battle of Plataea", desc:"A united Greek army destroys Persia's land forces, ending Xerxes' dream of conquering the Greek mainland."},
      {ce:-478, title:"Delian League formed", desc:"Athens leads a naval alliance against Persia that gradually hardens into the base of an Athenian empire."},
      {ce:-461, title:"Age of Pericles", desc:"Pericles rises to guide Athens through its democratic height, imperial power, and dazzling cultural golden age."},
      {ce:-458, title:"Aeschylus stages the Oresteia", desc:"The tragedian's trilogy on vengeance and justice shapes Western theater and dramatizes the birth of the law court."},
      {ce:-451, title:"The Twelve Tables", desc:"Rome inscribes its first written laws on bronze, making legal rules public and binding for every citizen."},
      {ce:-450, title:"Chavin culture peaks", desc:"In the Peruvian Andes the Chavin religious cult spreads shared art and belief, uniting scattered highland communities."},
      {ce:-440, title:"Herodotus writes history", desc:"The Greek traveler composes the first great prose history, inquiring into the origins of the Persian Wars."},
      {ce:-431, title:"Peloponnesian War begins", desc:"Athens and Sparta drag the Greek world into a generation of ruinous war that exhausts every city."},
      {ce:-430, title:"Plague of Athens", desc:"A mysterious epidemic kills perhaps a third of Athenians, including Pericles, and cripples the city's war effort."},
      {ce:-415, title:"Sicilian Expedition", desc:"Athens gambles a vast fleet on invading distant Sicily and loses the entire force in catastrophic defeat."},
      {ce:-404, title:"Athens surrenders", desc:"Sparta's victory ends the long Peloponnesian War, dissolving Athens' empire and its democracy for a bitter year."},
      {ce:-401, title:"March of the Ten Thousand", desc:"Greek mercenaries fight deep inside Persia and battle their way home, immortalized in Xenophon's gripping Anabasis."},
      {ce:-400, title:"Nok terracotta sculptures", desc:"In West Africa the Nok culture crafts striking terracotta figures and works iron unusually early."},
      {ce:-399, title:"Trial of Socrates", desc:"Athens condemns the questioning philosopher to drink hemlock for impiety and for corrupting the city's young men."},
      {ce:-390, title:"Gauls sack Rome", desc:"Celtic warriors crush a Roman army and burn the city, a humiliation Rome brooded over for centuries."},
      {ce:-387, title:"Plato founds the Academy", desc:"The philosopher opens a school outside Athens that trains thinkers and shapes philosophy for nearly a millennium."},
      {ce:-371, title:"Battle of Leuctra", desc:"Thebes shatters the Spartan army with bold new tactics, ending Sparta's long reputation for invincibility."},
      {ce:-359, title:"Philip II takes Macedon", desc:"A reforming king forges a professional army and shrewd diplomacy that will subdue Greece within two decades."},
      {ce:-338, title:"Battle of Chaeronea", desc:"Philip of Macedon defeats the allied Greek city-states, ending their independence and unifying Greece under his rule."},
      {ce:-336, title:"Alexander the Great", desc:"Alexander forges an empire from Greece to India, spreading Hellenistic culture."},
      {ce:-335, title:"Aristotle founds the Lyceum", desc:"The philosopher establishes a school and library, systematizing knowledge from biology and logic to ethics and politics."},
      {ce:-331, title:"Battle of Gaugamela", desc:"Alexander's army destroys Darius III's host, cracking open the heart of the vast Persian Empire to conquest."},
      {ce:-323, title:"Wars of the Diadochi", desc:"Alexander's generals carve his sprawling empire into rival kingdoms after his sudden death in Babylon."},
      {ce:-321, title:"Maurya Empire founded", desc:"Chandragupta Maurya unites northern India into its first great empire, ruling from the city of Pataliputra."},
      {ce:-312, title:"The Appian Way begun", desc:"Rome lays its first great paved road and aqueduct, engineering that binds and supplies its expanding domain."},
      {ce:-305, title:"Chandragupta defeats Seleucus", desc:"The Maurya ruler forces Alexander's successor to cede vast lands, gaining territory in exchange for war elephants."},
      {ce:-300, title:"Euclid's Elements", desc:"The Alexandrian mathematician organizes geometry into rigorous proofs that train logical reasoning for over two thousand years."},
      {ce:-300, title:"Meroe, city of iron", desc:"The Kushite capital on the Nile thrives as a hub of ironworking and trade deep into Africa."},
      {ce:-295, title:"Library of Alexandria", desc:"The Ptolemies build a vast library and research museum, striving to gather every scroll of human knowledge."},
      {ce:-280, title:"Colossus of Rhodes", desc:"A bronze statue of the sun god over thirty meters tall rises above Rhodes harbor as a wonder."},
      {ce:-270, title:"Aristarchus proposes heliocentrism", desc:"The Greek astronomer argues that Earth orbits the Sun, an insight ignored for nearly eighteen centuries."},
      {ce:-268, title:"Ashoka's reign begins", desc:"The Maurya emperor extends his rule across nearly the entire Indian subcontinent from his throne at Pataliputra."},
      {ce:-264, title:"First Punic War", desc:"Rome and Carthage begin a long struggle for Sicily, forcing Rome to build its first great navy."},
      {ce:-261, title:"The Kalinga War", desc:"Ashoka's brutal conquest of Kalinga sickens him with remorse and turns him toward Buddhist compassion and nonviolence."},
      {ce:-257, title:"Ashoka's rock edicts", desc:"The emperor inscribes moral teachings on pillars and rocks across India, promoting tolerance, welfare, and Buddhist ideals."},
      {ce:-250, title:"Buddhism reaches Sri Lanka", desc:"Ashoka's son Mahinda carries Buddhism to the island, founding a monastic tradition that endures to today."},
      {ce:-247, title:"Parthian Empire founded", desc:"Arsaces leads a revolt that raises an Iranian dynasty, ruling the plateau and later checking Rome for centuries."},
      {ce:-241, title:"Rome wins Sicily", desc:"Carthage cedes Sicily after crushing naval defeat, handing Rome its first overseas province and Mediterranean ambition."},
      {ce:-240, title:"Eratosthenes measures the Earth", desc:"Comparing shadows at two Egyptian cities, the scholar calculates the planet's circumference with remarkable accuracy."},
      {ce:-221, title:"China unified", desc:"The Qin dynasty unites China; work on the Great Wall begins."},
      {ce:-218, title:"Hannibal crosses the Alps", desc:"The Carthaginian general marches an army and war elephants over the mountains to strike Rome in Italy."},
      {ce:-216, title:"Battle of Cannae", desc:"Hannibal encircles and annihilates a huge Roman army, inflicting the deadliest single day in Rome's history."},
      {ce:-214, title:"The Great Wall of China", desc:"Qin armies join frontier ramparts into a vast wall guarding the settled south against northern steppe raiders."},
      {ce:-213, title:"Qin burns the books", desc:"China's first emperor orders rival philosophical texts destroyed, seeking to control thought, history, and dissent."},
      {ce:-212, title:"Death of Archimedes", desc:"A Roman soldier kills the brilliant mathematician as Syracuse falls, ignoring orders to take him alive."},
      {ce:-209, title:"Xiongnu confederation", desc:"Modu Chanyu unites the steppe nomads into a formidable empire that will rival and pressure Han China."},
      {ce:-202, title:"Battle of Zama", desc:"Scipio defeats Hannibal in North Africa, ending the Second Punic War and breaking Carthaginian power for good."},
      {ce:-202, title:"Han dynasty founded", desc:"Liu Bang, a peasant rebel turned emperor, begins four centuries of Han rule that define Chinese identity."},
      {ce:-185, title:"Maurya Empire ends", desc:"A general assassinates the last Maurya ruler and founds the Shunga dynasty, splintering northern India again."},
      {ce:-168, title:"Battle of Pydna", desc:"Rome crushes the Macedonian phalanx, toppling the kingdom of Alexander's heirs and dominating the Greek east."},
      {ce:-167, title:"The Maccabean Revolt", desc:"Jewish fighters rise against Seleucid rulers who outlawed their faith and defiled the Temple in Jerusalem."},
      {ce:-164, title:"Rededication of the Temple", desc:"The victorious Maccabees cleanse and rededicate Jerusalem's Temple, an event later remembered in the festival of Hanukkah."},
      {ce:-149, title:"Third Punic War", desc:"Rome besieges Carthage in a final, merciless war intended to erase its ancient rival from the earth."},
      {ce:-146, title:"Destruction of Carthage", desc:"Rome razes Carthage and enslaves its survivors, ending seven centuries of the great Phoenician trading city."},
      {ce:-146, title:"Sack of Corinth", desc:"Rome destroys Corinth the same year, crushing Greek resistance and cementing its mastery over the Greek world."},
      {ce:-141, title:"Emperor Wu of Han", desc:"China's expansionist emperor pushes borders outward and elevates Confucianism as the guiding doctrine of the state."},
      {ce:-138, title:"Zhang Qian's western journey", desc:"A Han envoy explores Central Asia and returns with knowledge that opens the trade routes later called the Silk Road."},
      {ce:-133, title:"Tiberius Gracchus killed", desc:"A reforming tribune pushing land redistribution is beaten to death, opening a century of Roman political bloodshed."},
      {ce:-107, title:"Marius reforms the army", desc:"The consul opens the legions to the landless poor, forging troops loyal to generals rather than the state."},
      {ce:-100, title:"The Sangam age", desc:"South India's Tamil kingdoms flourish, producing a classical body of poetry on love, war, and kingship."},
      {ce:-73, title:"Revolt of Spartacus", desc:"An enslaved gladiator leads tens of thousands in a rebellion that shakes the Roman Republic to its core."},
      {ce:-63, title:"Pompey takes Jerusalem", desc:"The Roman general seizes Judea, beginning Rome's long and turbulent domination over the Jewish homeland."},
      {ce:-60, title:"The First Triumvirate", desc:"Caesar, Pompey, and Crassus secretly split power among themselves, sidelining the Senate and hollowing the Republic."},
      {ce:-58, title:"Caesar's Gallic Wars", desc:"Julius Caesar conquers Gaul over eight brutal years, winning wealth, a devoted army, and enormous fame."},
      {ce:-53, title:"Battle of Carrhae", desc:"Parthian horse archers annihilate Crassus' legions in the desert, one of Rome's worst defeats in the east."},
      {ce:-52, title:"Siege of Alesia", desc:"Caesar traps and defeats the Gallic chief Vercingetorix, completing the Roman conquest of all Gaul."},
      {ce:-49, title:"Crossing the Rubicon", desc:"Caesar marches his army into Italy against the Senate's command, plunging Rome into civil war."},
      {ce:-48, title:"Battle of Pharsalus", desc:"Caesar decisively defeats Pompey in Greece, making himself the effective master of the Roman world."},
      {ce:-46, title:"The Julian calendar", desc:"Caesar reforms the calendar to 365 days with leap years, a system that endures for sixteen centuries."},
      {ce:-44, title:"Assassination of Caesar", desc:"Senators stab the dictator to death on the Ides of March, hoping in vain to restore the Republic."},
      {ce:-37, title:"Goguryeo kingdom founded", desc:"A powerful state arises in the north of Korea and Manchuria, one of Korea's Three Kingdoms."},
      {ce:-31, title:"Battle of Actium", desc:"Octavian's fleet defeats Antony and Cleopatra off Greece, leaving him the undisputed ruler of Rome."},
      {ce:-30, title:"Death of Cleopatra", desc:"Egypt's last pharaoh takes her own life, and the ancient Ptolemaic kingdom becomes a Roman province."},
      {ce:-27, title:"The Roman Empire", desc:"Augustus becomes the first emperor; Rome enters its imperial peak."},
      {ce:-19, title:"Virgil's Aeneid", desc:"Rome's national epic links the city's origins to Troy and casts its empire as a destiny ordained by gods."},
      {ce:1, title:"The Common Era", desc:"The conventional start of the modern calendar."},
      {ce:9, title:"Battle of Teutoburg Forest", desc:"Germanic tribes ambush and destroy three Roman legions, permanently halting Rome's expansion east of the Rhine."},
      {ce:9, title:"Wang Mang seizes power", desc:"A reformist minister usurps the Han throne and founds the short-lived Xin dynasty, decreeing sweeping changes."},
      {ce:14, title:"Death of Augustus", desc:"Rome's first emperor dies after four decades, having quietly transformed a republic into an enduring monarchy."},
      {ce:25, title:"Eastern Han restored", desc:"Emperor Guangwu defeats his rivals and rebuilds the Han dynasty, ruling a reunited China from Luoyang."},
      {ce:30, title:"Crucifixion of Jesus", desc:"A Jewish preacher is executed in Jerusalem, and his followers ignite a movement that becomes Christianity."},
      {ce:40, title:"Revolt of the Trung Sisters", desc:"Two sisters lead Vietnam in rebellion against Chinese rule, briefly winning independence before Han armies return."},
      {ce:43, title:"Rome invades Britain", desc:"Emperor Claudius sends legions across the Channel, beginning nearly four centuries of Roman rule in Britain."},
      {ce:50, title:"Periplus of the Erythraean Sea", desc:"A Greek merchant's handbook charts a thriving Indian Ocean trade linking Egypt, East Africa, Arabia, and India."},
      {ce:60, title:"Hero's steam device", desc:"The Alexandrian inventor describes a spinning steam-powered sphere, glimpsing a technology the world will not harness for ages."},
      {ce:64, title:"Great Fire of Rome", desc:"Flames ravage the city for days, and Nero deflects blame onto the small, distrusted Christian community."},
      {ce:66, title:"Great Jewish Revolt", desc:"Judea rises against Roman rule, launching a war that ends with Jerusalem sacked and the Temple burned."},
      {ce:68, title:"Buddhism reaches China", desc:"Emperor Ming welcomes Buddhist monks and founds the White Horse Temple, planting a faith that reshapes East Asia."},
      {ce:70, title:"Destruction of the Second Temple", desc:"Roman legions burn Jerusalem's Temple, ending the sacrificial heart of ancient Judaism and reshaping the religion."},
      {ce:73, title:"Fall of Masada", desc:"Jewish rebels atop a desert fortress choose death over capture as Rome breaches their final stronghold."},
      {ce:80, title:"The Colosseum opens", desc:"Rome inaugurates its colossal amphitheater with a hundred days of gladiator combat, staged hunts, and spectacle."},
      {ce:90, title:"Rabbinic Judaism emerges", desc:"After the Temple's loss, sages at Yavneh refocus Judaism on study, prayer, and the interpretation of law."},
      {ce:100, title:"Teotihuacan rises", desc:"A vast, carefully planned city grows in the Valley of Mexico, crowned by the towering Pyramid of the Sun."},
      {ce:100, title:"Kingdom of Axum", desc:"A trading power rises in the Ethiopian highlands, commanding Red Sea routes between Rome, Arabia, and India."},
      {ce:100, title:"Kingdom of Funan", desc:"The first major Southeast Asian state emerges in the Mekong delta, thriving on maritime trade across the region."},
      {ce:105, title:"Cai Lun improves paper", desc:"A Han court official refines papermaking into a cheap, practical writing surface that eventually spreads worldwide."},
      {ce:106, title:"Rome annexes Petra", desc:"The empire absorbs the wealthy Nabataean kingdom, seizing control of its lucrative desert caravan trade in incense."},
      {ce:117, title:"Empire at its greatest", desc:"Trajan's death leaves Rome stretched from Britain to the Persian Gulf, marking its largest territorial extent ever."},
      {ce:122, title:"Hadrian's Wall", desc:"Rome builds a stone wall across northern Britain to mark its frontier and control movement from the north."},
      {ce:126, title:"The Pantheon rebuilt", desc:"Hadrian completes a temple to all the gods whose vast unreinforced concrete dome still stands in Rome."},
      {ce:127, title:"Kanishka and the Kushans", desc:"The Kushan emperor rules from Central Asia into India, patronizing Buddhism and the flowering of Gandharan art."},
      {ce:132, title:"Bar Kokhba Revolt", desc:"Jews rise once more against Rome; the crushing defeat scatters them and renames Judea as Syria Palaestina."},
      {ce:132, title:"Zhang Heng's seismograph", desc:"The Han polymath builds a bronze instrument that senses the direction of distant, otherwise unfelt earthquakes."},
      {ce:150, title:"Ptolemy's Almagest", desc:"The Alexandrian astronomer codifies an Earth-centered cosmos that dominates astronomy across Europe and Islam for centuries."},
      {ce:150, title:"Hopewell mound builders", desc:"Across eastern North America, communities raise elaborate earthworks and trade rare goods over an immense network."},
      {ce:165, title:"The Antonine Plague", desc:"A devastating epidemic, likely smallpox, sweeps the Roman Empire and kills millions across a wracking generation."},
      {ce:170, title:"Galen systematizes medicine", desc:"The Greek physician in Rome writes anatomical and medical works that dominate European healing for over a millennium."},
      {ce:180, title:"Death of Marcus Aurelius", desc:"The philosopher-emperor's death ends the Pax Romana and the golden age of Rome's five good emperors."},
      {ce:184, title:"Yellow Turban Rebellion", desc:"A massive Daoist peasant uprising convulses the Han dynasty and pushes China toward warlord fragmentation."},
      {ce:200, title:"Moche civilization", desc:"On Peru's north coast the Moche raise adobe pyramids and craft vivid pottery portraying gods and daily life."},
      {ce:200, title:"The Mishnah compiled", desc:"Rabbi Judah the Prince edits generations of Jewish oral law into a written code, the foundation of the Talmud."},
      {ce:212, title:"Edict of Caracalla", desc:"The emperor grants Roman citizenship to nearly every free inhabitant of the empire in a single sweeping decree."},
      {ce:220, title:"Fall of the Han", desc:"The last Han emperor abdicates and China splinters into the Three Kingdoms, ending four centuries of unity."},
      {ce:224, title:"Sasanian Empire founded", desc:"Ardashir overthrows the Parthians and builds a revived Persian empire that will rival Rome for four centuries."},
      {ce:235, title:"Crisis of the Third Century", desc:"Rome plunges into fifty years of civil war, invasion, plague, and near economic collapse under short-lived emperors."},
      {ce:239, title:"Queen Himiko of Wa", desc:"A shaman queen ruling a Japanese realm sends envoys to China's court, entering the written historical record."},
