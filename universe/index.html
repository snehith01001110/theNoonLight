      {ce:240, title:"Mani preaches in Persia", desc:"The prophet Mani founds Manichaeism, fusing several faiths into a religion that spreads from Rome to China."},
      {ce:249, title:"Plague of Cyprian", desc:"A ferocious epidemic ravages the Roman Empire, deepening the third-century crisis and driving conversions to Christianity."},
      {ce:250, title:"Classic Maya period begins", desc:"Maya city-states across Mesoamerica flourish, raising stone temples and recording dynastic history in hieroglyphic writing."},
      {ce:250, title:"The Nazca Lines", desc:"On a desert plateau in Peru, people etch enormous animal and geometric figures visible only from high above."},
      {ce:260, title:"Emperor Valerian captured", desc:"Persia's Shapur seizes a Roman emperor alive in battle, an unprecedented and shocking humiliation for Rome."},
      {ce:270, title:"Zenobia's desert empire", desc:"Queen Zenobia of Palmyra breaks from Rome and briefly rules from Syria across Egypt before the empire strikes back."},
      {ce:280, title:"Jin reunifies China", desc:"The Jin dynasty conquers its last rival and briefly reunites China after decades of the Three Kingdoms."},
      {ce:284, title:"Diocletian's reforms", desc:"A soldier-emperor reorganizes the shattered empire and its army, ending the long third-century crisis with an iron hand."},
      {ce:293, title:"The Tetrarchy", desc:"Diocletian splits imperial rule among four emperors, seeking to govern and defend the sprawling empire more effectively."},
      {ce:301, title:"Armenia adopts Christianity", desc:"Armenia becomes the first kingdom to embrace Christianity as its official state religion, ahead of Rome itself."},
      {ce:303, title:"The Great Persecution", desc:"Diocletian launches Rome's harshest assault on Christians, razing churches and burning scriptures across the empire."},
      {ce:311, title:"Sack of Luoyang", desc:"Xiongnu-led forces storm the Jin capital, driving Chinese elites south and fracturing the north for generations."},
      {ce:312, title:"Battle of Milvian Bridge", desc:"Constantine wins control of Rome under a Christian sign, setting the empire on its path toward conversion."},
      {ce:313, title:"Edict of Milan", desc:"Constantine and Licinius grant Christians the freedom to worship, ending centuries of sporadic Roman persecution."},
      {ce:320, title:"Gupta Empire founded", desc:"Chandragupta I begins a dynasty that ushers in a golden age of Indian science, art, and literature."},
      {ce:325, title:"Council of Nicaea", desc:"Bishops summoned by Constantine hammer out core Christian doctrine and the disputed nature of Christ."},
      {ce:330, title:"Constantinople founded", desc:"Constantine dedicates a new eastern capital on the Bosphorus that will outlast Rome by a thousand years."},
      {ce:330, title:"Axum embraces Christianity", desc:"King Ezana converts, making the East African kingdom of Axum one of the earliest Christian states on Earth."},
      {ce:350, title:"Axum conquers Kush", desc:"Ezana's armies sack Meroe, toppling the ancient Nubian kingdom of Kush along the middle Nile."},
      {ce:361, title:"Julian the Apostate", desc:"The last pagan emperor tries to revive the old gods and curb Christianity, but dies campaigning in Persia."},
      {ce:375, title:"Huns reach Europe", desc:"Nomadic horsemen from the steppe surge into Europe, setting off waves of desperate Germanic migration."},
      {ce:378, title:"Battle of Adrianople", desc:"Goths annihilate an eastern Roman army and kill the emperor, exposing the empire's dangerous new weakness."},
      {ce:378, title:"Teotihuacan enters Tikal", desc:"Warriors linked to distant Teotihuacan install a new dynasty at the Maya city of Tikal, reshaping the region."},
      {ce:380, title:"Christianity made official", desc:"Emperor Theodosius proclaims Nicene Christianity the official religion of the Roman state, sidelining every rival cult."},
      {ce:380, title:"Chandragupta II's golden age", desc:"Gupta India flourishes in poetry, sculpture, and mathematics, with the poet Kalidasa adorning a brilliant court."},
      {ce:383, title:"Battle of Fei River", desc:"A smaller southern army routs a vast northern host, preserving a divided China and the south's independence."},
      {ce:391, title:"Pagan worship banned", desc:"Theodosius outlaws pagan sacrifice and closes the temples, hastening the twilight of the ancient Greco-Roman gods."},
      {ce:395, title:"Empire splits in two", desc:"At Theodosius' death the Roman Empire divides permanently into eastern and western halves that drift steadily apart."},
      {ce:399, title:"Faxian's pilgrimage to India", desc:"The Chinese monk sets out overland for India to collect Buddhist scriptures, recording the many lands he crosses."},
      {ce:405, title:"Jerome's Latin Vulgate", desc:"Jerome completes a Latin translation of scripture that becomes the standard Bible of Western Christianity for a millennium."},
      {ce:410, title:"Visigoths sack Rome", desc:"Alaric's Goths plunder the eternal city, the first foreign army to breach Rome in eight hundred years."},
      {ce:415, title:"Death of Hypatia", desc:"A Christian mob murders the pagan philosopher and mathematician in Alexandria, a grim emblem of an age ending."},
      {ce:451, title:"Battle of the Catalaunian Plains", desc:"Romans and Visigoths together halt Attila the Hun's invasion of Gaul in one of antiquity's largest battles."},
      {ce:451, title:"Council of Chalcedon", desc:"A great church council defines Christ's two natures, a ruling that splits Eastern Christianity for good."},
      {ce:455, title:"Vandals sack Rome", desc:"A seaborne Germanic army plunders Rome for two weeks, stripping the city of its treasures and gilding."},
      {ce:476, title:"Fall of Rome", desc:"The Western Roman Empire collapses; Europe enters the early Middle Ages."},
      {ce:486, title:"Clovis unites the Franks", desc:"The Frankish king defeats the last Roman ruler in Gaul and founds a kingdom that becomes medieval France."},
      {ce:493, title:"Theodoric rules Italy", desc:"The Ostrogothic king takes Italy and governs from Ravenna, preserving Roman law and culture under Gothic rule."},
      {ce:499, title:"Aryabhata's astronomy", desc:"The Indian mathematician proposes Earth's daily rotation and advances trigonometry, place-value numbers, and the concept of zero."},
      {ce:507, title:"Franks defeat the Visigoths", desc:"Clovis crushes the Visigoths at Vouille and drives them into Iberia, forging a Frankish kingdom across Gaul."},
      {ce:529, title:"Justinian's legal code", desc:"Byzantine jurists distill Roman law into the Corpus Juris Civilis, a foundation for legal systems for centuries."},
      {ce:529, title:"Rule of Saint Benedict", desc:"Benedict founds Monte Cassino and writes a monastic rule that will shape Western monasticism for a thousand years."},
      {ce:537, title:"Hagia Sophia completed", desc:"Justinian raises a vast domed cathedral in Constantinople, the largest enclosed space in the world for centuries."},
      {ce:541, title:"Plague of Justinian", desc:"A bubonic pandemic sweeps the Byzantine Empire, killing millions and wrecking Justinian's dream of restoring Rome."},
      {ce:550, title:"Fall of Teotihuacan", desc:"Mesoamerica's greatest city is burned and abandoned, ending its long dominance over the central Mexican highlands."},
      {ce:552, title:"Silkworms reach Byzantium", desc:"Monks smuggle silkworm eggs to Constantinople, breaking China's monopoly and founding a European silk industry."},
      {ce:589, title:"Sui reunify China", desc:"The Sui dynasty ends centuries of division, uniting northern and southern China under a single throne."},
      {ce:597, title:"Augustine's mission to England", desc:"A monk sent by the pope converts the king of Kent, beginning the Christianization of Anglo-Saxon England."},
      {ce:609, title:"Grand Canal of China", desc:"The Sui link the Yellow and Yangtze rivers with a vast waterway, binding China's economy together."},
      {ce:610, title:"Islam", desc:"Muhammad begins preaching; a new faith and empire spread rapidly."},
      {ce:618, title:"Tang dynasty founded", desc:"The Tang open a golden age of poetry, trade, and cosmopolitan power radiating along the Silk Road."},
      {ce:634, title:"Tibetan Empire rises", desc:"King Songtsen Gampo unites Tibet, adopts Buddhism, and builds a power that soon rivals Tang China."},
      {ce:636, title:"Battle of Yarmuk", desc:"Arab armies rout the Byzantines in Syria, tearing away the empire's richest eastern provinces forever."},
      {ce:645, title:"Taika Reforms in Japan", desc:"Japan's court remakes the state on a Chinese model, strengthening imperial power and centralized government."},
      {ce:651, title:"Sassanid Empire falls", desc:"Arab conquest ends four centuries of Persian rule as Islam spreads across the Iranian plateau."},
      {ce:661, title:"Umayyad Caliphate founded", desc:"Muawiya establishes a dynasty at Damascus that expands Muslim rule from Iberia to Central Asia."},
      {ce:668, title:"Silla unifies Korea", desc:"The kingdom of Silla, allied with Tang China, defeats its rivals to unite the Korean peninsula."},
      {ce:680, title:"Battle of Karbala", desc:"The killing of Muhammad's grandson Husayn deepens the Sunni-Shia split that still shapes Islam today."},
      {ce:683, title:"Rise of Srivijaya", desc:"A Sumatran maritime kingdom seizes the spice-trade straits and becomes a great center of Buddhist learning."},
      {ce:690, title:"Wu Zetian takes the throne", desc:"The only woman to rule China as emperor in her own name founds a short-lived dynasty."},
      {ce:710, title:"Nara becomes capital", desc:"Japan builds its first permanent capital, opening an age of Buddhist temples and imperial chronicles."},
      {ce:711, title:"Muslims conquer Hispania", desc:"An Umayyad army crosses from Africa and topples the Visigothic kingdom, beginning eight centuries of Al-Andalus."},
      {ce:718, title:"Constantinople repels the Arabs", desc:"Byzantine walls and Greek fire break a massive Arab siege, shielding Europe from Umayyad expansion."},
      {ce:732, title:"Battle of Tours", desc:"Charles Martel halts a Muslim advance into Frankish Gaul, checking the Umayyad push into western Europe."},
      {ce:750, title:"Abbasid Revolution", desc:"The Abbasids overthrow the Umayyads and shift the Islamic world's center eastward toward Persia and Baghdad."},
      {ce:751, title:"Battle of Talas", desc:"Abbasid forces defeat the Tang in Central Asia, and Chinese papermaking begins its long spread westward."},
      {ce:755, title:"An Lushan Rebellion", desc:"A devastating revolt shatters Tang China at its peak, killing millions and weakening the dynasty forever."},
      {ce:756, title:"Emirate of Cordoba", desc:"A surviving Umayyad prince founds an independent state in Iberia, making Cordoba a jewel of learning."},
      {ce:763, title:"Tibetans sack Chang'an", desc:"A Tibetan army briefly captures the Tang capital, marking the empire's peak of military strength."},
      {ce:786, title:"Harun al-Rashid's caliphate", desc:"The Abbasid court at Baghdad reaches legendary splendor, later immortalized in the Thousand and One Nights."},
      {ce:793, title:"Viking raid on Lindisfarne", desc:"Norse raiders plunder an English monastery, announcing the Viking Age of terror and trade across Europe."},
      {ce:794, title:"Heian period begins", desc:"Japan's court moves to Kyoto, opening an age of refined aristocratic art, poetry, and courtly ritual."},
      {ce:800, title:"Charlemagne crowned emperor", desc:"The pope crowns the Frankish king in Rome, reviving a Western empire and binding church to crown."},
      {ce:802, title:"Khmer Empire founded", desc:"Jayavarman II proclaims himself universal monarch, launching the Angkor state that will dominate Southeast Asia."},
      {ce:820, title:"Al-Khwarizmi's algebra", desc:"A Baghdad scholar systematizes equations in a book whose title gives the world the word algebra."},
      {ce:825, title:"Borobudur completed", desc:"Javanese kings raise the world's largest Buddhist temple, a stone mountain carved with thousands of relief panels."},
      {ce:843, title:"Treaty of Verdun", desc:"Charlemagne's grandsons split his empire into three realms, sketching the future map of France and Germany."},
      {ce:862, title:"Rurik and the Rus", desc:"A Varangian chief takes control at Novgorod, traditionally founding the dynasty that will rule Russia."},
      {ce:868, title:"Diamond Sutra printed", desc:"A Chinese scroll becomes the world's earliest dated printed book, produced from carved woodblocks."},
      {ce:874, title:"Norse settle Iceland", desc:"Viking families sail west to colonize a volcanic island, founding a society that will produce the sagas."},
      {ce:900, title:"Classic Maya collapse", desc:"Southern lowland Maya cities are abandoned one by one as drought and war end their Classic era."},
      {ce:900, title:"Al-Razi's medical texts", desc:"The Persian physician Rhazes distinguishes smallpox from measles and writes encyclopedias studied for centuries."},
      {ce:909, title:"Fatimid Caliphate rises", desc:"A Shia dynasty seizes North Africa, challenging Baghdad and soon building Cairo as its capital."},
      {ce:918, title:"Goryeo dynasty founded", desc:"Wang Geon unites the Korean peninsula under a dynasty that gives Korea its Western name."},
      {ce:929, title:"Caliphate of Cordoba", desc:"Abd al-Rahman III declares a caliphate in Iberia, and Cordoba becomes Europe's largest, most cultured city."},
      {ce:938, title:"Vietnam wins independence", desc:"Ngo Quyen destroys a Chinese fleet on the Bach Dang River, ending a thousand years of northern rule."},
      {ce:950, title:"Toltecs build Tula", desc:"The warlike Toltecs raise their capital in central Mexico, a state later Aztecs revered as a golden age."},
      {ce:960, title:"Song dynasty founded", desc:"The Song reunify China and spark a commercial revolution of paper money, gunpowder, and printed books."},
      {ce:962, title:"Holy Roman Empire", desc:"Otto the Great is crowned emperor in Rome, tying German kingship to the imperial title for centuries."},
      {ce:969, title:"Cairo is founded", desc:"The Fatimids build a new capital on the Nile that grows into the Islamic world's greatest city."},
      {ce:987, title:"Capetian dynasty begins", desc:"Hugh Capet takes the French throne, founding a line that will rule and expand France for centuries."},
      {ce:988, title:"Rus adopt Christianity", desc:"Prince Vladimir converts and baptizes Kiev, binding the Eastern Slavs to Byzantine faith and culture."},
      {ce:1000, title:"Norse reach Vinland", desc:"Leif Erikson lands in Newfoundland, the first known European to set foot in the Americas."},
      {ce:1000, title:"Chichen Itza rises", desc:"A powerful Maya city in the Yucatan dominates the region with its stepped pyramids and sacred cenote."},
      {ce:1008, title:"Tale of Genji written", desc:"Court lady Murasaki Shikibu composes in Japan what many consider the world's first psychological novel."},
      {ce:1010, title:"Great Chola Temple", desc:"Rajaraja Chola completes a soaring granite temple at Thanjavur, a monument to South Indian imperial power."},
      {ce:1021, title:"Book of Optics", desc:"Ibn al-Haytham in Cairo explains vision and light through experiment, pioneering the modern scientific method."},
      {ce:1023, title:"World's first paper money", desc:"Song China issues government paper currency in Sichuan, centuries before Europe adopts printed banknotes."},
      {ce:1025, title:"Canon of Medicine", desc:"Avicenna compiles a medical encyclopedia taught in European universities for the next six hundred years."},
      {ce:1025, title:"Chola raid on Srivijaya", desc:"Rajendra Chola sends a fleet across the Bay of Bengal, projecting Tamil power into Southeast Asia."},
      {ce:1037, title:"Seljuk Empire rises", desc:"Turkish nomads conquer Persia and Mesopotamia, becoming the dominant new power of the Islamic east."},
      {ce:1040, title:"Movable type invented", desc:"Chinese artisan Bi Sheng crafts reusable clay characters, pioneering movable-type printing four centuries before Gutenberg."},
      {ce:1044, title:"Gunpowder formulas recorded", desc:"A Song military manual writes down recipes for gunpowder, the explosive that will transform warfare."},
      {ce:1050, title:"Cahokia at its height", desc:"A great Mississippian city near modern St. Louis raises enormous earthen mounds and houses thousands of people."},
      {ce:1054, title:"Great Schism of Christianity", desc:"Rome and Constantinople excommunicate each other, splitting Christendom into Catholic and Orthodox churches."},
      {ce:1066, title:"Norman Conquest of England", desc:"William of Normandy wins at Hastings and seizes England, transforming its language, law, and ruling class."},
      {ce:1070, title:"Marrakesh founded", desc:"The Almoravids build a Saharan capital that unites Morocco and Muslim Spain under a Berber empire."},
      {ce:1070, title:"Omar Khayyam's mathematics", desc:"The Persian polymath solves cubic equations and later reforms the calendar with remarkable accuracy."},
      {ce:1071, title:"Battle of Manzikert", desc:"Seljuk Turks capture the Byzantine emperor and open Anatolia to Turkish settlement, reshaping the region forever."},
      {ce:1077, title:"Walk to Canossa", desc:"Emperor Henry IV waits barefoot in snow to beg the pope's pardon, dramatizing church power over kings."},
      {ce:1085, title:"Christians retake Toledo", desc:"Castile captures a great Iberian city, opening its libraries of Arabic learning to Latin translators."},
      {ce:1088, title:"First universities", desc:"Bologna and others formalize higher learning in Europe."},
      {ce:1088, title:"Compass described in China", desc:"Song scholar Shen Kuo records the magnetic needle compass and its use for navigation and direction-finding."},
      {ce:1095, title:"First Crusade called", desc:"Pope Urban II urges Christians to reclaim Jerusalem, launching centuries of holy war in the Levant."},
      {ce:1099, title:"Crusaders take Jerusalem", desc:"Western knights storm the holy city in a bloody massacre and carve out crusader states in the Levant."},
      {ce:1100, title:"Polynesians settle Hawaii", desc:"Voyagers in outrigger canoes reach the remote Hawaiian islands after crossing thousands of miles of open ocean."},
      {ce:1113, title:"Angkor Wat begun", desc:"Khmer king Suryavarman II builds the world's largest religious monument, a vast temple to the god Vishnu."},
      {ce:1119, title:"Knights Templar founded", desc:"Warrior monks form to guard pilgrims in the Holy Land and grow into medieval Europe's great bankers."},
      {ce:1127, title:"Southern Song retreat", desc:"Jurchen invaders seize northern China, forcing the Song court south to a brilliant new capital at Hangzhou."},
      {ce:1147, title:"Moscow first recorded", desc:"A Rus chronicle mentions a small frontier fort that will one day rule a vast Russian empire."},
      {ce:1154, title:"Al-Idrisi's world map", desc:"A Muslim geographer creates for a Sicilian king the most accurate world map of its age."},
      {ce:1163, title:"Notre-Dame begun", desc:"Builders start the great Gothic cathedral of Paris, rising with pointed arches, flying buttresses, and stained glass."},
      {ce:1171, title:"Saladin's Ayyubid dynasty", desc:"Saladin ends Fatimid rule in Egypt and unites Muslim lands to confront the crusader states."},
      {ce:1180, title:"Averroes on Aristotle", desc:"The Cordoban philosopher writes commentaries on Aristotle that reshape thought in both Islam and Christian Europe."},
      {ce:1181, title:"Angkor Thom built", desc:"Khmer king Jayavarman VII rebuilds his capital, crowning it with the serene stone faces of the Bayon."},
      {ce:1187, title:"Saladin retakes Jerusalem", desc:"After crushing the crusaders at Hattin, Saladin recaptures the holy city and triggers the Third Crusade."},
      {ce:1192, title:"Kamakura shogunate", desc:"Minamoto no Yoritomo becomes shogun, beginning seven centuries of warrior rule over Japan."},
      {ce:1192, title:"Second Battle of Tarain", desc:"Muhammad of Ghor defeats the Rajputs, opening northern India to lasting Muslim rule."},
      {ce:1200, title:"Kingdom of Cusco", desc:"The Inca settle their highland valley capital, the small seed from which a vast Andean empire grows."},
      {ce:1200, title:"Churches of Lalibela", desc:"Ethiopian king Lalibela carves eleven churches from solid rock, creating a new Jerusalem in the highlands."},
      {ce:1204, title:"Sack of Constantinople", desc:"Crusaders turn on their Christian ally and plunder Byzantium, a wound the empire never fully recovers from."},
      {ce:1206, title:"Genghis Khan unites the Mongols", desc:"A steppe chieftain is proclaimed universal ruler, launching the largest contiguous land empire in history."},
      {ce:1206, title:"Delhi Sultanate founded", desc:"A former slave general establishes Muslim rule in northern India that will endure for three centuries."},
      {ce:1209, title:"Franciscan order founded", desc:"Francis of Assisi gathers followers to live in poverty, renewing the medieval church from within."},
      {ce:1212, title:"Las Navas de Tolosa", desc:"A Christian alliance shatters the Almohads in Iberia, tipping the Reconquista decisively against Muslim rule."},
      {ce:1215, title:"Magna Carta sealed", desc:"English barons force King John to accept legal limits on royal power, seeding later ideas of liberty."},
      {ce:1219, title:"Mongols invade Khwarezm", desc:"Genghis Khan unleashes his armies on Central Asia, annihilating great cities like Samarkand and Bukhara."},
      {ce:1227, title:"Death of Genghis Khan", desc:"The Mongol conqueror dies, leaving an empire his sons and grandsons will expand across Eurasia."},
      {ce:1235, title:"Mali Empire founded", desc:"Sundiata Keita defeats his rivals at Kirina and forges a West African empire rich in gold."},
      {ce:1240, title:"Mongols sack Kiev", desc:"Batu Khan's horde destroys the great Rus city, bringing the Russian lands under Mongol domination."},
      {ce:1241, title:"Mongols invade Europe", desc:"Mongol armies crush Polish and Hungarian knights at Legnica and Mohi before suddenly withdrawing east."},
      {ce:1250, title:"Mamluks seize Egypt", desc:"Slave soldiers overthrow their masters to rule Egypt and soon become Islam's shield against the Mongols."},
      {ce:1250, title:"Easter Island statues", desc:"Rapa Nui islanders begin carving giant stone moai to honor ancestors on one of Earth's remotest islands."},
      {ce:1258, title:"Mongols sack Baghdad", desc:"Hulagu Khan destroys the Abbasid capital and its libraries, ending the Islamic Golden Age's greatest center."},
      {ce:1260, title:"Battle of Ain Jalut", desc:"Egyptian Mamluks halt the seemingly unstoppable Mongols in Palestine, saving the Muslim heartland."},
      {ce:1261, title:"Byzantines retake Constantinople", desc:"Michael Palaiologos recovers the capital from the Latins, restoring a diminished Byzantine Empire."},
      {ce:1270, title:"Solomonic dynasty restored", desc:"A new line claiming descent from King Solomon takes Ethiopia's throne and rules into the twentieth century."},
      {ce:1271, title:"Marco Polo's journey", desc:"A young Venetian sets out for China, and his later account will dazzle Europe with tales of the East."},
      {ce:1271, title:"Kublai Khan's Yuan dynasty", desc:"The Mongol ruler proclaims a Chinese dynasty, becoming the first foreigner to rule all of China."},
      {ce:1274, title:"Mongol invasion of Japan", desc:"Kublai Khan's fleet attacks Japan but is battered by storms the Japanese call the divine wind."},
      {ce:1279, title:"Mongols conquer Song China", desc:"The last Song emperor drowns as the Mongols complete their conquest of the wealthy south."},
      {ce:1280, title:"Maori reach New Zealand", desc:"Polynesian voyagers settle the last major landmass on Earth, becoming the Maori of Aotearoa."},
      {ce:1291, title:"Fall of Acre", desc:"The Mamluks capture the last crusader stronghold, ending nearly two centuries of Christian rule in the Levant."},
      {ce:1291, title:"Swiss Confederation formed", desc:"Three Alpine cantons swear a pact of mutual defense, the seed of modern Switzerland."},
      {ce:1293, title:"Majapahit Empire founded", desc:"A Javanese prince builds a maritime empire that will dominate the Indonesian archipelago's trade and seas."},
      {ce:1299, title:"Ottoman Empire begins", desc:"Osman founds a small Anatolian state that will grow into an empire spanning three continents."},
      {ce:1300, title:"Great Zimbabwe flourishes", desc:"A powerful African kingdom builds massive stone enclosures, trading gold and ivory to the Indian Ocean coast."},
      {ce:1309, title:"Papacy moves to Avignon", desc:"The popes relocate to France for nearly seventy years, deepening doubts about the church's independence."},
      {ce:1315, title:"Great Famine of Europe", desc:"Years of cold rain ruin harvests across northern Europe, killing millions and foreshadowing worse to come."},
      {ce:1320, title:"Dante's Divine Comedy", desc:"The Florentine poet completes his epic journey through hell and heaven, shaping the Italian language."},
      {ce:1324, title:"Mansa Musa's pilgrimage", desc:"Mali's emperor crosses Africa to Mecca with so much gold that he unsettles Egypt's economy for years."},
      {ce:1325, title:"Ibn Battuta sets out", desc:"A young Moroccan begins three decades of travel across Africa and Asia, the era's greatest journey."},
      {ce:1327, title:"Djinguereber Mosque built", desc:"Mansa Musa commissions a great mud-brick mosque at Timbuktu, anchoring the city's fame for learning."},
      {ce:1331, title:"Kilwa's golden age", desc:"A Swahili city-state on the East African coast grows rich on gold, and Ibn Battuta praises its splendor."},
      {ce:1336, title:"Vijayanagara Empire founded", desc:"A powerful Hindu empire rises in southern India, resisting Muslim expansion and building a splendid capital."},
      {ce:1337, title:"Hundred Years War begins", desc:"England and France start a long dynastic struggle that will reshape both kingdoms and their identities."},
      {ce:1338, title:"Ashikaga shogunate", desc:"A new warrior government takes power in Kyoto, presiding over a flowering of Zen-inspired Japanese arts."},
      {ce:1346, title:"Battle of Crecy", desc:"English longbowmen slaughter French knights, signaling the decline of heavily armored cavalry in warfare."},
      {ce:1347, title:"Black Death reaches Europe", desc:"Plague ships dock in Sicily, unleashing a pandemic that kills perhaps a third of Europe's people."},
      {ce:1347, title:"Bahmani Sultanate founded", desc:"A breakaway Muslim kingdom forms in the Deccan, becoming a major power in southern India."},
      {ce:1350, title:"Chimu build Chan Chan", desc:"The Chimu raise the largest adobe city in the Americas on Peru's arid northern coast."},
      {ce:1368, title:"Ming dynasty founded", desc:"A peasant rebel drives out the Mongols and founds a native Chinese dynasty that rules for centuries."},
      {ce:1370, title:"Timur builds his empire", desc:"The conqueror Tamerlane rises in Samarkand and carves a brutal empire across Central Asia and Persia."},
      {ce:1377, title:"Jikji printed in Korea", desc:"Korean monks print a Buddhist text with movable metal type, the oldest such book to survive."},
      {ce:1378, title:"Western Schism", desc:"Rival popes in Rome and Avignon split the Catholic Church, dividing Europe's loyalties for decades."},
      {ce:1380, title:"Battle of Kulikovo", desc:"Moscow's prince defeats the Golden Horde, a first great step toward Russian freedom from Mongol rule."},
      {ce:1381, title:"Peasants' Revolt", desc:"English commoners march on London demanding an end to serfdom, shaking the feudal order after the plague."},
      {ce:1389, title:"Battle of Kosovo", desc:"Ottoman and Serbian armies clash in a battle that becomes central to Serbian national memory."},
      {ce:1392, title:"Joseon dynasty founded", desc:"General Yi Seong-gye seizes power in Korea, founding a Confucian dynasty that rules for five centuries."},
      {ce:1397, title:"Kalmar Union formed", desc:"Denmark, Norway, and Sweden unite under one crown, briefly binding all of Scandinavia together."},
      {ce:1398, title:"Timur sacks Delhi", desc:"Tamerlane's army storms the Indian capital, massacring its people and leaving the Delhi Sultanate in ruins."},
      {ce:1402, title:"Battle of Ankara", desc:"Timur captures the Ottoman sultan, delaying the Turkish conquest of Constantinople by half a century."},
      {ce:1405, title:"Zheng He's treasure voyages", desc:"A Chinese admiral leads huge fleets across the Indian Ocean, reaching Arabia and the East African coast."},
      {ce:1415, title:"Battle of Agincourt", desc:"Henry V's outnumbered English army destroys the French nobility in a famous triumph of the longbow."},
      {ce:1419, title:"Hussite Wars begin", desc:"Bohemian reformers rise against church and empire, foreshadowing the Protestant Reformation by a century."},
      {ce:1428, title:"Aztec Triple Alliance", desc:"Three city-states unite under Tenochtitlan, forging the empire that will dominate central Mexico."},
      {ce:1429, title:"Joan of Arc at Orleans", desc:"A peasant girl claiming visions lifts the English siege and turns the tide of the Hundred Years War."},
      {ce:1431, title:"Joan of Arc burned", desc:"The captured French heroine is tried and executed as a heretic, becoming a martyr and later a saint."},
      {ce:1431, title:"Fall of Angkor", desc:"A Siamese army sacks the Khmer capital, and the great city of Angkor is gradually abandoned."},
      {ce:1434, title:"Medici rule Florence", desc:"Cosimo de' Medici gains control of the city, and his family's wealth fuels the Italian Renaissance."},
      {ce:1436, title:"Brunelleschi's dome", desc:"An engineer crowns Florence's cathedral with a vast dome, raised without a wooden framework in a Renaissance feat."},
      {ce:1438, title:"Inca Empire expands", desc:"The ruler Pachacuti transforms a small kingdom into a vast Andean empire linked by mountain roads."},
      {ce:1440, title:"The printing press", desc:"Gutenberg's movable type makes books cheap and ideas contagious."},
      {ce:1443, title:"Hangul alphabet created", desc:"Korea's King Sejong devises a simple script so that common people can finally read and write."},
      {ce:1444, title:"Battle of Varna", desc:"The Ottomans crush a crusader army in the Balkans, sealing their grip on southeastern Europe."},
      {ce:1453, title:"Fall of Constantinople", desc:"Ottoman cannon breach the ancient walls, ending the thousand-year Byzantine Empire and shocking Christendom."},
      {ce:1453, title:"Hundred Years War ends", desc:"France expels the English at Castillon, closing a struggle that forged distinct national identities."},
      {ce:1455, title:"Wars of the Roses", desc:"Rival branches of England's royal house plunge the kingdom into decades of dynastic civil war."},
      {ce:1462, title:"Ivan the Great", desc:"Ivan III begins gathering the Russian lands and casting off Mongol overlordship to build a unified state."},
      {ce:1467, title:"Onin War begins", desc:"A succession dispute plunges Japan into the Sengoku age of warring states and near-constant civil war."},
      {ce:1469, title:"Ferdinand weds Isabella", desc:"The marriage joins the crowns of Aragon and Castile, laying the foundation for a unified Spain."},
      {ce:1478, title:"Spanish Inquisition begins", desc:"The monarchs launch a tribunal to enforce Catholic orthodoxy, persecuting converts and dissenters for centuries."},
      {ce:1480, title:"Russia sheds Mongol rule", desc:"A tense standoff on the Ugra River ends Mongol domination and confirms Moscow's full independence."},
      {ce:1485, title:"Tudor dynasty begins", desc:"Henry Tudor defeats Richard III at Bosworth, ending the Wars of the Roses and founding a famous dynasty."},
      {ce:1488, title:"Rounding the Cape", desc:"Bartolomeu Dias sails past Africa's southern tip, opening a sea route toward the riches of Asia."},
      {ce:1492, title:"Columbus reaches America", desc:"Contact between the hemispheres reshapes the entire world."},
      {ce:1492, title:"Fall of Granada", desc:"Ferdinand and Isabella capture the last Muslim kingdom in Iberia, completing the centuries-long Reconquista."},
      {ce:1494, title:"Treaty of Tordesillas", desc:"Spain and Portugal draw a line across the globe, dividing the unexplored world between the two crowns."},
      {ce:1498, title:"Vasco da Gama reaches India", desc:"The Portuguese navigator opens a sea route to India, giving Europe direct access to the spice trade."},
      {ce:1500, title:"Portugal reaches Brazil", desc:"Pedro Alvares Cabral's fleet lands on the Brazilian coast, opening South America to Portuguese colonization and trade."},
      {ce:1501, title:"Safavid dynasty founded", desc:"Ismail I seizes Tabriz and proclaims himself shah, making Twelver Shia Islam the state religion of Persia."},
      {ce:1503, title:"Leonardo paints the Mona Lisa", desc:"Leonardo da Vinci begins his enigmatic portrait, which becomes the most famous painting in the world."},
      {ce:1511, title:"Portuguese seize Malacca", desc:"Afonso de Albuquerque captures the Malay trading port, giving Portugal control of the lucrative spice route."},
      {ce:1512, title:"Sistine Chapel ceiling finished", desc:"Michelangelo completes his monumental frescoes in Rome, a defining masterpiece of the High Renaissance."},
      {ce:1513, title:"Balboa sights the Pacific", desc:"Vasco Nunez de Balboa crosses Panama and becomes the first European to see the Pacific from America."},
      {ce:1514, title:"Battle of Chaldiran", desc:"Ottoman guns crush the Safavid cavalry, checking Persian expansion and shaping the Sunni-Shia frontier for centuries."},
      {ce:1516, title:"Thomas More's Utopia", desc:"More's book imagines an ideal island society, coining a word that still names our dreams of perfection."},
      {ce:1517, title:"Luther's Ninety-five Theses", desc:"Martin Luther challenges the sale of indulgences, igniting the Protestant Reformation that split Western Christianity."},
      {ce:1519, title:"Magellan's voyage sets sail", desc:"Ferdinand Magellan leaves Spain seeking a western route to the Spice Islands, launching history's first circumnavigation."},
      {ce:1519, title:"Cortes enters Tenochtitlan", desc:"Spanish conquistadors reach the vast Aztec capital, beginning the conquest that would topple Montezuma's empire."},
      {ce:1520, title:"Suleiman the Magnificent rules", desc:"The Ottoman Empire reaches its golden age as Suleiman ascends, expanding its law, art, and territory."},
      {ce:1521, title:"Fall of Tenochtitlan", desc:"After a brutal siege, Cortes and native allies destroy the Aztec capital, ending Mexica imperial power."},
      {ce:1521, title:"Diet of Worms", desc:"Summoned before the emperor, Luther refuses to recant and is declared an outlaw of the Reich."},
      {ce:1522, title:"First voyage around the world", desc:"The battered ship Victoria returns to Spain under Elcano, proving the globe could be circled by sea."},
      {ce:1526, title:"Mughal Empire founded", desc:"Babur's cannon shatter the Delhi Sultanate at Panipat, launching an empire that would dominate India."},
      {ce:1526, title:"Battle of Mohacs", desc:"Suleiman's army annihilates the Hungarian king and nobility, opening central Europe to Ottoman power."},
      {ce:1529, title:"Ottoman siege of Vienna", desc:"Suleiman's forces reach the gates of Vienna but fail to take it, marking the empire's western high-water mark."},
      {ce:1532, title:"Machiavelli's The Prince", desc:"Published after his death, the ruthless guide to power founds modern political science and still provokes debate."},
      {ce:1532, title:"Pizarro captures Atahualpa", desc:"At Cajamarca a tiny Spanish force ambushes and seizes the Inca emperor, cracking open the Andean empire."},
      {ce:1533, title:"Execution of Atahualpa", desc:"Despite paying a room of gold in ransom, the last Inca emperor is garroted, sealing Spain's conquest."},
      {ce:1534, title:"England breaks with Rome", desc:"Henry VIII's Act of Supremacy makes the king head of the Church of England, defying the pope."},
      {ce:1536, title:"Calvin's Institutes published", desc:"John Calvin systematizes Reformed theology, shaping Protestant churches from Geneva to Scotland and New England."},
      {ce:1540, title:"Society of Jesus founded", desc:"The pope approves Ignatius Loyola's Jesuits, whose missionaries and schools spread Catholicism across the globe."},
      {ce:1543, title:"Heliocentrism", desc:"Copernicus places the Sun, not Earth, at the center — the Scientific Revolution begins."},
      {ce:1543, title:"Vesalius maps the body", desc:"His illustrated anatomy from dissected cadavers overturns ancient errors and founds modern medical science."},
      {ce:1543, title:"Europeans reach Japan", desc:"Portuguese traders shipwrecked at Tanegashima introduce firearms, transforming samurai warfare and Japanese politics."},
      {ce:1545, title:"Council of Trent opens", desc:"The Catholic Church convenes to reform itself and define doctrine, launching the Counter-Reformation against Protestantism."},
      {ce:1547, title:"Ivan the Terrible crowned", desc:"Ivan IV becomes the first tsar of all Russia, expanding and centralizing the emerging Russian state."},
      {ce:1549, title:"Christianity reaches Japan", desc:"Jesuit Francis Xavier lands at Kagoshima, beginning missionary work that wins and later alarms Japanese rulers."},
      {ce:1555, title:"Peace of Augsburg", desc:"German princes win the right to choose their realm's religion, temporarily calming Catholic and Lutheran conflict."},
      {ce:1556, title:"Akbar the Great ascends", desc:"The greatest Mughal emperor begins his reign, uniting much of India through tolerance and administrative genius."},
      {ce:1557, title:"Portugal settles Macau", desc:"Portuguese traders establish a permanent enclave on the China coast, a gateway between Europe and the Ming."},
      {ce:1565, title:"St. Augustine founded", desc:"Spanish colonists plant the oldest continuously inhabited European city in what is now the United States."},
      {ce:1565, title:"Spain colonizes the Philippines", desc:"Legazpi's expedition settles Cebu, beginning three centuries of Spanish rule across the archipelago."},
      {ce:1569, title:"Mercator projection map", desc:"Gerardus Mercator devises a chart that lets sailors plot straight compass courses, revolutionizing ocean navigation."},
      {ce:1571, title:"Battle of Lepanto", desc:"A Christian alliance destroys the Ottoman fleet, ending the myth of Turkish invincibility at sea."},
      {ce:1572, title:"St. Bartholomew's Day Massacre", desc:"Thousands of French Protestants are slaughtered in Paris and beyond, deepening the savage Wars of Religion."},
      {ce:1582, title:"Gregorian calendar introduced", desc:"Pope Gregory XIII reforms the calendar to fix the drifting date of Easter, the system we use today."},
      {ce:1588, title:"Defeat of the Spanish Armada", desc:"Storms and English ships scatter Philip II's invasion fleet, checking Spanish power and lifting England's confidence."},
      {ce:1591, title:"Fall of the Songhai Empire", desc:"Moroccan musketeers rout the vast Songhai army at Tondibi, ending West Africa's last great medieval empire."},
      {ce:1592, title:"Japan invades Korea", desc:"Hideyoshi launches the Imjin War, met by Admiral Yi's turtle ships and fierce Korean and Ming resistance."},
      {ce:1598, title:"Edict of Nantes", desc:"Henry IV grants French Protestants toleration, ending decades of religious civil war with a fragile peace."},
      {ce:1598, title:"Abbas makes Isfahan capital", desc:"Shah Abbas the Great rebuilds Isfahan into a dazzling city, marking the height of Safavid Persia."},
      {ce:1600, title:"English East India Company", desc:"A royal charter creates the trading company that would eventually conquer and rule much of India."},
      {ce:1600, title:"Giordano Bruno burned", desc:"The Inquisition executes the philosopher for heresies including an infinite universe of countless inhabited worlds."},
      {ce:1600, title:"Battle of Sekigahara", desc:"Tokugawa Ieyasu's victory unifies Japan under his clan, ending a century of ruinous civil war."},
      {ce:1603, title:"Tokugawa shogunate begins", desc:"Ieyasu becomes shogun, founding a dynasty that would rule a peaceful, isolated Japan for over two centuries."},
      {ce:1605, title:"Don Quixote published", desc:"Cervantes's tale of a deluded knight becomes the first modern novel and a cornerstone of world literature."},
      {ce:1607, title:"Jamestown founded", desc:"English settlers plant their first permanent American colony in Virginia, surviving starvation to take root."},
      {ce:1607, title:"Monteverdi's Orfeo", desc:"One of the earliest great operas premieres in Mantua, helping launch a powerful new musical art form."},
      {ce:1608, title:"Quebec City founded", desc:"Samuel de Champlain establishes the heart of New France along the St. Lawrence River."},
      {ce:1609, title:"Kepler's planetary laws", desc:"Kepler shows planets travel in ellipses, replacing perfect circles and unlocking the true shape of the heavens."},
      {ce:1610, title:"Galileo's telescope discoveries", desc:"He spots Jupiter's moons and lunar mountains, providing striking evidence for a sun-centered cosmos."},
      {ce:1611, title:"King James Bible published", desc:"The majestic English translation shapes the language and faith of the entire English-speaking world."},
      {ce:1616, title:"Death of Shakespeare", desc:"The playwright who defined English drama dies at Stratford, the same year as Cervantes in Spain."},
      {ce:1618, title:"Thirty Years War begins", desc:"The Defenestration of Prague sparks a devastating religious and dynastic war that ravages central Europe."},
      {ce:1619, title:"First Africans in Virginia", desc:"A ship brings enslaved Africans to Jamestown, seeding the racial slavery that would scar America."},
      {ce:1619, title:"Dutch found Batavia", desc:"The Dutch East India Company builds its Asian capital on Java, anchoring an empire of spice and trade."},
      {ce:1620, title:"Pilgrims land at Plymouth", desc:"Separatists aboard the Mayflower found a New England colony and sign a pioneering self-governing compact."},
      {ce:1620, title:"Bacon's Novum Organum", desc:"Francis Bacon champions experiment and inductive reasoning, laying the philosophical foundation of the scientific method."},
      {ce:1624, title:"Queen Nzinga of Ndongo", desc:"The formidable queen begins decades of diplomacy and war resisting Portuguese slavers in southwest Africa."},
      {ce:1628, title:"Harvey explains blood circulation", desc:"William Harvey proves the heart pumps blood in a continuous circuit, transforming physiology forever."},
      {ce:1632, title:"Taj Mahal begun", desc:"Shah Jahan commissions a white marble mausoleum for his beloved wife, creating an eternal symbol of love."},
      {ce:1633, title:"Galileo condemned by Rome", desc:"Forced to recant a sun-centered cosmos, the aging astronomer is sentenced to house arrest by the Inquisition."},
      {ce:1636, title:"Harvard College founded", desc:"Puritan Massachusetts establishes the first college in British America to train its ministers and leaders."},
      {ce:1637, title:"Descartes' Discourse on Method", desc:"His declaration I think, therefore I am launches modern philosophy and a new confidence in human reason."},
      {ce:1639, title:"Japan closes its borders", desc:"The shogunate expels the Portuguese and bans foreign contact, sealing Japan off for over two centuries."},
      {ce:1642, title:"English Civil War erupts", desc:"King and Parliament take up arms, a struggle that would end with a beheaded monarch and a republic."},
      {ce:1642, title:"Tasman reaches New Zealand", desc:"The Dutch navigator charts Tasmania and New Zealand, expanding European knowledge of the southern seas."},
      {ce:1644, title:"Qing dynasty conquers China", desc:"Manchu armies seize Beijing as the Ming collapse, founding the dynasty that would rule until 1912."},
      {ce:1648, title:"Peace of Westphalia", desc:"Treaties end the Thirty Years War and establish the sovereign state as the basis of modern diplomacy."},
      {ce:1649, title:"Execution of Charles I", desc:"Parliament tries and beheads the English king, a shocking blow to the divine right of monarchs."},
      {ce:1651, title:"Hobbes writes Leviathan", desc:"Hobbes argues that people surrender freedom to a sovereign to escape a brutal state of nature."},
      {ce:1652, title:"Dutch settle Cape Town", desc:"Jan van Riebeeck founds a supply station at Africa's tip, seeding a colony that reshapes southern Africa."},
      {ce:1660, title:"Royal Society founded", desc:"London natural philosophers form the pioneering scientific academy dedicated to experiment and shared knowledge."},
      {ce:1661, title:"Kangxi Emperor's long reign", desc:"China's longest-reigning emperor begins six decades of expansion, scholarship, and prosperity under the Qing."},
      {ce:1664, title:"English seize New Amsterdam", desc:"An English fleet takes the Dutch port and renames it New York, consolidating control of the Atlantic coast."},
      {ce:1665, title:"Great Plague of London", desc:"Bubonic plague kills roughly a quarter of London's people in a final catastrophic English outbreak."},
      {ce:1666, title:"Great Fire of London", desc:"Flames consume the medieval city over four days, clearing the way for a rebuilt London of brick and stone."},
      {ce:1667, title:"Milton's Paradise Lost", desc:"The blind poet's epic of Satan's rebellion and humanity's fall becomes a monument of English literature."},
      {ce:1673, title:"Marquette and Jolliet explore", desc:"The French explorers paddle the upper Mississippi, mapping a route into the heart of North America."},
      {ce:1675, title:"Greenwich Observatory founded", desc:"England builds its royal observatory to solve longitude at sea, eventually anchoring world time and maps."},
      {ce:1676, title:"Leeuwenhoek sees microbes", desc:"Peering through his handmade microscope, the Dutch draper discovers a teeming unseen world of tiny living creatures."},
      {ce:1680, title:"Pueblo Revolt", desc:"Native peoples of New Mexico rise up and expel the Spanish for over a decade, a rare colonial reversal."},
      {ce:1681, title:"Pennsylvania chartered", desc:"William Penn founds a Quaker colony promising religious freedom and fair dealing with Native Americans."},
      {ce:1682, title:"Louis XIV moves to Versailles", desc:"The Sun King installs his court in a vast palace, the dazzling stage of European absolute monarchy."},
      {ce:1683, title:"Battle of Vienna", desc:"A Polish-led relief army smashes the Ottoman siege, beginning the empire's long retreat from central Europe."},
      {ce:1685, title:"Bach and Handel born", desc:"Two titans of Baroque music are born in Germany within a month, transforming Western composition."},
      {ce:1685, title:"Edict of Nantes revoked", desc:"Louis XIV bans Protestantism, driving hundreds of thousands of skilled Huguenots to flee France."},
      {ce:1687, title:"Newton's Principia", desc:"Universal laws of motion and gravity unify heaven and Earth."},
      {ce:1688, title:"Glorious Revolution", desc:"Parliament ousts James II and invites William and Mary, cementing limited constitutional monarchy in England."},
      {ce:1689, title:"Treaty of Nerchinsk", desc:"Qing China and Russia fix their border and open trade, the first treaty China signed with a European power."},
      {ce:1690, title:"Locke's Two Treatises", desc:"John Locke argues government rests on consent and natural rights, seeding liberal and revolutionary thought."},
      {ce:1692, title:"Salem witch trials", desc:"Mass hysteria in Massachusetts sends twenty people to their deaths, a lasting warning about fear and injustice."},
      {ce:1699, title:"Treaty of Karlowitz", desc:"The Ottomans cede Hungary to Austria, confirming the empire's decline and Habsburg ascendancy in Europe."},
      {ce:1701, title:"Ashanti Empire rises", desc:"Osei Tutu unites Akan states under a golden stool, building a powerful gold- and slave-trading West African empire."},
      {ce:1703, title:"St. Petersburg founded", desc:"Peter the Great builds a new capital on Baltic marshes, his window opening Russia toward Europe."},
      {ce:1707, title:"Acts of Union create Britain", desc:"England and Scotland merge into a single kingdom, forging the state that would build a global empire."},
      {ce:1707, title:"Aurangzeb dies", desc:"The last powerful Mughal emperor's death leaves an overstretched empire that quickly fragments across India."},
      {ce:1709, title:"Battle of Poltava", desc:"Peter the Great crushes Sweden's army, ending its empire and making Russia the dominant northern power."},
      {ce:1713, title:"Treaty of Utrecht", desc:"The settlement ending the War of Spanish Succession balances Europe's powers and expands Britain's reach."},
      {ce:1720, title:"South Sea Bubble bursts", desc:"A frenzy of speculation in London stock collapses, ruining thousands in one of history's first financial crashes."},
      {ce:1721, title:"Bach's Brandenburg Concertos", desc:"Bach presents a dazzling set of concertos that stand among the supreme achievements of Baroque music."},
      {ce:1721, title:"Russian Empire proclaimed", desc:"Victorious over Sweden, Peter the Great takes the title of emperor, declaring Russia a European great power."},
      {ce:1735, title:"Linnaeus classifies life", desc:"His Systema Naturae introduces the naming system that organizes every plant and animal into ranked categories."},
      {ce:1739, title:"Nader Shah sacks Delhi", desc:"The Persian conqueror plunders the Mughal capital, carrying off the Peacock Throne and the Koh-i-Noor diamond."},
      {ce:1740, title:"War of the Austrian Succession", desc:"Frederick the Great seizes Silesia, igniting a continental war that tests the young Maria Theresa's throne."},
      {ce:1742, title:"Handel's Messiah premieres", desc:"The oratorio debuts in Dublin, its Hallelujah chorus becoming one of the most beloved works in music."},
      {ce:1748, title:"Spirit of the Laws", desc:"Montesquieu champions the separation of powers, an idea that would shape constitutions around the world."},
      {ce:1751, title:"Diderot's Encyclopedie", desc:"The first volume of the Enlightenment's great reference work appears, spreading reason, science, and skepticism."},
      {ce:1752, title:"Franklin's kite experiment", desc:"Benjamin Franklin links lightning to electricity, then invents the lightning rod to protect buildings."},
      {ce:1755, title:"Lisbon earthquake", desc:"A massive quake, fire, and tsunami destroy the Portuguese capital, shaking Enlightenment faith in a benevolent order."},
      {ce:1756, title:"Seven Years War begins", desc:"A global conflict erupts across Europe, America, and India, often called the first true world war."},
      {ce:1756, title:"Mozart is born", desc:"A child prodigy arrives in Salzburg who will become one of the greatest composers in history."},
      {ce:1757, title:"Battle of Plassey", desc:"Robert Clive's victory hands the East India Company control of Bengal, beginning British rule over India."},
      {ce:1760, title:"Industrial Revolution", desc:"Steam power and factories transform how humans make everything."},
      {ce:1762, title:"Rousseau's Social Contract", desc:"Rousseau declares that legitimate authority flows from the general will, inspiring democrats and revolutionaries."},
      {ce:1762, title:"Catherine the Great rules", desc:"Seizing the Russian throne, she expands the empire and courts the Enlightenment across a long, brilliant reign."},
      {ce:1763, title:"Treaty of Paris", desc:"Britain wins Canada and dominance in India as the Seven Years War ends, reshaping the colonial world."},
      {ce:1765, title:"Stamp Act crisis", desc:"A British tax on the colonies ignites protests over representation, fueling the road to American rebellion."},
      {ce:1768, title:"Cook's first Pacific voyage", desc:"James Cook sails to observe Venus and chart unknown coasts, opening the Pacific to European science."},
      {ce:1769, title:"Watt's improved steam engine", desc:"James Watt patents a far more efficient engine, the power source that would drive factories and locomotives."},
      {ce:1770, title:"Cook charts eastern Australia", desc:"Landing at Botany Bay, Cook claims the fertile coast for Britain, setting the stage for colonization."},
      {ce:1770, title:"Beethoven is born", desc:"The composer who would bridge the Classical and Romantic eras is born in Bonn."},
      {ce:1772, title:"First Partition of Poland", desc:"Russia, Prussia, and Austria carve up Polish territory, beginning the erasure of a once-great kingdom."},
      {ce:1773, title:"Boston Tea Party", desc:"Colonists dump British tea into Boston Harbor in defiant protest, hardening the conflict toward revolution."},
      {ce:1774, title:"Priestley isolates oxygen", desc:"Joseph Priestley identifies the gas essential to breathing and fire, a key step in the chemical revolution."},
      {ce:1775, title:"American Revolutionary War begins", desc:"Shots at Lexington and Concord launch armed rebellion between Britain and its thirteen American colonies."},
      {ce:1776, title:"American independence", desc:"A new republic founded on Enlightenment ideals."},
      {ce:1776, title:"Adam Smith's Wealth of Nations", desc:"Smith explains how markets and self-interest create prosperity, founding the discipline of modern economics."},
      {ce:1781, title:"Kant's Critique of Pure Reason", desc:"Kant redefines how the mind shapes experience, a turning point in the history of Western philosophy."},
      {ce:1781, title:"Herschel discovers Uranus", desc:"William Herschel spots a new planet with his telescope, the first found since ancient times."},
      {ce:1783, title:"First hot-air balloon flight", desc:"The Montgolfier brothers send humans aloft over Paris, achieving the ancient dream of leaving the ground."},
      {ce:1787, title:"United States Constitution", desc:"Delegates in Philadelphia draft a durable framework of federal government that would influence democracies worldwide."},
      {ce:1787, title:"Mozart's Don Giovanni", desc:"The dramatic opera about a doomed seducer premieres in Prague, blending comedy, tragedy, and the supernatural."},
      {ce:1788, title:"First Fleet reaches Australia", desc:"British ships land convicts at Sydney Cove, founding the penal colony that becomes modern Australia."},
      {ce:1789, title:"French Revolution", desc:"Revolution topples monarchy and spreads ideas of rights and citizenship."},
      {ce:1789, title:"Lavoisier's chemical revolution", desc:"His textbook names the elements and states conservation of mass, turning alchemy into a rigorous modern science."},
      {ce:1791, title:"Haitian Revolution begins", desc:"Enslaved people rise in Saint-Domingue, launching the only slave revolt to found an independent nation."},
      {ce:1792, title:"Rights of Woman vindicated", desc:"Mary Wollstonecraft argues women deserve equal education and reason, a founding text of modern feminism."},
      {ce:1793, title:"Reign of Terror", desc:"Revolutionary France executes its king and thousands more by guillotine amid radical upheaval and paranoia."},
      {ce:1793, title:"Macartney mission to China", desc:"Britain's embassy seeking trade is rebuffed by the Qianlong Emperor, exposing a widening gulf between empires."},
      {ce:1793, title:"Whitney's cotton gin", desc:"A simple machine multiplies cotton output, entrenching slavery across the American South while feeding hungry mills."},
      {ce:1796, title:"Jenner's smallpox vaccine", desc:"Edward Jenner uses cowpox to protect against smallpox, pioneering vaccination and the conquest of the disease."},
      {ce:1798, title:"Napoleon invades Egypt", desc:"His army defeats the Mamluks near the pyramids while scholars aboard rediscover ancient Egypt for Europe."},
      {ce:1799, title:"Rosetta Stone discovered", desc:"French soldiers in Egypt unearth the slab whose parallel scripts would unlock ancient hieroglyphics."},
      {ce:1799, title:"Napoleon seizes power", desc:"A coup makes Napoleon Bonaparte the ruler of France, ending the revolution and beginning his ascent."},
      {ce:1800, title:"The electric battery", desc:"Alessandro Volta stacks metal discs into the voltaic pile, giving science its first steady source of electric current."},
      {ce:1801, title:"United Kingdom is formed", desc:"Great Britain and Ireland merge their parliaments, creating the United Kingdom of Great Britain and Ireland."},
      {ce:1801, title:"First asteroid discovered", desc:"Giuseppe Piazzi spots Ceres between Mars and Jupiter, the first of countless asteroids found in the solar system."},
      {ce:1803, title:"The Louisiana Purchase", desc:"The United States buys a vast French territory for fifteen million dollars, doubling the young nation's size overnight."},
      {ce:1804, title:"Haiti wins independence", desc:"After a long slave revolt, Haiti defeats Napoleon's forces and becomes the world's first Black republic."},
      {ce:1804, title:"Napoleon crowns himself emperor", desc:"Napoleon Bonaparte crowns himself Emperor of the French in Notre-Dame, ending the republic born of revolution."},
      {ce:1804, title:"First steam locomotive", desc:"Richard Trevithick runs the first steam railway locomotive along a Welsh tramway, hauling iron and astonished passengers."},
      {ce:1805, title:"Battle of Trafalgar", desc:"Admiral Nelson destroys the French and Spanish fleets off Spain, cementing British command of the seas for a century."},
      {ce:1805, title:"Battle of Austerlitz", desc:"Napoleon outmaneuvers the combined Russian and Austrian armies, sealing his most brilliant battlefield triumph."},
      {ce:1806, title:"Holy Roman Empire ends", desc:"Under Napoleon's pressure Francis the Second abdicates, dissolving the thousand-year-old empire at Europe's heart."},
      {ce:1807, title:"Britain bans the slave trade", desc:"Parliament outlaws the Atlantic slave trade across the British Empire, a landmark victory for the abolitionist movement."},
      {ce:1807, title:"First commercial steamboat", desc:"Robert Fulton's Clermont steams up the Hudson River, launching the age of practical steam-powered navigation."},
      {ce:1808, title:"Beethoven's Fifth Symphony", desc:"Beethoven premieres his Fifth Symphony in Vienna, its four-note opening becoming the most famous phrase in music."},
      {ce:1810, title:"Mexican War of Independence", desc:"Father Miguel Hidalgo's Grito de Dolores rallies Mexicans to revolt, beginning their long war against Spanish rule."},
      {ce:1810, title:"Argentina's May Revolution", desc:"Buenos Aires ousts its Spanish viceroy, launching the movement that would free the River Plate provinces."},
      {ce:1812, title:"Napoleon invades Russia", desc:"Napoleon's vast Grande Armée reaches Moscow but is annihilated by winter, hunger, and a ruinous retreat."},
      {ce:1812, title:"The War of 1812", desc:"The United States and Britain fight again over trade and sailors' rights, burning Washington and forging new patriotism."},
      {ce:1815, title:"Battle of Waterloo", desc:"Wellington and Blücher crush Napoleon in Belgium, ending his hundred-day return and the Napoleonic Wars for good."},
      {ce:1815, title:"Congress of Vienna", desc:"Europe's great powers redraw the continent and restore old monarchies, shaping diplomacy for the next century."},
      {ce:1815, title:"Mount Tambora erupts", desc:"Indonesia's Mount Tambora explodes in history's largest eruption, chilling the globe into the year without a summer."},
      {ce:1818, title:"Frankenstein is published", desc:"Mary Shelley publishes her tale of a scientist and his tragic creature, giving birth to modern science fiction."},
      {ce:1819, title:"Bolívar liberates New Granada", desc:"Simón Bolívar's daring victory at Boyacá frees New Granada and advances his dream of a liberated South America."},
      {ce:1820, title:"Electromagnetism discovered", desc:"Hans Christian Ørsted sees a compass needle twitch near a wire, revealing the deep link between electricity and magnetism."},
      {ce:1821, title:"Mexico gains independence", desc:"After eleven years of struggle, Mexico secures its independence from Spain and becomes a sovereign nation."},
      {ce:1821, title:"Greek War of Independence", desc:"Greeks revolt against three centuries of Ottoman rule, drawing passionate support from Europe's Romantic nationalists."},
      {ce:1821, title:"San Martín frees Peru", desc:"José de San Martín enters Lima and proclaims Peru independent, crowning his liberation campaigns across the continent."},
      {ce:1822, title:"Brazil declares independence", desc:"Prince Pedro declares Brazil independent from Portugal, founding a vast American empire with little bloodshed."},
      {ce:1823, title:"The Monroe Doctrine", desc:"President Monroe warns European powers against new colonization in the Americas, staking a claim to hemispheric influence."},
      {ce:1824, title:"Battle of Ayacucho", desc:"Patriot armies rout the Spanish at Ayacucho, effectively ending three centuries of colonial rule in South America."},
      {ce:1825, title:"First public railway", desc:"England's Stockton and Darlington line opens as the world's first public railway to run steam locomotives."},
      {ce:1825, title:"The Erie Canal opens", desc:"A 363-mile canal links the Great Lakes to the Atlantic, opening America's interior and enriching New York."},
      {ce:1826, title:"The first photograph", desc:"Nicéphore Niépce fixes the earliest surviving photograph, an eight-hour exposure of rooftops from his French window."},
      {ce:1829, title:"Stephenson's Rocket triumphs", desc:"George Stephenson's Rocket wins the Rainhill Trials, establishing the design template for the modern steam locomotive."},
      {ce:1830, title:"France's July Revolution", desc:"Parisians topple the reactionary King Charles the Tenth in three days, installing the citizen-king Louis-Philippe."},
      {ce:1830, title:"First intercity railway", desc:"The Liverpool and Manchester Railway opens as the first line built to carry passengers between cities by steam."},
      {ce:1830, title:"The Indian Removal Act", desc:"The United States authorizes forcing eastern tribes off their lands, leading to the deadly Trail of Tears."},
      {ce:1831, title:"Electromagnetic induction", desc:"Michael Faraday shows that a moving magnet induces electric current, the principle behind every generator and dynamo."},
      {ce:1833, title:"Britain abolishes slavery", desc:"Parliament abolishes slavery across the British Empire, freeing some eight hundred thousand enslaved people."},
      {ce:1836, title:"The Alamo falls", desc:"Mexican troops overwhelm the Alamo's defenders, and their sacrifice rallies Texas to win independence weeks later."},
      {ce:1836, title:"The Great Trek begins", desc:"Thousands of Boers leave the British Cape Colony for the interior, reshaping the map and conflicts of southern Africa."},
      {ce:1837, title:"Queen Victoria's reign begins", desc:"Eighteen-year-old Victoria takes the British throne, beginning a reign that would define an age and a global empire."},
      {ce:1837, title:"Babbage's Analytical Engine", desc:"Charles Babbage designs a mechanical general-purpose computer, envisioning programmable calculation a century ahead of time."},
      {ce:1839, title:"First Opium War begins", desc:"Britain attacks Qing China to protect its opium trade, beginning the humiliations of China's long imperial decline."},
      {ce:1839, title:"Photography goes public", desc:"Louis Daguerre unveils the daguerreotype, the first practical photographic process, and France shares it freely with the world."},
      {ce:1840, title:"Treaty of Waitangi", desc:"Māori chiefs and the British Crown sign New Zealand's founding treaty, still disputed over sovereignty and land."},
      {ce:1842, title:"Treaty of Nanking", desc:"Defeated China cedes Hong Kong and opens ports to Britain, the first of the unequal treaties that humbled the Qing."},
      {ce:1843, title:"The first computer program", desc:"Ada Lovelace publishes an algorithm for Babbage's engine and foresees machines composing music and manipulating symbols."},
      {ce:1844, title:"The telegraph message", desc:"Samuel Morse taps a message from Washington to Baltimore, launching the age of instant long-distance communication."},
      {ce:1845, title:"The Great Irish Famine", desc:"Potato blight triggers famine that kills a million Irish and drives millions more to emigrate across the Atlantic."},
      {ce:1846, title:"Neptune is discovered", desc:"Astronomers locate Neptune precisely where mathematics predicted it, a stunning triumph for Newtonian gravitation."},
      {ce:1846, title:"Anesthesia demonstrated", desc:"A Boston surgeon publicly uses ether to operate on a painless patient, transforming surgery and banishing its agony."},
      {ce:1848, title:"Revolutions sweep Europe", desc:"Liberal and nationalist uprisings erupt from Paris to Vienna to Budapest, shaking Europe's monarchies to their foundations."},
      {ce:1848, title:"The Communist Manifesto", desc:"Karl Marx and Friedrich Engels publish their fiery pamphlet urging the workers of the world to unite against capitalism."},
      {ce:1848, title:"Seneca Falls Convention", desc:"America's first women's rights convention gathers at Seneca Falls, demanding equality and, boldly, the vote."},
      {ce:1848, title:"California Gold Rush", desc:"Gold discovered at Sutter's Mill lures hundreds of thousands to California, transforming the American West overnight."},
      {ce:1850, title:"Taiping Rebellion erupts", desc:"A visionary claiming to be Jesus's brother ignites a Chinese civil war that kills perhaps twenty million people."},
      {ce:1851, title:"The Great Exhibition", desc:"London's Crystal Palace gathers the marvels of industry from around the globe in the first great world's fair."},
      {ce:1853, title:"Perry opens Japan", desc:"Commodore Perry's black warships compel isolated Japan to open its ports, ending over two centuries of seclusion."},
      {ce:1853, title:"The Crimean War", desc:"Britain and France battle Russia over the fading Ottoman Empire, a bungled war that reformed nursing and medicine."},
      {ce:1856, title:"Bessemer steel process", desc:"Henry Bessemer devises a way to mass-produce cheap steel, remaking railways, ships, skyscrapers, and machinery."},
      {ce:1857, title:"Indian Rebellion of 1857", desc:"Indian soldiers and princes rise against the East India Company in a vast revolt that shakes British rule to its core."},
      {ce:1858, title:"The British Raj begins", desc:"After the rebellion, Britain dissolves the East India Company and places India directly under Crown rule."},
      {ce:1859, title:"Darwin's evolution", desc:"'On the Origin of Species' explains the diversity of all life."},
      {ce:1859, title:"First oil well drilled", desc:"Edwin Drake strikes oil in Pennsylvania, launching a petroleum industry that would fuel the coming century."},
      {ce:1860, title:"Garibaldi's Thousand", desc:"Giuseppe Garibaldi lands in Sicily with a thousand red-shirted volunteers and conquers the south for Italian unity."},
      {ce:1861, title:"Kingdom of Italy proclaimed", desc:"Centuries of division end as the Italian states unite into one kingdom under Victor Emmanuel the Second."},
      {ce:1861, title:"American Civil War begins", desc:"Confederate guns fire on Fort Sumter, igniting a civil war over slavery that would kill some seven hundred thousand."},
      {ce:1861, title:"Russia frees the serfs", desc:"Tsar Alexander the Second frees over twenty million serfs, the largest emancipation in Russia's imperial history."},
      {ce:1861, title:"Germ theory of disease", desc:"Louis Pasteur proves that microbes cause fermentation and spoilage, laying the foundation for germ theory and hygiene."},
      {ce:1863, title:"The Emancipation Proclamation", desc:"President Lincoln declares the enslaved in the rebel states forever free, turning the war into a fight against slavery."},
      {ce:1863, title:"First underground railway", desc:"London's Metropolitan Railway opens as the world's first underground passenger line, easing the city's crowded streets."},
      {ce:1863, title:"The Red Cross founded", desc:"Moved by battlefield horror, Henri Dunant founds the Red Cross to care for wounded soldiers of every army."},
      {ce:1865, title:"American Civil War ends", desc:"The Confederacy surrenders at Appomattox and days later an assassin kills Lincoln, ending America's bloodiest war."},
      {ce:1866, title:"Mendel's laws of heredity", desc:"Monk Gregor Mendel publishes pea-plant experiments revealing the hidden laws of heredity, ignored for decades."},
      {ce:1866, title:"Transatlantic cable succeeds", desc:"A durable telegraph cable finally spans the Atlantic seabed, letting Europe and America exchange messages in minutes."},
      {ce:1867, title:"Marx publishes Das Kapital", desc:"Karl Marx publishes the first volume of Das Kapital, his sweeping critique of capitalism and its inner contradictions."},
      {ce:1867, title:"United States buys Alaska", desc:"America buys Alaska from Russia for two cents an acre, a deal mocked as folly until gold and oil proved otherwise."},
      {ce:1867, title:"Dynamite is invented", desc:"Alfred Nobel tames nitroglycerin into stable dynamite, transforming mining and construction and later funding his prizes."},
      {ce:1867, title:"Canada is confederated", desc:"Three British colonies unite into the self-governing Dominion of Canada, a new nation stretching toward the Pacific."},
      {ce:1868, title:"The Meiji Restoration", desc:"Japan overthrows the shogun, restores the emperor, and begins a breakneck drive to modernize and industrialize."},
      {ce:1869, title:"Transcontinental railroad", desc:"A golden spike in Utah joins the rails, linking America's coasts and shrinking a cross-country journey to days."},
      {ce:1869, title:"The periodic table", desc:"Dmitri Mendeleev arranges the chemical elements by weight and property, boldly leaving gaps for elements yet unknown."},
      {ce:1870, title:"Franco-Prussian War", desc:"Prussia routs France and captures Napoleon the Third, clearing the final path to a unified German Empire."},
      {ce:1871, title:"German Empire proclaimed", desc:"The German states unite into an empire, its kaiser crowned at Versailles, upending Europe's balance of power."},
      {ce:1871, title:"The Paris Commune", desc:"Parisian workers seize their city and rule it briefly before government troops crush the commune in a bloody week."},
      {ce:1874, title:"Impressionism is born", desc:"Monet, Renoir, and friends exhibit their luminous canvases in Paris, and a scornful critic names them Impressionists."},
      {ce:1876, title:"The telephone", desc:"Voice travels instantly across distance for the first time."},
      {ce:1876, title:"Battle of Little Bighorn", desc:"Sioux and Cheyenne warriors led by Sitting Bull and Crazy Horse wipe out Custer's cavalry on the Montana plains."},
      {ce:1877, title:"Edison invents the phonograph", desc:"Thomas Edison recites into a foil cylinder and plays his voice back, the first machine to record and reproduce sound."},
      {ce:1877, title:"The Satsuma Rebellion", desc:"Disaffected samurai rise against Japan's modernizing government in a doomed revolt ending the warrior class's power."},
      {ce:1878, title:"Congress of Berlin", desc:"Europe's powers gather to redraw the Balkans and manage Ottoman decline, sowing rivalries that would fester for decades."},
      {ce:1879, title:"Electric light", desc:"Practical light bulbs begin electrifying the world."},
      {ce:1879, title:"Anglo-Zulu War", desc:"Zulu warriors annihilate a British column at Isandlwana, a stunning defeat before Britain conquers the Zulu kingdom."},
      {ce:1882, title:"Tuberculosis bacterium found", desc:"Robert Koch identifies the bacterium behind tuberculosis, then the deadliest disease, cementing the germ theory."},
      {ce:1883, title:"Krakatoa erupts", desc:"The Indonesian volcano Krakatoa explodes catastrophically, heard thousands of miles away and reddening skies worldwide."},
      {ce:1884, title:"The Berlin Conference", desc:"European powers meet to partition Africa among themselves, formalizing a scramble that ignored the continent's peoples."},
      {ce:1884, title:"Global time is standardized", desc:"Delegates fix Greenwich as the world's prime meridian, standardizing longitude and time for a railway-linked planet."},
      {ce:1885, title:"Indian National Congress founded", desc:"Educated Indians found the Congress to petition for reform, seeding the movement that would one day win independence."},
      {ce:1885, title:"Rabies vaccine succeeds", desc:"Louis Pasteur saves a boy bitten by a rabid dog with his experimental vaccine, a landmark triumph for immunization."},
      {ce:1886, title:"The automobile is born", desc:"Karl Benz patents a three-wheeled, gasoline-powered carriage, widely regarded as the first true automobile."},
      {ce:1886, title:"Statue of Liberty dedicated", desc:"France's colossal gift rises in New York harbor, becoming an enduring beacon of liberty for arriving immigrants."},
      {ce:1887, title:"Michelson-Morley experiment", desc:"A precise experiment fails to detect the ether thought to fill space, a puzzle that would help inspire modern physics."},
      {ce:1889, title:"The Eiffel Tower opens", desc:"Paris unveils Gustave Eiffel's wrought-iron tower for its world's fair, the tallest structure then on Earth."},
      {ce:1889, title:"Brazil becomes a republic", desc:"A bloodless military coup deposes Emperor Pedro the Second, turning Brazil from empire into republic."},
      {ce:1889, title:"The Second International", desc:"Socialist parties unite across borders and soon proclaim May Day, marshaling the rising power of organized labor."},
      {ce:1890, title:"Wounded Knee Massacre", desc:"US soldiers gun down hundreds of Lakota men, women, and children, the brutal close of America's Indian wars."},
      {ce:1891, title:"Trans-Siberian Railway begun", desc:"Russia begins the longest railway ever built, binding European Russia to the Pacific across the Siberian wilderness."},
      {ce:1892, title:"The diesel engine", desc:"Rudolf Diesel patents a high-efficiency engine burning cheap fuel, destined to power ships, trucks, and locomotives."},
      {ce:1893, title:"New Zealand grants women the vote", desc:"New Zealand becomes the first self-governing nation to grant women the vote, a milestone for the suffrage movement."},
      {ce:1894, title:"First Sino-Japanese War", desc:"Newly modernized Japan crushes Qing China over Korea, seizing Taiwan and stunning the world with its rise."},
      {ce:1894, title:"The Dreyfus Affair", desc:"A Jewish French officer is wrongly convicted of treason, igniting a bitter national struggle over antisemitism and justice."},
      {ce:1895, title:"X-rays are discovered", desc:"Wilhelm Röntgen discovers rays that pass through flesh to image bone, instantly revolutionizing medicine and physics."},
      {ce:1895, title:"Cinema is born", desc:"The Lumière brothers project films to a paying Paris audience, giving birth to cinema and the moving image."},
      {ce:1895, title:"Wireless telegraphy invented", desc:"Guglielmo Marconi transmits signals through the air without wires, launching radio and long-distance wireless communication."},
      {ce:1896, title:"Radioactivity discovered", desc:"Henri Becquerel discovers that uranium spontaneously emits penetrating rays, revealing the hidden energy within atoms."},
      {ce:1896, title:"First modern Olympics", desc:"Athletes from fourteen nations gather in Athens to revive the ancient Games, founding the modern Olympic movement."},
      {ce:1896, title:"Ethiopia defeats Italy", desc:"Emperor Menelik's army routs invading Italians at Adwa, keeping Ethiopia independent through the Scramble for Africa."},
      {ce:1897, title:"The electron is discovered", desc:"J.J. Thomson identifies the electron, proving atoms are divisible and opening the door to modern particle physics."},
      {ce:1898, title:"The Curies discover radium", desc:"Marie and Pierre Curie isolate radium and polonium from tons of ore, pioneering the new science of radioactivity."},
      {ce:1898, title:"Spanish-American War", desc:"The United States crushes Spain and takes Puerto Rico, Guam, and the Philippines, becoming an overseas empire."},
      {ce:1899, title:"The Second Boer War", desc:"Britain wars against the Boer republics for South Africa's gold and diamonds, notoriously herding civilians into camps."},
      {ce:1900, title:"The quantum is born", desc:"Max Planck proposes that energy comes in discrete packets, an act of desperation that founds quantum physics."},
      {ce:1900, title:"The Boxer Rebellion", desc:"Anti-foreign Boxers besiege Beijing's legations until an eight-nation army crushes them, deepening China's humiliation."},
      {ce:1901, title:"Queen Victoria dies", desc:"Britain's longest-reigning monarch until then dies after sixty-three years, closing the Victorian age she defined."},
      {ce:1901, title:"Radio crosses the Atlantic", desc:"Marconi receives a faint wireless signal transmitted across the Atlantic, proving radio could span the oceans."},
      {ce:1901, title:"Australia is federated", desc:"Six British colonies federate into the Commonwealth of Australia, a new self-governing nation on the world stage."},
      {ce:1903, title:"First powered flight", desc:"The Wright brothers fly at Kitty Hawk."},
      {ce:1904, title:"Russo-Japanese War", desc:"Japan shatters Russia's fleets and armies, the first modern triumph of an Asian power over a European empire."},
      {ce:1905, title:"Relativity", desc:"Einstein rewrites our understanding of space, time, and energy."},
      {ce:1905, title:"Russia's 1905 Revolution", desc:"After troops massacre marchers on Bloody Sunday, strikes and mutiny force the tsar to concede Russia's first parliament."},
      {ce:1907, title:"Cubism takes shape", desc:"Picasso paints Les Demoiselles d'Avignon, its fractured figures shattering tradition and pointing the way to Cubism."},
      {ce:1908, title:"The Ford Model T", desc:"Henry Ford launches the sturdy, affordable Model T, the car that would put ordinary families on the road."},
      {ce:1908, title:"The Young Turk Revolution", desc:"Reformist officers compel the Ottoman sultan to restore the constitution, a last bid to modernize the fading empire."},
