<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="theNoonLight">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>theNoonLight</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="canonical" href="https://thenoonlight.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="theNoonLight">
  <meta property="og:url" content="https://thenoonlight.com/">
  <meta name="twitter:card" content="summary">
  <style>
    :root{
      color-scheme: dark;
      --bg:    #0a0a0a;
      --text:  #f2a35c;
      --muted: #b06a34;
      --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, monospace;
    }
    *{ box-sizing: border-box; }
    html,body{ height:100%; margin:0; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display:flex; justify-content:center; align-items:center;
    }
    nav{ display:flex; flex-direction:column; gap: 26px; }
    nav a{
      color: var(--muted);
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 0.04em;
    }
    nav a:hover, nav a:focus-visible{ color: var(--text); }
    nav a:focus-visible{ outline: none; text-decoration: underline; text-underline-offset: 5px; }
    .beta{ color:#7f858f; }
  </style>
</head>
<body>
  <nav>
    <a href="/universe/">/universe</a>
    <a href="/citizen/">/citizen</a>
    <a class="beta" href="/atlas/">/atlas · beta</a>
    <a class="beta" href="/paloma/">/paloma · prototype</a>
  </nav>
</body>
</html>
