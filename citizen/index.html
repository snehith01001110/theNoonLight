<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Flashcards for the 128-question 2025 USCIS naturalization civics test. Tap to flip, shuffle to drill.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#faf9f6">
  <title>Citizen — USCIS Civics Flashcards</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="canonical" href="https://thenoonlight.com/citizen/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Citizen — USCIS Civics Flashcards">
  <meta property="og:description" content="Flashcards for the 128-question 2025 USCIS naturalization civics test.">
  <meta property="og:url" content="https://thenoonlight.com/citizen/">
  <meta name="twitter:card" content="summary">
  <style>
    :root{
      color-scheme: light;
      --bg:     #faf9f6;
      --card:   #ffffff;
      --text:   #1a1a1a;
      --muted:  #77746c;
      --edge:   #e7e4dc;
      --accent: #1b3a5b;
      --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
      --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, monospace;
    }
    *{ box-sizing: border-box; }
    html,body{ height:100%; margin:0; }
    body{
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app{
      height:100vh; height:100dvh;
      max-width: 680px;
      margin: 0 auto;
      padding: calc(14px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom));
      display:flex; flex-direction:column;
    }

    header{
      display:flex; justify-content:space-between; align-items:baseline;
      font-family: var(--mono); font-size: 0.72rem; color: var(--muted);
      flex: 0 0 auto;
    }
    header a{ color: var(--muted); text-decoration: none; }
    header a:hover{ color: var(--text); }

    /* ── the card ── */
    .stage{
      flex: 1 1 auto;
      min-height: 0;
      display:flex; flex-direction:column; justify-content:center;
      perspective: 1400px;
      padding: 16px 0;
    }
    .card{
      position: relative;
      width: 100%;
      height: 100%;
      max-height: 620px;
      min-height: 320px;
      cursor: pointer;
      outline: none;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.25, 1);
    }
    .card.flipped{ transform: rotateY(180deg); }
    .card.no-anim{ transition: none; }
    .card:focus-visible{ outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 18px; }

    .face{
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 18px;
      display: flex; flex-direction: column;
      padding: 26px 24px;
      overflow: hidden;
    }
    .face.back{ transform: rotateY(180deg); }

    .eyebrow{
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }
    .face.back .eyebrow{ color: var(--accent); }

    .content{
      flex: 1 1 auto;
      min-height: 0;
      display: flex; flex-direction: column;
      align-items: center;
      gap: 14px;
      overflow-y: auto;
      padding: 16px 0;
      text-align: center;
    }
    /* center short content, but keep the top reachable when it overflows */
    .content > :first-child{ margin-top: auto; }
    .content > :last-child{ margin-bottom: auto; }
    .question{
      font-size: clamp(1.35rem, 5vw, 1.85rem);
      font-weight: 600;
      line-height: 1.35;
      text-wrap: balance;
      margin: 0;
    }
    .answers{
      display: flex; flex-direction: column; gap: 0.55em;
      margin: 0; padding: 0; list-style: none;
      font-size: clamp(1.05rem, 4.2vw, 1.4rem);
      line-height: 1.4;
      font-weight: 500;
    }
    .answers.many{ font-size: clamp(0.92rem, 3.6vw, 1.05rem); gap: 0.4em; }
    .answers .or{
      font-family: var(--mono); font-size: 0.62rem;
      color: var(--muted); letter-spacing: 0.1em;
    }
    .glyph{ flex: 0 0 auto; color: var(--accent); }
    .glyph svg{ display: block; width: 20px; height: 20px; }

    .hint{
      flex: 0 0 auto;
      padding-top: 10px;
      font-family: var(--mono);
      font-size: 0.64rem;
      color: var(--muted);
      text-align: center;
      opacity: 0.8;
    }

    /* ── controls ── */
    .controls{
      flex: 0 0 auto;
      display: flex; justify-content: center; align-items: center;
      gap: 34px;
      padding-top: 4px;
    }
    .controls button{
      appearance: none; border: none; background: none;
      width: 48px; height: 48px;
      display: flex; justify-content: center; align-items: center;
      border-radius: 50%;
      color: var(--text);
      cursor: pointer;
      position: relative;
    }
    .controls button svg{ width: 26px; height: 26px; display: block; }
    @media (hover:hover){ .controls button:hover{ background: var(--edge); } }
    .controls button:active{ background: var(--edge); }
    .controls button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

    #shuffle{ color: var(--muted); }
    #shuffle svg{ width: 22px; height: 22px; }
    #shuffle[aria-pressed="true"]{ color: var(--accent); }
    #shuffle[aria-pressed="true"]::after{
      content: "";
      position: absolute; bottom: 5px; left: 50%;
      width: 4px; height: 4px; margin-left: -2px;
      border-radius: 50%;
      background: var(--accent);
    }

    .counter{
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      padding-top: 10px;
      font-variant-numeric: tabular-nums;
    }

    .loading{
      flex: 1 1 auto;
      display: flex; justify-content: center; align-items: center;
      font-family: var(--mono); font-size: 0.8rem; color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce){
      .card{ transition: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <a href="/">theNoonLight</a>
      <span>U.S. Civics &middot; 2025 &middot; 128</span>
    </header>

    <div class="loading" id="loading">loading&hellip;</div>

    <div class="stage" id="stage" hidden>
      <div class="card" id="card" tabindex="0" role="button"
           aria-label="Flashcard. Press Enter or tap to flip.">
        <div class="face front">
          <div class="eyebrow" id="category"></div>
          <div class="content"><p class="question" id="question"></p></div>
          <div class="hint">tap to flip</div>
        </div>
        <div class="face back">
          <div class="eyebrow">Answer</div>
          <div class="content" id="answerContent"></div>
          <div class="hint">tap to flip back</div>
        </div>
      </div>
    </div>

    <div class="controls" hidden id="controls">
      <button id="prev" aria-label="Previous card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button id="shuffle" aria-label="Shuffle mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>
      <button id="next" aria-label="Next card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="counter" id="counter" hidden></div>
  </div>

  <script>
    'use strict';

    const STORE_KEY = 'noonlight-citizen-v1';
    const N = 128;

    /* small line icons, shown on the answer side of a few cards only */
    const ICON_SVGS = {
      doc:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>',
      flag:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>',
      landmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>',
      scales:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="21"/><line x1="4" y1="6" x2="20" y2="6"/><path d="M7 6l-3 6a3 3 0 0 0 6 0z"/><path d="M17 6l-3 6a3 3 0 0 0 6 0z"/><line x1="8" y1="21" x2="16" y2="21"/></svg>'
    };
    /* card id -> icon, only where the picture genuinely reinforces the answer */
    const CARD_ICONS = {
      2: 'doc', 9: 'doc', 11: 'doc', 82: 'doc',
      52: 'scales',
      119: 'landmark', 120: 'landmark',
      121: 'flag', 122: 'flag', 123: 'flag', 125: 'flag'
    };

    let cards = [];
    let state = { mode: 'seq', seqIdx: 0, order: null, pos: 0 };

    function loadState(){
      try{
        const s = JSON.parse(localStorage.getItem(STORE_KEY));
        if (!s) return;
        if (s.mode === 'seq' || s.mode === 'shuf') state.mode = s.mode;
        if (Number.isInteger(s.seqIdx) && s.seqIdx >= 0 && s.seqIdx < N) state.seqIdx = s.seqIdx;
        if (Array.isArray(s.order) && s.order.length === N &&
            new Set(s.order).size === N && s.order.every(i => Number.isInteger(i) && i >= 0 && i < N)){
          state.order = s.order;
        }
        if (Number.isInteger(s.pos) && s.pos >= 0 && s.pos < N) state.pos = s.pos;
      }catch(e){ /* corrupted storage: start fresh */ }
      if (state.mode === 'shuf' && !state.order) state.order = shuffled();
      if (!state.order) state.pos = 0;
    }
    function saveState(){
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    }

    function shuffled(){
      const a = Array.from({length: N}, (_, i) => i);
      for (let i = N - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function currentCard(){
      return state.mode === 'shuf' ? cards[state.order[state.pos]] : cards[state.seqIdx];
    }

    const el = id => document.getElementById(id);

    function render(){
      const c = currentCard();
      el('category').textContent = c.category;
      el('question').textContent = c.question;

      const box = el('answerContent');
      box.textContent = '';
      const icon = CARD_ICONS[c.id];
      if (icon){
        const g = document.createElement('div');
        g.className = 'glyph';
        g.innerHTML = ICON_SVGS[icon];
        box.appendChild(g);
      }
      const lines = c.answer.split('\n');
      const ul = document.createElement('ul');
      ul.className = 'answers' + (lines.length > 6 ? ' many' : '');
      lines.forEach((line, i) => {
        if (i > 0 && lines.length <= 6){
          const or = document.createElement('li');
          or.className = 'or';
          or.textContent = 'or';
          or.setAttribute('aria-hidden', 'true');
          ul.appendChild(or);
        }
        const li = document.createElement('li');
        li.textContent = line;
        ul.appendChild(li);
      });
      box.appendChild(ul);

      el('counter').textContent = state.mode === 'shuf'
        ? 'Card ' + c.id
        : 'Card ' + (state.seqIdx + 1) + ' / ' + N;
    }

    function unflipInstantly(){
      const card = el('card');
      if (!card.classList.contains('flipped')) return;
      card.classList.add('no-anim');
      card.classList.remove('flipped');
      void card.offsetWidth; /* flush styles so removal below re-enables the transition */
      card.classList.remove('no-anim');
    }

    function step(dir){
      unflipInstantly();
      if (state.mode === 'shuf'){
        let pos = state.pos + dir;
        if (pos >= N){
          /* deck exhausted: reshuffle and keep going, never repeating the last card first */
          const last = state.order[N - 1];
          let next = shuffled();
          if (next[0] === last && N > 1){
            const j = 1 + Math.floor(Math.random() * (N - 1));
            [next[0], next[j]] = [next[j], next[0]];
          }
          state.order = next;
          pos = 0;
        } else if (pos < 0){
          pos = N - 1;
        }
        state.pos = pos;
      } else {
        state.seqIdx = (state.seqIdx + dir + N) % N;
      }
      saveState();
      render();
    }

    function toggleMode(){
      unflipInstantly();
      state.mode = state.mode === 'seq' ? 'shuf' : 'seq';
      if (state.mode === 'shuf' && !state.order){
        state.order = shuffled();
        state.pos = 0;
      }
      el('shuffle').setAttribute('aria-pressed', state.mode === 'shuf');
      saveState();
      render();
    }

    function flip(){
      el('card').classList.toggle('flipped');
    }

    fetch('citizen-questions.json')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => {
        cards = data;
        loadState();
        el('loading').remove();
        el('stage').hidden = false;
        el('controls').hidden = false;
        el('counter').hidden = false;
        el('shuffle').setAttribute('aria-pressed', state.mode === 'shuf');
        render();

        el('card').addEventListener('click', flip);
        el('prev').addEventListener('click', () => step(-1));
        el('next').addEventListener('click', () => step(1));
        el('shuffle').addEventListener('click', toggleMode);
        document.addEventListener('keydown', e => {
          if (e.key === 'ArrowLeft') step(-1);
          else if (e.key === 'ArrowRight') step(1);
          else if ((e.key === ' ' || e.key === 'Enter') && document.activeElement === el('card')){
            e.preventDefault(); flip();
          } else if (e.key === ' ' && document.activeElement === document.body){
            e.preventDefault(); flip();
          }
        });
      })
      .catch(() => {
        el('loading').textContent = 'could not load the questions — try refreshing.';
      });
  </script>
</body>
</html>
